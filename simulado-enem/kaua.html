<script>
const ALUNO="Kauã Cardoso", ALUNO_CURTO="Kauã", KEY="simulado-enem-kaua-v1";
const Q=[{"y": 2017, "i": 6, "d": "linguagens", "c": "**Romanos usavam redes sociais há dois mil anos, diz livro**\n\nAo tuitar ou comentar embaixo do _post_ de um de seus vários amigos no Facebook, você provavelmente se sente privilegiado por viver em um tempo na história em que é possível alcançar de forma imediata uma vasta rede de contatos por meio de um simples clique no botão “enviar”. Você talvez também reflita sobre como as gerações passadas puderam viver sem mídias sociais, desprovidas da capacidade de verem e serem vistas, de receber, gerar e interagir com uma imensa carga de informações. Mas o que você talvez não saiba é que os seres humanos usam ferramentas de interação social há mais de dois mil anos. É o que afirma Tom Standage, autor do livro _Writing on the Wall — Social Media, The first 2 000 Years_ (Escrevendo no mural — mídias sociais, os primeiros 2 mil anos, em tradução livre).\n\nSegundo Standage, Marco Túlio Cícero, filósofo e político romano, teria sido, junto com outros membros da elite romana, precursor do uso de redes sociais. O autor relata como Cícero usava um escravo, que posteriormente tornou-se seu escriba, para redigir mensagens em rolos de papiro que eram enviados a uma espécie de rede de contatos. Estas pessoas, por sua vez, copiavam seu texto, acrescentavam seus próprios comentários e repassavam adiante. “Hoje temos computadores e banda larga, mas os romanos tinham escravos e escribas que transmitiam suas mensagens”, disse Standage à BBC Brasil. “Membros da elite romana escreviam entre si constantemente, comentando sobre as últimas movimentações políticas e expressando opiniões.”\n\nAlém do papiro, outra plataforma comumente utilizada pelos romanos era uma tábua de cera do tamanho e da forma de um _tablet_ moderno, em que escreviam recados, perguntas ou transmitiam os principais pontos da _acta diurna_, um “jornal” exposto diariamente no Fórum de Roma. Essa tábua, o “iPad da Roma Antiga”, era levada por um mensageiro até o destinatário, que respondia embaixo da mensagem.\n\nNIDECKER, F. Disponível em: www.bbc.co.uk. Acesso em: 7 nov. 2013 (adaptado).", "intro": "Na reportagem, há uma comparação entre tecnologias de comunicação antigas e atuais. Quanto ao gênero mensagem, identifica-se como característica que perdura ao longo dos tempos o(a)", "a": ["Imediatismo das respostas.", "Compartilhamento de informações.", "Interferência direta de outros no texto original.", "Recorrência de seu uso entre membros da elite.", "Perfil social dos envolvidos na troca comunicativa."]}, {"y": 2020, "i": 8, "d": "linguagens", "c": "_Slam_ do Corpo é um encontro pensado para surdos e ouvintes, existente desde 2014, em São Paulo. Uma iniciativa pioneira do grupo Corposinalizante, criado em 2008. (Antes de seguirmos, vale a explicação: o termo _slam_ vem do inglês e significa — numa nova acepção para o verbo geralmente utilizado para dizer “bater com força” — a “poesia falada nos ritmos das palavras e da cidade”). Nos saraus, o primeiro objetivo foi o de botar os poemas em Libras na roda, colocar os surdos para circular e entender esse encontro entre a poesia e a língua de sinais, compreender o encontro dessas duas línguas. Poemas de autoria própria, três minutos, um microfone. Sem figurino, nem adereços, nem  acompanhamento musical. O que vale é modular a voz e o corpo, um trabalho artesanal de tornar a palavra “visível”, numa arena cujo objetivo maior é o de emocionar a plateia, tirar o público da passividade, seja pelo humor, horror,  caos, doçura e outras tantas sensações.\n\nNOVELLI. O. Poesia incorporada. Revista Continente, n. 189. set. 2016 (adaptado).", "intro": "Na prática artística mencionada no texto, o corpo assume papel de destaque ao articular diferentes linguagens com o intuito de", "a": ["Imprimir ritmo e visibilidade à expressão poética.", "Redefinir o espaço de circulação da poesia urbana.", "Estimular produções autorais de usuários de Libras.", "Traduzir expressões verbais para a língua de sinais.", "Proporcionar performances estéticas de pessoas surdas."]}, {"y": 2015, "i": 102, "d": "linguagens", "c": "**14 coisas que você não deve jogar na privada**\n\nNem no ralo. Elas poluem rios, lagos e mares, o que contamina o ambiente e os animais. Também deixa mais difícil obter a água que nós mesmos usaremos. Alguns produtos podem causar entupimentos:\n\n– cotonete  \n– medicamento e preservativo;  \n– óleo de cozinha;  \n– ponta de cigarro;  \n– poeira de varrição de casa;  \n– fio de cabelo e pelo de animais;  \n– tinta que não seja à base de água;  \n– querosene, gasolina, solvente, tíner.\n\nJogue esses produtos no lixo comum. Alguns deles, como óleo de cozinha, medicamento e tinta, podem ser levados a pontos de coleta especiais, que darão a destinação final adequada.\n\nMORGADO, M.; EMASA. Manual de etiqueta. **Planeta Sustentável**, jul.-ago. 2013 (adaptado).", "intro": "O texto tem objetivo educativo. Nesse sentido, além do foco no interlocutor, que caracteriza a função conativa da linguagem, predomina também nele a função referencial, que busca", "a": ["Despertar no leitor sentimentos de amor pela natureza, induzindo-o a ter atitudes responsáveis que beneficiarão a sustentabilidade do planeta.", "Informar o leitor sobre as consequências da destinação inadequada do lixo, orientando-o sobre como fazer o correto descarte de alguns dejetos.", "Transmitir uma mensagem de caráter subjetivo, mostrando exemplos de atitudes sustentáveis do autor do texto em relação ao planeta.", "Estabelecer uma comunicação com o leitor, procurando certificar-se de que a mensagem sobre ações de sustentabilidade está sendo compreendida.", "Explorar o uso da linguagem, conceituando detalhadamente os termos utilizados de forma a proporcionar melhor compreensão do texto."]}, {"y": 2023, "i": 26, "d": "linguagens", "c": "**A escravidão**\n\nEsses meninos que aí andam jogando peteca não viram nunca um escravo… Quando crescerem, saberão que já houve no Brasil uma raça triste, votada à escravidão e ao desespero; e verão nos museus a coleção hedionda dos troncos, dos vira-mundos e dos bacalhaus; e terão notícias dos trágicos horrores de uma época maldita: filhos arrancados ao seio das mães, virgens violadas em pranto, homens assados lentamente em fornos de cal, mulheres nuas recebendo na sua mísera nudez desvalida o duplo ultraje das chicotadas e dos olhares do feitor bestial. \\[…\\] Mas a sua indignação nunca poderá ser tão grande como a daqueles que nasceram e cresceram em pleno horror, no meio desse horrível drama de sangue e lodo, sentindo dentro do ouvido e da alma, numa arrastada e contínua melopeia, o longo gemer da raça mártir — orquestração satânica de todos os soluços, de todas as impressões, de todos os lamentos que a tortura e a injustiça podem arrancar a gargantas humanas.\n\nBILAC, O. Disponível em: www.escritas.org. Acesso em: 29 out. 2021", "intro": "Publicado em 1902, o texto de Olavo Bilac enfatiza as mazelas da escravidão no Brasil ao", "a": ["Descrever de modo impessoal as consequências da exploração racial sobre as gerações futuras.", "Contrapor a infância privilegiada das crianças da época à infância violentada das crianças escravizadas.", "Antecipar o futuro apagamento das marcas da escravidão no contexto social.", "Criticar a atenuação da violência contra os povos escravizados nas memórias retratadas pelos museus.", "Imaginar a reação de indiferença de seus contemporâneos com os escravizados libertos."]}, {"y": 2021, "i": 21, "d": "linguagens", "c": "**Texto I**\n\n**O mito da estiagem em São Paulo**\n\nOs estoques de água doce são inesgotáveis, na medida em que são alimentados principalmente pelos oceanos, infinitos via evaporação e precipitação, ou seja, pelo ciclo hidrológico, que depende de forças físicas as quais o homem nunca poderá interromper. Enquanto existirem, o ciclo funcionará e os estoques de água doce nos continentes serão repostos indefinidamente.  \nObviamente que a água não se distribui equitativamente pelo planeta. Há regiões com muita água, normalmente na zona tropical, na qual a evaporação é maior, e regiões áridas, onde, por razões específicas da dinâmica climática, as taxas de evaporação são maiores do que a precipitação, gerando déficit de reposição de estoques de água doce.\n\nDisponível em: www.cartanaescola.com.br. Acesso em: 17 jan. 2015 (adaptado)\n\n**Texto II**\n\nO processo de sedimentação no fundo do lago de reservatório é um processo lento. Os sedimentos vão formando argila, que é uma rocha impermeável. Então, a água daquele lago não vai alimentar os aquíferos. Mesmo tendo muita quantidade de água superficial, ela não consegue penetrar no solo para alimentar os aquíferos. Se não for usada no consumo, ela vai simplesmente evaporar e vai cair em outro lugar, qual os aquíferos não conseguem recuperar seu nível, porque não recebem água.\n\nDisponível em: www.jornalopcao.com.br. Acesso em: 17 jan. 2015 (adaptado)", "intro": "Os textos I e II abordam a situação dos reservatórios de água doce do planeta. Entretanto, a divergência entre eles está na ideia de que é possível", "a": ["Manter os estoques de água doce.", "Utilizar a água superficial para o consumo.", "Repor os estoques de água doce em regiões áridas.", "Reduzir as taxas de precipitação e evaporação da água.", "Equalizar a distribuição de água doce nas diferentes regiões"]}, {"y": 2019, "i": 40, "d": "linguagens", "c": "1\\. Nós queremos cantar o amor ao perigo, o hábito da energia e da temeridade.\n\n2\\. A coragem, a audácia, a rebelião serão elementos essenciais de nossa poesia.\n\n3\\. A literatura exaltou até hoje a imobilidade pensativa, o êxtase, o sono. Nós queremos exaltar o movimento agressivo, a insônia febril, o passo de corrida, o salto mortal, o bofetão e o soco.\n\n4\\. Nós afirmamos que a magnificência do mundo enriqueceu-se de uma beleza nova: a beleza da velocidade. Um automóvel de corrida com seu cofre enfeitado com tubos grossos, semelhantes a serpentes de hálito explosivo… um automóvel rugidor, que parece correr sobre a metralha, é mais bonito que a Vitória de Samotrácia.\n\n5\\. Nós queremos entoar hinos ao homem que segura o volante, cuja haste ideal atravessa a Terra, lançada também numa corrida sobre o circuito da sua órbita.\n\n6\\. É preciso que o poeta prodigalize com ardor, fausto e munificiência, para aumentar o entusiástico fervor dos elementos primordiais.\n\n**MARINETTI, F. T**. Manifesto futurista. In: TELES, G. M. Vanguardas europeias e Modernismo brasileiro. Petrópolis: Vozes, 1985.", "intro": "O documento de Marinetti, de 1909, propõe os referenciais estéticos do Futurismo, que valorizam a", "a": ["Composição estática.", "Inovação tecnológica.", "Suspensão do tempo.", "Retomada do helenismo.", "Manutenção das tradições."]}, {"y": 2016, "i": 123, "d": "linguagens", "c": "**TEXTO I**  \nEntrevistadora – eu vou conversar aqui com a professora A. D. … o português então não é uma língua difícil?  \nProfessora – olha se você parte do princípio… que a língua portuguesa não é só regras gramaticais… não se você se apaixona pela língua que você… já domina que você já fala ao chegar na escola se o teu professor cativa você a ler obras da literatura… obras da/ dos meios de comunicação… se você tem acesso a revistas… é… a livros didáticos… a… livros de literatura o mais formal o e/ o difícil é porque a escola transforma como eu já disse as aulas de língua portuguesa em análises gramaticais.\n\n**TEXTO II**  \nEntrevistadora – Vou conversar com a professora A. D. O português é uma língua difícil?  \nProfessora – Não, se você parte do princípio que a língua portuguesa não é só regras gramaticais. Ao chegar à escola, o aluno já domina e fala a língua. Se o professor motivá-lo a ler obras literárias, e se tem acesso a revistas, a livros didáticos, você se apaixona pela língua. O que torna difícil é que a escola transforma as aulas de língua portuguesa em análises gramaticais.\n\nMARCUSCHI, L. A. **Da fala para a escrita: atividades de retextualização**.  \nSão Paulo: Cortez, 2001 (adaptado).", "intro": "O Texto I é a transcrição de uma entrevista concedida por uma professora de português a um programa de rádio. O Texto II é a adaptação dessa entrevista para a modalidade escrita. Em comum, esses textos", "a": ["Apresentam ocorrências de hesitações e reformulações.", "São modelos de emprego de regras gramaticais.", "São exemplos de uso não planejado da língua.", "Apresentam marcas da linguagem literária.", "São amostras do português culto urbano."]}, {"y": 2018, "i": 27, "d": "linguagens", "c": "**Mais _big_ do que bang**\n\nA comunidade científica mundial recebeu, na semana passada, a confirmação oficial de uma descoberta sobre a qual se falava com enorme expectativa há alguns meses. Pesquisadores do Centro de Astrofísica Harvard-Smithsonian  \nrevelaram ter obtido a mais forte evidência até agora de que o universo em que vivemos começou mesmo pelo Big Bang, mas este não foi explosão, e sim uma súbita expansão de matéria e energia infinitas concentradas em um ponto microscópico que, sem muitas opções semânticas, os cientistas chamam de “singularidade”. Essa semente cósmica permanecia em estado latente e, sem que exista ainda uma explicação definitiva, começou a inchar rapidamente \\[…\\]. No intervalo de um piscar de olhos, por exemplo, seria possível, portanto, que ocorressem mais de 10 trilhões de Big Bangs.\n\nALLEGRETTI, F. **Veja**, 26 mar. 2014 (adaptado).", "intro": "No título proposto para esse texto de divulgação científica, ao dissociar os elementos da expressão Big Bang, a autora revela a intenção de", "a": ["Evidenciar a descoberta recente que comprova a explosão de matéria e energia.", "Resumir os resultados de uma pesquisa que trouxe evidências para a teoria do Big Bang.", "Sintetizar a ideia de que a teoria da expansão de matéria e energia substitui a teoria da explosão.", "Destacar a experiência que confirma uma investigação anterior sobre a teoria de matéria e energia.", "Condensar a conclusão de que a explosão de matéria e energia ocorre em um ponto microscópico."]}, {"y": 2014, "i": 124, "d": "linguagens", "c": "**Vida obscura**\n\nNinguém sentiu o teu espasmo obscuro,  \nó ser humilde entre os humildes seres,  \nembriagado, tonto de prazeres,  \no mundo para ti foi negro e duro.\n\nAtravessaste no silêncio escuro  \na vida presa a trágicos deveres  \ne chegaste ao saber de altos saberes  \ntornando-te mais simples e mais puro.\n\nNinguém te viu o sentimento inquieto,  \nmagoado, oculto e aterrador, secreto,  \nque o coração te apunhalou no mundo,\n\nMas eu que sempre te segui os passos  \nsei que cruz infernal prendeu-te os braços  \ne o teu suspiro como foi profundo!\n\nSOUSA, C. **Obra completa**. Rio de Janeiro: Nova Aguilar, 1961.", "intro": "Com uma obra densa e expressiva no Simbolismo brasileiro, Cruz e Sousa transpôs para seu lirismo uma sensibilidade em conflito com a realidade vivenciada. No soneto, essa percepção traduz-se em", "a": ["Sofrimento tácito diante dos limites impostos pela discriminação.", "Tendência latente ao vício como resposta ao isolamento social.", "Extenuação condicionada a uma rotina de tarefas degradantes.", "Frustração amorosa canalizada para as atividades intelectuais.", "Vocação religiosa manifesta na aproximação com a fé cristã."]}, {"y": 2022, "i": 8, "d": "linguagens", "c": "É ruivo? Tem olhos azuis? É homem ou mulher? Usa chapéu? Quem jogou Cara a Cara na infância sabe de cor o roteiro de perguntas para adivinhar quem é o personagem misterioso do seu oponente.\n\nAgora, o jogo está prestes a ganhar uma nova versão. A designer polonesa Zuzia Kozerska-Girard está desenvolvendo uma variação do _Guess Who?_ (nome do Cara a Cara em inglês), em que as personalidades do tabuleiro são, na verdade, mulheres notáveis da história e  \nda atualidade, como a artista Frida Kahlo, a ativista Malala Yousafzai, a astronauta Valentina Tereshkova e a aviadora Amelia Earhart. O _Who’s She?_ (“Quem é ela?”, em português) traz, no total, 28 mulheres que representam diversas profissões, nacionalidades e idades.\n\nA ideia é que, em vez de perguntar sobre a aparência das personagens, as questões sejam direcionadas aos feitos delas: ganhou algum Nobel, fez alguma descoberta? Para cada personagem há um cartão com fatos divertidos e interessantes sobre sua vida. Uma campanha entrou no ar com o objetivo de arrecadar dinheiro para desenvolver o _Who’s She?_. A meta inicial era reunir 17 mil dólares. Oito dias antes de a campanha acabar, o projeto já angariou quase 350 mil dólares.\n\nA chegada do jogo à casa do comprador varia de acordo com a quantia doada — quanto mais você doou, mais rápido vai poder jogar.\n\nDisponível em: www.super.abril.com.br. Acesso em: 4 dez. 2018 (adaptado).", "intro": "Ao divulgar a adaptação do jogo para questões relativas a ações e habilidades de mulheres notáveis, o texto busca", "a": ["Contribuir para a formação cidadã dos jogadores.", "Refutar modelos estereotipados de beleza e elegância.", "Estimular a competitividade entre potenciais compradores.", "Exemplificar estratégias de arrecadação financeira pela internet.", "Desenvolver conhecimentos lúdicos específicos dos tempos atuais."]}, {"y": 2017, "i": 81, "d": "ciencias-humanas", "c": "Estão aí, como se sabe, dois candidatos à presidência, os senhores Eduardo Gomes e Eurico Dutra, e um terceiro, o senhor Getúlio Vargas, que deve ser candidato de algum grupo político oculto, mas é também o candidato popular. Porque há dois “queremos”: o “queremos” dos que querem ver se continuam nas posições e o “queremos” popular… Afinal, o que é que o senhor Getúlio Vargas é? É fascista? É comunista? É ateu? É cristão? Quer sair? Quer ficar? O povo, entretanto, parece que gosta dele por isso mesmo, porque ele é “à moda da casa”.\n\n**A Democracia**. 16 set. 1945, apud GOMES, A. C.; D’ARAÚJO, M. C. **Getulismo e trabalhismo**. São Paulo: Ática, 1989.", "intro": "O movimento político mencionado no texto caracterizou-se por", "a": ["Reclamar a participação das agremiações partidárias.", "Apoiar a permanência da ditadura estadonovista.", "Demandar a confirmação dos direitos trabalhistas.", "Reivindicar a transição constitucional sob influência do governante.", "Resgatar a representatividade dos sindicatos sob controle social."]}, {"y": 2019, "i": 87, "d": "ciencias-humanas", "c": "O Ministério do Trabalho e Emprego (MTE) realizou 248 ações fiscais e resgatou um total de 1590 trabalhadores da situação análoga à de escravo, em 2014, em todo o país. A análise do enfrentamento do trabalho em condições análogas às de escravo materializa a efetivação de parcerias inéditas no trato da questão, podendo ser referenciadas ações fiscais realizadas com o Ministério da Defesa, Exército Brasileiro, Instituto Brasileiro do Meio Ambiente e dos Recursos Naturais Renováveis (Ibama) e Instituto Chico Mendes de Conservação da Biodiversidade (ICMBio).\n\n**Disponível em: [http://portal.mte.gov.br](http://portal.mte.gov.br/). Acesso em: 4 fev. 2015 (adaptado).**", "intro": "A estratégia defendida no texto para reduzir o problema social apontado consiste em:", "a": ["Articular os órgãos públicos.", "Pressionar o Poder Legislativo.", "Ampliar a emissão das multas.", "Limitar a autonomia das empresas.", "Financiar as pesquisas acadêmicas."]}, {"y": 2016, "i": 12, "d": "ciencias-humanas", "c": "No início de maio de 2014, a instalação da plataforma petrolífera de perfuração HYSY-981 nas águas contestadas do Mar da China Meridional suscitou especulações sobre as motivações chinesas. Na avaliação de diversos observadores ocidentais, Pequim pretendeu, com esse gesto, demonstrar que pode impor seu controle e dissuadir outros países de seguir com suas reivindicações de direito de exploração dessas águas, como é o caso do Vietnã e das Filipinas.\n\nKLARE, MT. A guerra pelo petróleo se joga no mar. **Le Monde Diplomatique Brasil**, abr. 2015.", "intro": "A ação da China em relação à situação descrita no texto evidencia um Conflito que tem como foco o(a):", "a": ["Distribuição das zonas econômicas especiais.", "Monopólio das inovações tecnológicas extrativas.", "Dinamização da atividade comercial.", "Jurisdição da soberania territorial.", "Embargo da produção industrial."]}, {"y": 2020, "i": 78, "d": "ciencias-humanas", "c": "“O toyotismo, a partir dos anos 1970, teve grande impacto no mundo ocidental, quando se mostrou para os países avançados como uma opção possível para a superação de uma crise de acumulação.”\n\n(ANTUNES, R. Os sentidos do trabalho: ensaio sobre a afirmação e a negação do trabalho. São Paulo: Boitempo. 2009. Adaptado.)", "intro": "A característica organizacional do modelo em questão, requerida no contexto de crise, foi o(a)", "a": ["Expansão dos grandes estoques.", "Incremento da fabricação em massa.", "Adequação da produção à demanda.", "Aumento da mecanização do trabalho.", "Centralização das etapas de planejamento."]}, {"y": 2015, "i": 30, "d": "ciencias-humanas", "c": "Os movimentos de massa constituem-se no deslocamento de material (solo e rocha) vertente abaixo pela influência da gravidade. As condições que favorecem os movimentos de massa dependem principalmente da estrutura geológica, da declividade da vertente, do regime de chuvas, da perda de vegetação e da atividade antrópica.\n\nBIGARELLA, J. J. **Estrutura e origem das paisagens tropicais e subtropicais**. Florianópolis: UFSC, 2003 (adaptado).", "intro": "Em relação ao processo descrito, sua ocorrência é minimizada em locais onde há", "a": ["Exposição do solo.", "Drenagem eficiente.", "Rocha matriz resistente.", "Agricultura mecanizada.", "Média pluviométrica elevada."]}, {"y": 2021, "i": 68, "d": "ciencias-humanas", "c": "O protagonismo indígena vem optando por uma estratégia de “des-invisibilização”, valendo-se da dinâmica das novas tecnologias. Em outubro de 2012, após receberem uma liminar lhes negando o direito a permanecer em suas terras, os Guarani de Pyelito Kue divulgaram uma carta na qual se dispunham a morrer, mas não a sair de suas terras. Essse fato foi amplamente divulgado, gerando uma grande mobilização na internet, que levou milhares de pessoas a escolherem seu lado, divulgando a hashtag “#somostodosGuarani-Kaiowá” ou acrescentando o sobrenome Guarani-Kaiowá a seus nomes nos perfis das principais redes sociais.\n\nCAPIBERIBE, A.; BONILLA, O. A ocupação do Congresso: contra o que lutam os índios? Estudos Avançados, n. 83, 2015 (adaptado).", "intro": "A estratégia comunicativa adotada pelos indígenas, no contexto em pauta, teve por efeito", "a": ["Enfraquecer as formas de militância política.", "Abalar a identidade de povos tradicionais.", "Inserir as comunidades no mercado global.", "Distanciar os grupos de culturas locais.", "Angariar o apoio de segmentos étnicos externos."]}, {"y": 2023, "i": 60, "d": "ciencias-humanas", "c": "Negar o pedido por dinheiro indispensável para necessidades pessoais ou comprar bens usando o nome da pessoa sem o consentimento dela. Ameaçar o corte de recursos dependendo de atitudes pessoais, esconder documentos ou trocar senhas do banco sem avisar. Ou, ainda, proibir a pessoa de trabalhar ou destruir seus pertences. As histórias são comuns, mas às vezes não são reconhecidas como abuso. Mas é uma das cinco formas de conduta contra a mulher previstas na Lei Maria da Penha.\n\nLEWGOY. J. **Conduta quase invisível destrói a vida de mulheres**. Disponível em: https://valorinveste.globo.com. Acesso em: 23 out. 2021 (adaptado).", "intro": "O texto apresenta tipos de conduta sujeitos a punição, conforme previsto na Lei Maria da Penha, porque consistem em formas de", "a": ["Ação difamatória.", "Desvio comportamental.", "Expressão preconceituosa.", "Violência patrimonial.", "Desentendimento matrimonial."]}, {"y": 2022, "i": 69, "d": "ciencias-humanas", "c": "Colegas, na mente e no coração do povo, a Crimeia sempre foi uma porção inseparável da Rússia. Essa firme convicção se baseia na verdade e na justiça e foi passada de geração em geração, ao longo do tempo, sob quaisquer circunstâncias, apesar de todas as drásticas mudanças que nosso país atravessou durante todo o século XX.\n\nDisponível em: http://g1.globo.com. Acesso em: 28 jul. 2014.", "intro": "Considerando a dinâmica geopolítica subjacente ao texto, a justificativa utilizada por Vladimir Putin, em 2014, para anexação dessa península apela para o argumento de que", "a": ["As populações com idioma comum devem estar submetidas à mesma autoridade estatal.", "O imperialismo soviético havia se acomodado às pretensões das potências vizinhas.", "Os organismos transnacionais são incapazes de solucionar disputas territoriais.", "A integração regional supõe a livre circulação de pessoas e mercadorias.", "Expulsão das forças navais ocidentais garantiria a soberania nacional."]}, {"y": 2014, "i": 2, "d": "ciencias-humanas", "c": "Sou uma pobre e velha mulher, Muito ignorante, que nem sabe ler. Mostraram-me na igreja da minha terra Um Paraíso com harpas pintado E o Inferno onde fervem almas danadas, Um enche-me de júbilo, o outro me aterra.\n\nVILLON, F. In: GOMBRICH, E. **História da arte**. Lisboa: LTC, 1999.", "intro": "Os versos do poeta francês François Villon fazem referência às imagens presentes nos templos católicos medievais. Nesse contexto, as imagens eram usadas com o objetivo de", "a": ["Refinar o gosto dos cristãos.", "Incorporar ideais heréticos.", "Educar os fiéis através do olhar.", "O divulgar a genialidade dos artistas católicos.", "Valorizar esteticamente os templos religiosos."]}, {"y": 2018, "i": 53, "d": "ciencias-humanas", "c": "Foi-se o tempo em que era possível mostrar um mundo econômico organizado em camadas bem definidas, onde grandes centros urbanos se ligavam, por si próprios, a economias adjacentes “lentas”, com o ritmo muito mais rápido do comércio e das finanças de longo alcance. Hoje tudo ocorre como se essas camadas sobrepostas estivessem mescladas e interpermeadas.  \nInterdependências de curto e longo alcance não podem mais ser separadas umas das outras.\n\nBRENNER, N. **A globalização como reterritorialização**. Cadernos Metrópole, n. 24, jul.-dez. 2010 (adaptado).", "intro": "A maior complexidade dos espaços urbanos contemporâneos ressaltada no texto explica-se pela", "a": ["Expansão de áreas metropolitanas.", "Emancipação de novos municípios.", "Consolidação de domínios jurídicos.", "Articulação de redes multiescalares.", "Redefinição de regiões administrativas."]}, {"y": 2017, "i": 92, "d": "ciencias-natureza", "c": "Os medicamentos são rotineiramente utilizados pelo ser humano com o intuito de diminuir ou, por muitas vezes, curar possíveis transtornos de saúde. Os antibióticos são grupos de fármacos inseridos no tratamento de doenças causadas por bactérias.", "intro": "Na terapêutica das doenças mencionadas, alguns desses fármacos atuam", "a": ["Ativando o sistema imunológico do hospedeiro.", "Interferindo na cascata bioquímica da inflamação.", "Removendo as toxinas sintetizadas pelas bactérias", "Combatendo as células hospedeiras das bactérias.", "Danificando estruturas específicas da célula bacteriana."]}, {"y": 2023, "i": 134, "d": "ciencias-natureza", "c": "**Avaliação de substâncias genotóxicas**\n\nO ensaio de micronúcleos é um teste de avaliação de genotoxicidade que associa a presença de micronúcleos (pequenos núcleos que aparecem próximo aos núcleos das células) com lesões genéticas. Os micronúcleos são fragmentos de DNA encapsulados, provenientes do fuso mitótico durante a divisão celular.\n\nDIAS, V. M. **Micronúcleos em células tumorais**: biologia e implicações  \npara a tumorigênese. Dissertação de Mestrado. USP, 2006 (adaptado).", "intro": "Os micronúcleos se originam dos(as)", "a": ["Nucléolos.", "Lisossomos.", "Ribossomos", "Mitocôndrias", "Cromossomos"]}, {"y": 2022, "i": 126, "d": "ciencias-natureza", "c": "A água bruta coletada de mananciais apresenta alto índice de sólidos suspensos, o que a deixa com um aspecto turvo. Para se obter uma água límpida e potável, ela deve passar por um processo de purificação numa estação de tratamento de água. Nesse processo, as principais etapas são, nesta ordem: coagulação, decantação, filtração, desinfecção e fluoretação.", "intro": "Qual é a etapa de retirada de grande parte desses sólidos?", "a": ["Coagulação.", "Decantação.", "Filtração.", "Desinfecção.", "Fluoretação."]}, {"y": 2014, "i": 87, "d": "ciencias-natureza", "c": "Quando adolescente, as nossas tardes, após as aulas, consistiam em tomar às mãos o violão e o dicionário de acordes de Almir Chediak e desafiar nosso amigo Hamilton a descobrir, apenas ouvindo o acorde, quais notas eram escolhidas. Sempre perdíamos a aposta, ele possui o ouvido absoluto.\n\nO ouvido absoluto é uma característica perceptual de poucos indivíduos capazes de identificar notas isoladas sem outras referências, isto é, sem precisar relacioná-las com outras notas de uma melodia.\n\nLENT, R. **O cérebro do meu professor de acordeão**. Disponível em: http://cienciahoje.uol.com.br. Acesso em: 15 ago. 2012 (adaptado).", "intro": "No contexto apresentado, a propriedade física das ondas que permite essa distinção entre as notas é a", "a": ["Frequência.", "Intensidade.", "Forma de onda.", "Amplitude de onda.", "Velocidade de propagação."]}, {"y": 2015, "i": 58, "d": "ciencias-natureza", "c": "Alimentos em conserva são frequentemente armazenados em latas metálicas seladas, fabricadas com um material chamado folha de flandres, que consiste de uma chapa de aço revestida com uma fina camada de estanho, metal brilhante e de difícil oxidação. É comum que a superfície interna seja ainda revestida por uma camada de verniz à base de epóxi, embora também existam latas sem esse revestimento, apresentando uma camada de estanho mais espessa.\n\nSANTANA, V. M. S. A leitura e a química das substâncias. **Cadernos PDE**. Ivaiporã: Secretaria de Estado da Educação do Paraná (SEED); Universidade Estadual de Londrina, 2010 (adaptado).", "intro": "Comprar uma lata de conserva amassada no supermercado é desaconselhável porque o amassado pode", "a": ["Alterar a pressão no interior da lata, promovendo a degradação acelerada do alimento.", "Romper a camada de estanho, permitindo a corrosão do ferro e alterações do alimento.", "Prejudicar o apelo visual da embalagem, apesar de não afetar as propriedades do alimento.", "Romper a camada de verniz, fazendo com que o metal tóxico estanho contamine o alimento.", "Desprender camadas de verniz, que se dissolverão no meio aquoso, contaminando o alimento."]}, {"y": 2016, "i": 65, "d": "ciencias-natureza", "c": "A formação de coágulos sanguíneos em veias e artérias é um dos fatores responsáveis pela ocorrência de doenças cardiovasculares, como varizes, infarto e acidentes vasculares cerebrais. A prevenção e o tratamento dessas doenças podem ser feitos com drogas anticoagulantes. A indústria farmacêutica estimula a pesquisa de toxinas animais com essa propriedade.", "intro": "Considerando as adaptações relacionadas aos hábitos alimentares, os animais adequados ao propósito dessas pesquisas são os(as)", "a": ["Moluscos fitófagos.", "Moscas saprófagas.", "Pássaros carnívoros.", "Morcegos frugívoros.", "Mosquitos hematófagos."]}, {"y": 2019, "i": 114, "d": "ciencias-natureza", "c": "Na família Retroviridae encontram-se diversos vírus que infectam aves e mamíferos, sendo caracterizada pela produção de DNA a partir de uma molécula de RNA. Alguns retrovírus infectam exclusivamente humanos, não necessitando de outros hospedeiros, reservatórios ou vetores biológicos. As infecções ocasionadas por esses vírus vêm causando mortes e grandes prejuízos ao desenvolvimento social e econômico. Nesse contexto, pesquisadores têm produzido medicamentos que contribuem para o tratamento dessas doenças.", "intro": "Que avanços tecnológicos têm contribuído para o tratamento dessas infecções virais?", "a": ["Melhoria dos métodos de controle dos vetores desses vírus.", "Fabricação de soros mutagênicos para combate desses vírus.", "Investimento da indústria em equipamentos de proteção individual.", "Produção de vacinas que evitam a infecção das células hospedeiras.", "Desenvolvimento de antirretrovirais que dificultam a reprodução desses vírus."]}, {"y": 2018, "i": 98, "d": "ciencias-natureza", "c": "Corredores ecológicos visam mitigar os efeitos da fragmentação dos ecossistemas promovendo a ligação entre diferentes áreas, com o objetivo de proporcionar o deslocamento de animais, a dispersão de sementes e o aumento da cobertura vegetal. São instituídos com base em informações como estudos sobre o deslocamento de espécies, sua área de vida (área necessária para o suprimento de suas necessidades vitais e reprodutivas) e a distribuição de suas populações.\n\nDisponível em: www.mma.gov.br. Acesso em: 30 nov. 2017 (adaptado).", "intro": "Nessa estratégia, a recuperação da biodiversidade é efetiva porque", "a": ["Propicia o fluxo gênico.", "Intensifica o manejo de espécies.", "Amplia o processo de ocupação humana.", "Aumenta o número de indivíduos nas populações.", "Favorece a formação de ilhas de proteção integral."]}, {"y": 2021, "i": 117, "d": "ciencias-natureza", "c": "Com o aumento da população de suínos no Brasil, torna-se necessária a adoção de métodos para reduzir o potencial poluidor dos resíduos dessa agroindústria, uma vez que, comparativamente ao esgoto doméstico, os dejetos suínos são 200 vezes mais poluentes. Sendo assim, a utilização desses resíduos como matéria-prima na obtenção de combustíveis é uma alternativa que permite diversificar a matriz energética nacional, ao mesmo tempo em que parte dos recursos hídricos do país são preservados.\n\nBECK, A. M. Resíduos suínos como alternativa energética sustentável. XXVII Encontro Nacional de Engenharia de Produção. Anais ENEGEP, Foz do Iguaçu, 2007 (adaptado).", "intro": "O biocombustível a que se refere o texto é o", "a": ["Etanol", "Biogás", "Butano", "Metanol", "Biodiesel"]}, {"y": 2020, "i": 127, "d": "ciencias-natureza", "c": "Plantas pioneiras são as que iniciam o processo natural de cicatrização de uma área desprovida de vegetação. Em geral, têm pequeno porte e crescem muito rápido, desenvolvem-se a pleno sol e são pouco exigentes quanto às condições do solo. Produzem grande quantidade de sementes e possuem ciclo de vida curto.\n\n(BLUM, C. T. Lista preliminar de espécies vegetais pioneiras nativas do Paraná – versão 2005. Disponível em: www.chaua.org.br. Acesso em: 10 fev. 2015.)", "intro": "Essas plantas são importantes em um projeto de restauração ambiental, pois promovem, no solo,", "a": ["Aumento da incidência de luz solar.", "Diminuição da absorção de água.", "Estabilização da umidade", "Elevação de temperatura.", "Liberação de oxigênio."]}, {"y": 2022, "i": 164, "d": "matematica", "c": "Um borrifador de atuação automática libera, a cada acionamento, uma mesma quantidade de inseticida. O recipiente desse produto, quando cheio, contém 360 mL de inseticida, que duram 60 dias se o borrifador permanecer ligado ininterruptamente e for acionado a cada 48 minutos.", "intro": "A quantidade de inseticida que é liberada a cada acionamento do borrifador, em mililitro, é", "a": ["0,125.", "0,200.", "4,800.", "6,000.", "12,000."]}, {"y": 2022, "i": 151, "d": "matematica", "c": "Um médico faz o acompanhamento clínico de um grupo de pessoas que realizam atividades físicas diariamente. Ele observou que a perda média de massa dessas pessoas para cada hora de atividade física era de 1,5 kg. Sabendo que a massa de 1 L de água é de 1 kg, ele recomendou que ingerissem, ao longo das 3 horas seguintes ao final da atividade, uma quantidade total de água correspondente a 40% a mais do que a massa perdida na atividade física, para evitar desidratação.\n\nSeguindo a recomendação médica, uma dessas pessoas ingeriu, certo dia, um total de 1,7 L de água após  \nterminar seus exercícios físicos.", "intro": "Para que a recomendação médica tenha efetivamente sido respeitada, a atividade física dessa pessoa, nesse dia, durou", "a": ["30 minutos ou menos.", "Mais de 35 e menos de 45 minutos.", "Mais de 45 e menos de 55 minutos.", "Mais de 60 e menos de 70 minutos.", "70 minutos ou mais."]}, {"y": 2021, "i": 158, "d": "matematica", "c": "Para realizar um voo entre duas cidades que distam 2 000 km uma da outra, uma companhia aérea utilizava um modelo de aeronave A, capaz de transportar até 200 passageiros. Quando uma dessas aeronaves está lotada de passageiros, o consumo de combustível é de 0,02 litro por quilômetro e por passageiro. Essa companhia resolveu trocar o modelo de aeronave A pelo modelo de aeronave B, que é capaz de transportar 10% de passageiros a mais do que o modelo A, mas consumindo 10% menos combustível por quilômetro e por passageiro.", "intro": "A quantidade de combustível consumida pelo modelo de aeronave B, em relação à do modelo de aeronave A, em um voo lotado entre as duas cidades, é", "a": ["10% menor", "1% menor", "Igual", "1% maior", "11% maior"]}, {"y": 2016, "i": 154, "d": "matematica", "c": "• Marca A: 2 g de fibras a cada 50 g de pão;  \n• Marca B: 5 g de fibras a cada 40 g de pão;  \n• Marca C: 5 g de fibras a cada 100 g de pão;  \n• Marca D: 6 g de fibras a cada 90 g de pão;  \n• Marca E: 7 g de fibras a cada 70 g de pão.\n\nRecomenda-se a ingestão do pão que possui a maior concentração de fibras.\n\nDisponível em: www.blog.saude.gov.br. Acesso em: 25 fev. 2013.", "intro": "A marca a ser escolhida é", "a": ["A", "B", "C", "D", "E"]}, {"y": 2019, "i": 158, "d": "matematica", "c": "Comum em lançamentos de empreendimentos imobiliários, as maquetes de condomínios funcionam como uma ótima ferramenta de marketing para as construtoras, pois, além de encantar clientes, auxiliam de maneira significativa os corretores na negociação e venda de imóveis.\n\nUm condomínio está sendo lançado em um novo bairro de uma cidade. Na maquete projetada pela construtora, em escala de 1 : 200, existe um reservatório de água com capacidade de 45 cm³.\n\nQuando todas as famílias estiverem residindo no condomínio, a estimativa é que, por dia, sejam consumidos 30.000 litros de água.", "intro": "Em uma eventual falta de água, o reservatório cheio será suficiente para abastecer o condomínio por quantos dias?", "a": ["30", "15", "12", "6", "3"]}, {"y": 2023, "i": 143, "d": "matematica", "c": "Em janeiro do ano passado, a direção de uma fábrica abriu uma creche para os filhos de seus funcionários, com 10 salas, cada uma com capacidade para atender 10 crianças a cada ano. As vagas são sorteadas entre os filhos dos funcionários inscritos, enquanto os não contemplados pelo sorteio formam uma lista de espera. No ano passado, a lista de espera teve 400 nomes e, neste ano, esse número cresceu 10%. A direção da fábrica realizou uma pesquisa e constatou que a lista de espera para o próximo ano terá a mesma quantidade de nomes da lista de espera deste ano. Decidiu, então, construir, ao longo desse ano, novas salas para a creche, também com capacidade de atendimento para 10 crianças cada, de modo que o número de nomes na lista de espera no próximo ano seja 25% menor que o deste ano.", "intro": "O número mínimo de salas que deverão ser construídas é", "a": ["10", "11", "12", "30", "33"]}, {"y": 2018, "i": 166, "d": "matematica", "c": "Os alunos da disciplina de estatística, em um curso universitário, realizam quatro avaliações por semestre com os pesos de 20%, 10%, 30% e 40%, respectivamente.  \nNo final do semestre, precisam obter uma média nas quatro avaliações de, no mínimo, 60 pontos para serem aprovados. Um estudante dessa disciplina obteve os seguintes pontos nas três primeiras avaliações: 46, 60 e 50, respectivamente.", "intro": "O mínimo de pontos que esse estudante precisa obter na quarta avaliação para ser aprovado é", "a": ["29,8.", "71,0.", "74,5.", "75,5.", "84,0."]}, {"y": 2017, "i": 173, "d": "matematica", "c": "Para uma temporada das corridas de Fórmula 1, a capacidade do tanque de combustível de cada carro passou a ser de 100 kg de gasolina. Uma equipe optou por utilizar uma gasolina com densidade de 750 gramas por litro, iniciando a corrida com o tanque cheio. Na primeira parada de reabastecimento, um carro dessa equipe apresentou um registro em seu computador de bordo acusando o consumo de quatro décimos da gasolina originalmente existente no tanque. Para minimizar o peso desse carro e garantir o término da corrida, a equipe de apoio reabasteceu o carro com a terça parte do que restou no tanque na chegada ao reabastecimento.\n\nDisponível em: www.superdanilof1page.com.br. Acesso em: 6 jul. 2015 (adaptado).", "intro": "A quantidade de gasolina utilizada, em litro, no reabastecimento foi", "a": ["20/0,075", "20/0,75", "20/7,5", "20 x 0,075", "20 x 0,75"]}, {"y": 2020, "i": 141, "d": "matematica", "c": "Um hotel de 3 andares está sendo construído. Cada andar terá 100 quartos. Os quartos serão numerados de 100 a 399 e cada um terá seu número afixado à porta. Cada número será composto por peças individuais, cada uma simbolizando um único algarismo.", "intro": "Qual a quantidade mínima de peças, simbolizando o algarismo 2, necessárias para identificar o número de todos os quartos?", "a": ["160", "157", "130", "120", "60"]}, {"y": 2015, "i": 157, "d": "matematica", "c": "As exportações de soja do Brasil totalizaram 4,129 milhões de toneladas no mês de julho de 2012, e registraram um aumento em relação ao mês de julho de 2011, embora tenha havido uma baixa em relação ao mês de maio de 2012.\n\nDisponível em: www.noticiasagricolas.com.br. Acesso em: 2 ago. 2012.", "intro": "A quantidade, em quilogramas, de soja exportada pelo Brasil no mês de julho de 2012 foi de", "a": ["4,129 × 10³", "4,129 × 10⁶", "4,129 × 10⁹", "4,129 × 10¹²", "4,129 × 10¹⁵"]}];
const G=[1, 2, 0, 3, 3, 1, 1, 1, 1, 3, 3, 2, 2, 3, 4, 4, 0, 4, 3, 1, 4, 1, 0, 1, 4, 4, 1, 4, 2, 0, 1, 4, 0, 2, 0, 1, 4, 0, 1, 0];

let S={resp:Array(Q.length).fill(null),cur:0,ini:null,fim:null};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.resp&&x.resp.length===Q.length)S=x}catch(e){}

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(t){
  t=esc(t.replace(/\r/g,"")).replace(/\\([.\-*_()\[\]])/g,"$1");
  t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,"$1");
  t=t.replace(/\*\*\s*([^*]+?)\s*\*\*/g,"<b>$1</b>").replace(/(^|[^\w])_([^_\n]+)_(?=[^\w]|$)/g,"$1<i>$2</i>").replace(/(\d)_([a-z])_/g,"$1<i>$2</i>");
  return t.split(/\n\s*\n/).map(p=>{p=p.trim();if(!p)return"";
    p=p.replace(/^\*\s+/gm,"• ").replace(/ {2,}\n/g,"<br>").replace(/\n/g,"<br>");
    const f=/(Disponível em|Acesso em|\(adaptado\)|\(fragmento\)|^[A-ZÁÉÍÓÚ]+,\s[A-Z])/.test(p)&&p.length<260;
    return `<p${f?' class="fonte"':''}>${p}</p>`}).join("");
}
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+"h":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
const tempo=()=>S.ini?((S.fim||Date.now())-S.ini)/1000:0;
setInterval(()=>{$("timer").textContent="⏱ "+fmt(tempo())},1000);

function comecar(){if(!S.ini){S.ini=Date.now();save()}questao()}

function questao(){
  const i=S.cur,q=Q[i],fim=!!S.fim;
  $("nav").classList.remove("hidden");
  let h=`<div class="card"><span class="tag t-${q.d}">${AREAS[q.d]}</span><span class="origem">Questão ${i+1} de ${Q.length} · ENEM ${q.y} (questão ${q.i})</span>`;
  if(q.c.trim())h+=`<div class="texto">${md(q.c)}</div>`;
  if(q.intro.trim())h+=`<div class="enun">${md(q.intro)}</div>`;
  h+=`<div class="alts">`+q.a.map((a,k)=>{const L="ABCDE"[k];let c="";
    if(fim){if(L===gab(i))c="certa";else if(S.resp[i]===L)c="errada"}else if(S.resp[i]===L)c="sel";
    return `<button class="alt ${c}" onclick="marcar('${L}')"><span class="l">${L}</span><span>${md(a).replace(/<\/?p[^>]*>/g,"")}</span></button>`}).join("")+`</div>`;
  if(fim)h+=`<p style="margin-top:12px;font-size:14px">${S.resp[i]===gab(i)?"✅ Você acertou!":`❌ Sua resposta: <b>${S.resp[i]||"em branco"}</b> · Gabarito: <b>${gab(i)}</b>`}</p>`;

  window.scrollTo(0,0);prog();
}
function marcar(L){if(S.fim)return;S.resp[S.cur]=L;save();questao()}
$("bPrev").onclick=()=>{if(S.cur>0){S.cur--;save();questao()}};

function ir(i){S.cur=i;save();fechar();questao()}

$("modal").onclick=e=>{if(e.target.id==="modal")fechar()};
function confirmar(){
  const b=Q.length-respondidas();

function finalizar(){S.fim=Date.now();save();fechar();resultado()}
function calc(){const r={tot:0,a:{}};Object.keys(AREAS).forEach(k=>r.a[k]=[0,0]);
  Q.forEach((q,i)=>{r.a[q.d][1]++;if(S.resp[i]===gab(i)){r.tot++;r.a[q.d][0]++}});return r}
function nota10(n){return (n/Q.length*10).toFixed(1).replace(".",",")}
function resultado(){
  const r=calc();$("nav").classList.add("hidden");
  const pct=Math.round(r.tot/Q.length*100);
  const msg=pct>=80?"Excelente! 🏆":pct>=60?"Muito bom! 💪":pct>=40?"Bom caminho! 📚":"Bora revisar e mandar ver! 🚀";
  let h=`<div class="card hero"><div class="emoji">🎓</div><h2>${msg}</h2><p>${ALUNO}</p>
  <div class="nota">${nota10(r.tot)}</div><p><b>${r.tot} acertos de ${Q.length}</b> (${pct}%) · tempo ${fmt(tempo())}</p></div>
  <div class="card areas"><h3 style="margin:0 0 6px">Desempenho por área</h3>`+Object.keys(AREAS).map(k=>{const[a,t]=r.a[k];
    return `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${AREAS[k]}</span><b>${a}/${t}</b></div><div class="mini"><div style="width:${a/t*100}%"></div></div></div>`}).join("")+`</div>
  <div class="card"><button class="btn g" onclick="whats()"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.4z"/></svg>Enviar resultado pelo WhatsApp</button>
  <p style="font-size:12.5px;color:#94a3b8;text-align:center;margin:10px 0 0">Vai abrir o WhatsApp com o resultado e todas as respostas prontas para enviar.</p></div>
  <div class="card rev"><h3 style="margin:0 0 6px">Correção questão por questão</h3><p style="font-size:13px;color:#94a3b8;margin:0 0 6px">Toque numa questão para ver a correção.</p>`+
  Q.map((q,i)=>{const ok=S.resp[i]===gab(i);return `<div class="item" onclick="ir(${i})"><span>${ok?"✅":"❌"} ${i+1}. ${AREAS[q.d]} <span class="origem">· ENEM ${q.y}</span></span><span>Sua: <b>${S.resp[i]||"–"}</b> · Gab: <b>${gab(i)}</b></span></div>`}).join("")+`</div>
  <div class="autora">Elaborado por <b>Dra. Gleyce Santana</b></div>`;
  $("app").innerHTML=h;window.scrollTo(0,0);prog();
}
function whats(){
  const r=calc();
  let t=`📝 *SIMULADO ENEM – RESULTADO*\n👤 ${ALUNO}\n\n🎯 *Nota: ${nota10(r.tot)}* (de 0 a 10)\n✅ ${r.tot} acertos de ${Q.length} (${Math.round(r.tot/Q.length*100)}%)\n⏱ Tempo: ${fmt(tempo())}\n\n*Por área:*\n`;
  Object.keys(AREAS).forEach(k=>t+=`• ${AREAS[k]}: ${r.a[k][0]}/${r.a[k][1]}\n`);
  t+=`\n*Respostas marcadas:*\n`+Q.map((q,i)=>`${i+1}-${S.resp[i]||"_"}${S.resp[i]===gab(i)?"✓":"✗"}`).join("  ");
  t+=`\n\n_Simulado elaborado por Dra. Gleyce Santana_`;
  window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
}
S.fim?resultado():inicio();
