<style>
:root{--azul:#22d3ee;--azul2:#7c3aed;--amarelo:#a3e635;--fundo:#0b0f1a;--texto:#e6edf3;--cinza:#94a3b8;--verde:#22c55e;--vermelho:#ef4444;--card:#151b2b;--linha:#26304a;--suave:#1d2538}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--fundo);color:var(--texto);line-height:1.5}
header{background:linear-gradient(135deg,#111827,#1e1b4b 60%,#312e81);color:#fff;padding:14px 16px;border-bottom:1px solid #3b3f8f;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.15)}

.timer{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:20px;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.5px}
.timer.warn{background:#92400e;border-color:#fbbf24;color:#fde68a}

@keyframes pisca{50%{opacity:.45}}
#aviso{position:fixed;left:12px;right:12px;top:-120px;z-index:40;color:#fff;font-weight:800;text-align:center;padding:14px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:top .35s}#aviso.on{top:12px}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:10px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,#22d3ee,#a3e635);box-shadow:0 0 10px #22d3ee;width:0;transition:width .3s}
main{max-width:720px;margin:0 auto;padding:16px 14px 110px}
.card{background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--linha);box-shadow:0 4px 18px rgba(0,0,0,.35);margin-bottom:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:4px 10px;border-radius:20px;margin-right:6px}
.t-linguagens{background:#3b0d2e;color:#f472b6}.t-ciencias-humanas{background:#3a2a05;color:#fbbf24}.t-ciencias-natureza{background:#0b3320;color:#4ade80}.t-matematica{background:#0c2a40;color:#38bdf8}
.origem{font-size:12px;color:var(--cinza)}
.texto{font-size:15.5px;margin-top:12px;overflow-wrap:anywhere}

.enun{font-weight:600;margin-top:12px;font-size:15.5px}
.alts{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.alt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--linha);background:var(--suave);border-radius:12px;padding:12px;font-size:15px;color:var(--texto);cursor:pointer;font-family:inherit;transition:all .15s}
.alt .l{flex:0 0 32px;height:32px;border-radius:50%;background:#0b0f1a;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--azul);border:1px solid var(--linha)}
.alt.sel{border-color:var(--azul);background:#0e2a36;box-shadow:0 0 12px rgba(34,211,238,.35)}
.alt.sel .l{background:var(--azul);color:#0b0f1a}
.alt.certa{border-color:var(--verde);background:#0b2a1a}.alt.certa .l{background:var(--verde);color:#fff}
.alt.errada{border-color:var(--vermelho);background:#2e0f12}.alt.errada .l{background:var(--vermelho);color:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0f1424;border-top:1px solid var(--linha);box-shadow:0 -4px 16px rgba(0,0,0,.4);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:5}
.nav .in{max-width:720px;margin:0 auto;display:flex;gap:10px;width:100%}
.btn{border:0;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.p{background:linear-gradient(90deg,#7c3aed,#2563eb);color:#fff;flex:1}.btn.s{background:var(--suave);color:var(--azul);border:1px solid var(--linha)}

.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.grid button{aspect-ratio:1;border:0;border-radius:9px;font-weight:700;font-size:13px;background:var(--suave);color:var(--cinza);cursor:pointer;font-family:inherit;border:1px solid var(--linha)}
.grid button.ok{background:var(--azul);color:#0b0f1a}
.grid button.cur{outline:3px solid var(--amarelo);outline-offset:1px}
.grid button.c{background:var(--verde);color:#fff}.grid button.e{background:var(--vermelho);color:#fff}
.hero{text-align:center;padding:26px 18px}
.hero .emoji{font-size:46px;filter:drop-shadow(0 0 12px rgba(34,211,238,.5))}
.hero h2{margin:8px 0 4px;font-size:22px}
.hero p{color:var(--cinza);margin:6px 0}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.info div{background:var(--suave);border:1px solid var(--linha);border-radius:12px;padding:12px;text-align:center;font-size:13px;color:var(--cinza)}
.info b{display:block;font-size:20px;color:var(--texto)}
.nota{font-size:68px;font-weight:900;background:linear-gradient(90deg,#22d3ee,#a3e635);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;margin:10px 0}
.areas .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--linha);font-size:15px}
.areas .row:last-child{border:0}
.mini{height:8px;background:var(--suave);border-radius:6px;overflow:hidden;margin-top:6px}
.mini>div{height:100%;background:linear-gradient(90deg,#7c3aed,#22d3ee)}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--linha);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:720px;max-height:85vh;overflow:auto}
.autora{text-align:center;font-size:12.5px;line-height:1.7;color:var(--cinza);margin:26px 0 8px}
.autora b{color:var(--azul)}
.rev{font-size:14px}
.rev .item{padding:10px 0;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.hidden{display:none!important}
.fig{margin:12px 0;text-align:center}.fig img{max-width:100%;height:auto;background:#fff;border-radius:10px;padding:6px;cursor:zoom-in}.fig span{display:block;font-size:11.5px;color:var(--cinza);margin-top:4px}
.altimg{display:block;max-width:100%;background:#fff;border-radius:8px;padding:4px;margin-bottom:4px}
#zm{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:none;overflow:auto;-webkit-overflow-scrolling:touch}#zm.on{display:block}#zm img{width:200%;max-width:none;background:#fff;display:block}#zm button{position:fixed;top:12px;right:12px;z-index:31}
#zm .dica{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#fff;font-size:13px;opacity:.8}

<script>
const ALUNO="Kauã Cardoso", ALUNO_CURTO="Kauã", KEY="simulado-enem-kaua-v2-v1";
const Q=[{"m": "Literatura", "t": "Interpretação de texto literário", "y": 2017, "i": 39, "d": "linguagens", "c": "Zé Araújo começou a cantar num tom triste, dizendo aos curiosos que começaram a chegar que uma mulher tinha se ajoelhado aos pés da santa cruz e jurado em nome de Jesus um grande  amor, mas jurou e não cumpriu,  fingiu e me enganou, pra mim você mentiu, pra Deus você pecou, o coração tem razões que a própria razão desconhece, faz promessas e juras, depois esquece.  \nO caboclo estava triste e inspirado. Depois dessa canção que arrepiou os cabelos da Neusa, emendou com uma valsa mais arretada ainda, cheia de palavras difíceis, mas bonita que só a gota serena. Era a história de uma boneca encantadora vista numa vitrine de cristal sobre o soberbo pedestal. Zé Araújo fechava os olhos e soltava a voz:\n\n  \nSeus cabelos tinham a cor/ Do sol a irradiar/  \nFulvos raios de amor./ Seus olhos eram circúnvagos/  \nDo romantismo azul dos lagos/ Mãos liriais, uns braços divinais,/\n\nUm corpo alvo sem par/ E os pésmuito pequenos./Enfim eu vi nesta boneca/ Uma perfeita Vênus.\n\nCASTRO, N. L. **As pelejas de Ojuara o homem que desafiou o diabo.** São Paulo: Arx, 2006 (adaptado).", "intro": "O comentário do narrador do romance “[…] emendou com uma valsa mais arretada ainda, cheia de palavras difíceis, mas bonita que só a gota serena” relaciona-se ao fato de que essa valsa é representativa de uma variedade linguística", "a": ["Detentora de grande prestígio social.", "Específica da modalidade oral da língua.", "Previsível para o contexto social da narrativa.", "Constituída de construções sintáticas complexas.", "Valorizadora do conteúdo em detrimento da forma."], "af": [null, null, null, null, null]}, {"m": "Português", "t": "Formação da língua portuguesa", "y": 2019, "i": 34, "d": "linguagens", "c": "     Antes de Roma ser fundada, as colinas de Alba eram ocupadas por tribos latinas, que dividiam o ano de acordo com seus deuses. Os romanos adaptaram essa estrutura. No principio dessa civilização o ano tinha dez meses e começava por Martius (atual março). Os outros dois teriam sido acrescentados por Numa Pompílio o segundo rei de Roma.\n\n     Até Júlio César reformar o calendário local, os meses eram lunares, mas as festas em homenagem aos deuses permaneciam designadas pelas estações O descompasso de dez dias por ano fazia com que, em todos os triênios, um décimo terceiro mês, o Intercalaris, tivesse que ser enxertado. Com a ajuda de matemáticos do Egito emprestados por Cleópatra, Júlio César acabou com a bagunça ao estabelecer o seguinte calendário solar: Januarius, Februarius, Martius, Aprilis, Maius, Junius, Quinctilis, Sextilis, September, October, November e December. Quase igual ao nosso, com as diferenças de que Quinctilis e Sextilis deram origem aos meses de julho e agosto.\n\n**Disponível em:** https://aventurasnahistoria.uol.com.br. _Acesso em: 8 dez. 2018._", "intro": "Considerando as informações no texto e aspectos históricos da formação da lingua, a atual escrita dos meses do ano em português", "a": ["Reflete a origem latina de nossa língua.", "Decorre de uma língua falada no Egito antigo", "Tem como base um calendário criado por Cleópatra.", "Segue a reformulação da norma da língua proposta por Júlio César.", "Resulta da padronização do calendário antes da fundação de Roma."], "af": [null, null, null, null, null]}, {"m": "Inglês", "t": "Interpretação de texto em inglês", "y": 2021, "i": 2, "d": "linguagens", "c": "The British (serves 60 million)\n\nTake some Picts, Celts and Silures  \nAnda let them settle,  \nThen overrun them with Roman conquerors.  \nRemove the Romans after approximateky 400 years  \nAdd lots of Normam French to some  \nAngle, Saxons, Jutes and Vikings, then stir vigorously.  \n\\[…\\]  \nSprinkle some fresh Indians, Malaysians, Bosnians,  \nIraqis and Bangladeshis together with some  \nAfghans, Spanish, Turkish, Kurdish, Japanese  \nAnd Palestinians  \nThen add to the melting pot.  \nLeave the ingredients to simmer.  \nAs they mix and blend allow theis languages to flourish  \nBinding them together with English.  \nAllow time to be cool.  \nAdd some ulity, understanding, and respect for the future,  \nServe with justicee  \nAnd enjoy.\n\n**Note**: All the ingredients are equally important. Treating one ingredient better than another will leave a bitter unpleasant taste.\n\n**Warning**: An unequal spread of spread of justice will damage the people and cause pais. Give justice and quality to all.\n\nDisponível em: www.benjaminzephaniah.com  \nAcesso em: 12 dez. 2018 (fragmento)", "intro": "Ao descrever o processo de formação da Inglaterra, o autor recorre a características de outro gênero textual para evidenciar", "a": ["A riqueza da mistura cultural.", "Um legado de origem geográfica.", "Um impacto de natureza histórica.", "Um problema de estratificação social.", "A questão da intolerância linguística."], "af": [null, null, null, null, null]}, {"m": "Português", "t": "Leitura e argumentação", "y": 2018, "i": 6, "d": "linguagens", "c": "“A Declaração Universal dos Direitos Humanos está completando 70 anos em tempos de desafios crescentes, quando o ódio, a discriminação e a violência permanecem vivos”, disse a diretora-geral da Organização das Nações Unidas para a Educação, a Ciência e a Cultura (Unesco), Audrey Azoulay.  \n“Ao final da Segunda Guerra Mundial, a humanidade inteira resolveu promover a dignidade humana em todos os lugares e para sempre. Nesse espírito, as Nações Unidas adotaram a Declaração Universal dos Direitos Humanos como um padrão comum de conquistas para todos os povos e todas as nações”, disse Audrey.  \n“Centenas de milhões de mulheres e homens são destituídos e privados de condições básicas de subsistência e de oportunidades. Movimentos populacionais forçados geram violações aos direitos em uma escala sem precedentes. A Agenda 2030 para o Desenvolvimento Sustentável promete não deixar ninguém para trás – e os direitos humanos devem ser o alicerce para todo o progresso.”  \nSegundo ela, esse processo precisa começar o quanto antes nas carteiras das escolas. Diante disso, a Unesco lidera a educação em direitos humanos para  \nassegurar que todas as meninas e meninos saibam seus direitos e os direitos dos outros.\n\nDisponível em: https://nacoesunidas.org. Acesso em: 3 abr. 2018 (adaptado).", "intro": "Defendendo a ideia de que “os direitos humanos devem ser o alicerce para todo o progresso”, a diretora-geral da Unesco aponta, como estratégia para atingir esse fim, a", "a": ["Inclusão de todos na Agenda 2030.", "Extinção da intolerância entre os indivíduos.", "Discussão desse tema desde a educação básica.", "Conquista de direitos para todos os povos e nações.", "Promoção da dignidade humana em todos os lugares."], "af": [null, null, null, null, null]}, {"m": "Literatura", "t": "Poesia moderna", "y": 2016, "i": 121, "d": "linguagens", "c": "**Antiode**  \nPoesia, não será esse  \no sentido em que  \nainda te escrevo:  \nflor! (Te escrevo:  \nflor! Não uma  \nflor, nem aquela  \nflor-Virtude – em disfarçados urinóis).  \nFlor é a palavra  \nflor; verso inscrito  \nno verso, como as  \nmanhãs no tempo.  \nFlor é o salto  \nda ave para o voo:  \no saltofora do sono  \nquando seu tecido  \nse rompe; é uma explosão  \nposta a funcionar,  \ncomo uma máquina,  \numa jarra de flores.\n\nMELO NETO, J. C. **Psicologia da composição** Rio de Janeiro Nova Fronteira, 1997 (fragmento)", "intro": "A poesia é marcada pela recriação do objeto por meio da linguagem, sem necessariamente explicá-lo. Nesse fragmento de João Cabral de Melo Neto, poeta da geração de 1945, o sujeito lírico propõe a recriação poética de", "a": ["Uma palavra, a partir de imagens com as quais ela pode ser comparada, a fim de assumir novos significados.", "Um urinol, em referência às artes visuais ligadas às vanguardas do início do século XX.", "Uma ave, que compõe, com seus movimentos, uma imagem historicamente ligada à palavra poética.", "Uma máquina, levando em consideração a relevância do discurso técnico-científico pós-Revolução Industrial.", "Um tecido, visto que sua composição depende de elementos intrínsecos ao eu lírico."], "af": [null, null, null, null, null]}, {"m": "Literatura", "t": "Música e cultura brasileira", "y": 2020, "i": 12, "d": "linguagens", "c": "**TEXTO I**\n\nÉ pau, é pedra, é o fim do caminho  \nÉ um resto de toco, é um pouco sozinho  \nÉ um caco de vidro, é a vida, é o sol  \nÉ a noite, é a morte, é o laço, é o anzol  \nÉ peroba-do-campo, é o nó da madeira  \nCaingá, candeia, é o matita-pereira\n\nTOM JOBIM. Águas de março. O **Tom de Jobim e o tal de João Bosco** (disco de bolso). Salvador: Zen Produtora, 1972 (fragmento).\n\n**TEXTO II**  \nA inspiração súbita e certeira do compositor serve ainda de exemplo do lema antigo: nada vem do nada. Para ninguém, nem mesmo para Tom Jobim. Duas fontes são razoavelmente conhecidas. A primeira é o poema O caçador de esmeraldas, do mestre parnasiano Olavo Bilac: “Foi em março, ao findar da chuva, quase à entrada/ do outono, quando a terra em sede requeimada/  \nbebera longamente as águas da estação \\[…\\]”. E a outra é um ponto de macumba, gravado com sucesso por J. B. Carvalho, do Conjunto Tupi: “É pau, é pedra, é seixo miúdo, roda a baiana por cima de tudo”. Combinar Olavo  \nBilac e macumba já seria bom; mas o que se vê em Águas de março vai muito além: tudo se transforma numa outra coisa e numa outra música, que recompõem o mundo para nós.  \nNESTROVSKI, A, O samba mais bonito do mundo. In: **Três** **canções de Tom Jobim**. São Paulo: Cosac Naify, 2004", "intro": "Ao situar a composição no panorama cultural brasileiro, o Texto II destaca o(a)", "a": ["Diálogo que a letra da canção estabelece com diferentes tradições da cultura nacional.", "Singularidade com que o compositor converte referências eruditas em populares.", "Caráter inovador com que o compositor concebe o processo de criação artística.", "Relativização que a letra da canção promove na concepção tradicional de originalidade.", "O resgate que a letra da canção promove de obras pouco conhecidas pelo público no país."], "af": [null, null, null, null, null]}, {"m": "Português", "t": "Semântica (sentido dos verbos)", "y": 2014, "i": 111, "d": "linguagens", "c": "E se a água potável acabar? O que aconteceria se a água potável do mundo acabasse?\n\nAs teorias mais pessimistas dizem que a água potável deve acabar logo, em 2050. Nesse ano, ninguém mais tomará banho todo dia. Chuveiro com água só duas vezes por semana. Se alguém exceder 55 litros de consumo (metade do que a ONU recomenda), seu abastecimento será interrompido. Nos mercados, não haveria carne, pois, se não há água para você, imagine para o gado. Gastam-se 43 mil litros de água para produzir 1 kg de carne. Mas, não é só ela que faltará. A Região Centro-Oeste do Brasil, maior produtor de grãos da América Latina em 2012, não conseguiria manter a produção. Afinal, no país a agricultura e a agropecuária são, hoje, as maiores consumidoras de água, com mais de 70% do uso. Faltariam arroz, feijão, soja, milho e outros grãos.\n\nDisponível em: http://super.abril.com.br. Acesso em: 30 jul. 2012\n\nA língua portuguesa dispõe de vários recursos para indicar a atitude do falante em relação ao conteúdo de seu enunciado.", "intro": "No início do texto, o verbo “dever” contribui para expressar", "a": ["Uma constatação sobre como as pessoas administram os recursos hídricos.", "A habilidade das comunidades em lidar com problemas ambientais contemporâneos.", "A capacidade humana de substituir recursos naturais renováveis.", "Uma previsão trágica a respeito das fontes de água potável.", "Uma situação ficcional com base na realidade ambiental brasileira."], "af": [null, null, null, null, null]}, {"m": "Literatura", "t": "Poesia (eu lírico)", "y": 2023, "i": 13, "d": "linguagens", "c": "Girassol da madrugada  \nTeu dedo curioso me segue lento no rosto  \nOs sulcos, as sombras machucadas por onde a  \n\\[vida passou.  \nQue silêncio, prenda minha… Que desvio triunfal  \n\\[da verdade,  \nQue círculos vagarosos na lagoa em que uma asa  \n\\[gratuita roçou..\n\nTive quatro amores eternos…  \nO primeiro era moça donzela,  \nO segundo… eclipse, boi que fala, cataclisma,  \nO terceiro era a rica senhora,  \nO quarto és tu… E eu afinal me repousei dos  \n\\[meus cuidados\n\nANDRADE, M. Poesias completas. Rio de Janeiro: Nova Fronteira, 2013 (fragmento).", "intro": "Perante o outro, o eu lírico revela, na força das memórias evocadas, a", "a": ["Vergonha das marcas provocadas pela passagem do tempo.", "Indecisão em face das possibilidades afetivas do presente.", "Serenidade sedimentada pela entrega pacifica ao desejo.", "Frustração causada pela vontade de retorno ao passado.", "Disponibilidade para a exploração do prazer efêmero."], "af": [null, null, null, null, null]}, {"m": "Artes", "t": "História da arte (Maneirismo)", "y": 2022, "i": 38, "d": "linguagens", "c": "**TEXTO I**\n\n![](img/2022-38-0.jpg)\n\nEL GRECO. **Laocoonte**. Óleo sobre tela, 1,37cm x 1,72cm.\n\nNational Gallery of Art, Washington, Estados Unidos, circa 1610-  \n1614\\. Disponível em: https://images.nga.gov. Acesso em: 28 jun  \n2019 (adaptado).\n\n**TEXTO II**\n\nEssa impressionante obra apresenta o sacerdote Laocoonte sendo punido pelos deuses por tentar alertar os troianos da ameaça do Cavalo de Troia, que escondia um grupo de soldados gregos. Enviadas pelos deuses, serpentes marinhas são vistas matando Laocoonte e seus dois filhos como forma de punição.\n\nKAY, A. In: FARTHING, S. (Org.). **Tudo sobre arte**.  \nRio de Janeiro: Sextante, 2011 (adaptado).", "intro": "Produzida no início do século XVII, a obra maneirista distingue-se pela", "a": ["Representação da nudez masculina.", "Distorção ao representar a figura humana.", "Evocação de um fato da cultura clássica grega.", "Presença do tema da morte como punição da família.", "Utilização da perspectiva para integrar os diferentes planos."], "af": [null, null, null, null, null]}, {"m": "Português", "t": "Variação linguística e formalidade", "y": 2015, "i": 123, "d": "linguagens", "c": "**Azeite de oliva e óleo de linhaça: uma dupla imbatível**\n\n_Rico em gorduras do bem, ela combate a obesidade, dá um chega pra lá no diabete e ainda livra o coração de entraves_\n\nNinguém precisa esquentar a cabeça caso não seja possível usar os dois óleos juntinhos, no mesmo dia. Individualmente, o duo também bate um bolão. Segundo um estudo recente do grupo EurOlive, formado por instituições de cinco países europeus, os polifenóis do azeite de oliva ajudam a frear a oxidação do colesterol LDL, considerado perigoso. Quando isso ocorre, reduzse o risco de placas de gordura na parede dos vasos, a temida aterosclerose – doença por trás de encrencas como o infarto.\n\nMANARINI, T. **Saúde é vital,** n. 347, fev. 2012 (adaptado).\n\nPara divulgar conhecimento de natureza científica para um público não especializado, Manarini recorre à associação entre vocabulário formal e vocabulário informal.", "intro": "Altera-se o grau de formalidade do segmento no texto, sem alterar o sentido da informação, com a substituição de:", "a": ["\"dá um chega pra lá no diabete\" por \"manda embora o diabete\".", "\"esquentar a cabeça\" por \"quebrar a cabeça\".", "\"bate um bolão\" por \"é um show\".", "\"juntinhos\" por \"misturadinhos\".", "\"por trás de encrencas\" por \"causadora de problemas\"."], "af": [null, null, null, null, null]}, {"m": "Filosofia", "t": "Filosofia antiga (Aristóteles)", "y": 2017, "i": 88, "d": "ciencias-humanas", "c": "Se, pois, para as coisas que fazemos existe um fim que desejamos por ele mesmo e tudo o mais é desejado no interesse desse fim; evidentemente tal fim será o bem, ou antes, o sumo bem. Mas não terá o conhecimento, porventura, grande influência sobre essa vida? Se assim é, esforcemo-nos por determinar, ainda que em linhas gerais apenas, o que seja ele e de qual das ciências ou faculdades constitui o objeto. Ninguém duvidará de que o seu estudo pertença à arte mais prestigiosa e que mais verdadeiramente se pode chamar a arte mestra. Ora, a política mostra ser dessa natureza, pois é ela que determina quais as ciências que devem ser estudadas num Estado, quais são as que cada cidadão deve aprender, e até que ponto; e vemos que até as faculdades tidas em maior apreço, como a estratégia, a economia e a retórica, estão sujeitas a ela. Ora, como a política utiliza as demais ciências e, por outro lado, legisla sobre o que devemos e o que não devemos fazer, a finalidade dessa ciência deve abranger as das outras, de modo que essa finalidade será o bem humano.\n\nARISTÓTELES. Ética a Nicômaco. In: **Pensadores**. São Pauto: Nova Cultural, 1991 (adaptado).", "intro": "Para Aristóteles, a relação entre o sumo bem e a organização da pólis pressupõe que", "a": ["O bem dos indivíduos consiste em cada um perseguir seus interesses.", "O sumo bem é dado pela fé de que os deuses são os portadores da verdade.", "A política é a ciência que precede todas as demais na organização da cidade.", "A educação visa formar a consciência de cada pessoa para agir corretamente.", "A democracia protege as atividades políticas necessárias para o bem comum."], "af": [null, null, null, null, null]}, {"m": "História", "t": "Brasil República e trabalho feminino", "y": 2023, "i": 84, "d": "ciencias-humanas", "c": "A partir da década de 1930, começam a ser discutidos no Brasil os princípios de racionalização do trabalho. As preocupações com a cozinha e o trabalho doméstico foram introduzidas com a medicina sanitária e a oferta de gás e eletricidade para uso doméstico no início do século XX. A organização da cozinha visava atingir uma simplificação das tarefas, com a economia de movimentos, e o barateamento dos equipamentos, a partir da produção em grande escala. A padronização e racionalização da habitação e seus componentes visava uma radical transformação da casa, em especial da cozinha, e apoiava-se tanto no desenvolvimento de novos equipamentos quanto nos estudos de racionalização do trabalho doméstico. A principal preocupação era o desenvolvimento de um novo tipo de habitação, que deveria induzir um novo comportamento social.\n\nSILVA, J. L. M. Transformações no espaço doméstico: o fogão a gás e a cozinha paulistana, 1870-1930. Anais do Museu Paulista, n. 2. jul-dez 2007 (adaptado).", "intro": "No contexto descrito, as mudanças mencionadas proporcionavam às mulheres o(a)", "a": ["Controle do orçamento familiar.", "Libertação das tradições religiosas.", "Exercício da representatividade política.", "Ampliação dos momentos de socialização.", "Afastamento das atividades especializadas."], "af": [null, null, null, null, null]}, {"m": "História", "t": "Apartheid e segregação", "y": 2016, "i": 33, "d": "ciencias-humanas", "c": "![](img/2016-33-0.jpg)\n\nDisponível em: www.imageforum-diffusion.afp.com. Acesso em: 6 jan. 2016", "intro": "O regime do Apartheid adotado de 1948 a 1994 na Africa do Sul fundamentava-se em ações estatais de segregacionismo racial. Na imagem, fuzileiros navais fazem valer a “lei do passe” que regulamentava o(a)", "a": ["Concentração fundiária, impedindo os negros de tomar posse legítima do uso da terra.", "Boicote econômico, proibindo os negros de consumir produtos ingleses sem resistência armada.", "Sincretismo religioso, vetando os ritos sagrados dos negros nas cerimônias oficiais do Estado.", "Controle sobre a movimentação, desautorizando os negros a transitar em determinadas áreas das cidades.", "Exclusão do mercado de trabalho, negando a população negra o acesso aos bens de consumo."], "af": [null, null, null, null, null]}, {"m": "Geografia", "t": "Cartografia e coordenadas", "y": 2020, "i": 53, "d": "ciencias-humanas", "c": "“Devo estar chegando perto do centro da Terra. Deixe ver: deve ter sido mais de seis mil quilômetros, por aí…” (como se vê, Alice tinha aprendido uma porção de coisas desse tipo na escola, e embora essa não fosse uma oportunidade lá muito boa de demonstrar conhecimentos, já que não havia ninguém por perto para escutá-la, em todo caso era bom praticar um pouco) “… sim, deve ser mais ou menos essa a distância… mas então qual seria a latitude ou longitude em que estou?” (Alice não tinha a menor ideia do que fosse latitude ou longitude, mas acho que eram palavras muito imponentes).\n\nCARROLL, L. Aventuras de Alice: no País das Maravilhas, Através do espelho e outros textos. São Paulo: Summus, 1980.", "intro": "O texto descreve uma confusão da personagem em relação", "a": ["Ao tipo de projeção cartográfica.", "Aos contornos dos fusos horários.", "À localização do norte magnético.", "Aos referenciais de posição relativa.", "Às distorções das formas continentais."], "af": [null, null, null, null, null]}, {"m": "Sociologia", "t": "Pensamento social brasileiro", "y": 2021, "i": 80, "d": "ciencias-humanas", "c": "Numa sociedade em transição, a marcha da mudança, em diferentes graus, está impressa em todos os aspectos da ordem social, especialmente no jogo político, que nessas sociedades sempre apresenta padrões característicos de ambivalência, cujas raízes sociais se encontram na coexistência de dois padrões de estrutura social: o padrão tradicional, em declínio, e o novo, emergente, em expansão. Em tais situações, é possível encontrar, simultaneamente, apoio para uma orientação política ou para outra que seja exatamente o oposto. O padrão ambivalente do processo político, nas sociedades em desenvolvimento, é o que explica um dos seus trações mais salientes, e que consiste na tendência ao adiamento das grandes decisões. Resulta dai que a inércia política ou a convulsão política pode se suceder uma à outra em períodos surpreendentemente curtos.\n\nPINTO, L, A. C. **Sociologia e desenvolvimento.** Rio de Janeiro: Civilização Brasileira. 1975 (adaptado).", "intro": "De acordo com a perspectiva apresentada, central no pensamento social brasileiro dos anos 1950 e 1960, o desenvolvimento do país foi marcado por", "a": ["Radicalidade nas agendas de reforma das elites dirigentes.", "Anomalias na execução dos planos econômicos ortodoxos.", "Descompassos na construção de quadros institucionais modernos.", "Ilegitimidade na atuação dos movimentos de representação classista.", "Vagarosidade na dinâmica de aperfeiçoamento dos programas partidários."], "af": [null, null, null, null, null]}, {"m": "História", "t": "Constituição de 1988 e direitos", "y": 2014, "i": 17, "d": "ciencias-humanas", "c": "![](img/2014-17-0.png)\n\nPAIVA, M. Disponível em: www.redes.unb.br. Acesso em: 25 maio 2014", "intro": "A discussão levantada na charge, publicada logo após a promulgação da Constituição de 1988, faz referência ao seguinte conjunto de direitos:", "a": ["Civis, como o direito à vida, à liberdade de expressão e à propriedade.", "Sociais, como direito à educação, ao trabalho e à proteção à maternidade e à infância.", "Difusos, como direito à paz, ao desenvolvimento sustentável e ao meio ambiente saudável.", "Coletivos, como direito à organização sindical, à participação partidária e à expressão religiosa.", "Políticos, como o direito de votar e ser votado, à soberania popular e à participação democrática."], "af": [null, null, null, null, null]}, {"m": "História", "t": "Idade Média", "y": 2015, "i": 5, "d": "ciencias-humanas", "c": "A casa de Deus, que acreditam una, está, portanto, dividida em três: uns oram, outros combatem, outros, enfim, trabalham. Essas três partes que coexistem não suportam ser separadas; os serviços prestados por uma são a condição das obras das outras duas; cada uma por sua vez encarrega-se de aliviar o conjunto… Assim a lei pode triunfar e o mundo gozar da paz.\n\nALDALBERON DE LAON, In: SPINOSA, F. **Antologia de textos históricos medievais**. Lisboa: Sá da Costa, 1981.", "intro": "A ideologia apresentada por Aldalberon de Laon foi produzida durante a Idade Média. Um objetivo de tal ideologia e um processo que a ela se opôs estão indicados, respectivamente, em:", "a": ["Justificar a dominação estamental / revoltas camponestas.", "Subverter a hierarquia social / centralização monárquica.", "Impedir a igualdade jurídica / revoluções burguesas.", "Controlar a exploração econômica / unificação monetária.", "Questionar a ordem divina / Reforma Católica."], "af": [null, null, null, null, null]}, {"m": "Sociologia", "t": "Gênero e estereótipos", "y": 2018, "i": 87, "d": "ciencias-humanas", "c": "![](img/2018-87-0.png)", "intro": "O anúncio publicitário da década de 1940 reforça os seguintes estereótipos atribuídos historicamente a uma suposta natureza feminina:", "a": ["Pudor inato e instinto maternal.", "Fragilidade física e necessidade de aceitação.", "Isolamento social e procura de autoconhecimento.", "Dependência econômica e desejo de ostentação.", "Mentalidade fútil e conduta hedonista."], "af": [null, null, null, null, null]}, {"m": "Geografia", "t": "Solos e problemas ambientais", "y": 2022, "i": 55, "d": "ciencias-humanas", "c": "Solos salinos ou alomórficos apresentam como característica comum uma concentração muito alta de sais solúveis e/ou de sódio trocável. Eles ocorrem nos locais mais baixos do relevo, em regiões áridas e semiáridas e próximas do mar. Em regiões semiáridas, por exemplo, o polígono das secas do Nordeste brasileiro, os locais menos elevados recebem água que se escoa dos declives adjacentes, durante as chuvas que caem em alguns meses do ano. Essa água traz soluções de sais minerais e evapora-se rapidamente antes de infiltrar-se totalmente, havendo então, cada vez que esse processo é repetido, um pequeno acúmulo de sais no horizonte superficial que, com o passar dos anos, provoca a salinização do solo. Nas últimas décadas, a expansão das atividades agrícolas na região tem ampliado esse processo.\n\n**LEPSCH, |. F. Solos: formação e conservação. São Paulo: Melhoramentos, 1993 (adaptado).**", "intro": "As atividades agrícolas, desenvolvidas na região mencionada, intensificam o problema ambiental exposto ao", "a": ["Realizar florestamentos de pinus, desrespeitando a prática do pousio.", "Utilizar sistemas de irrigação, desprezando uma drenagem adequada.", "Instalar açudes nos grotões, retardando a velocidade da vazão fluvial.", "Desmatar áreas de preservação permanente, causando assoreamento.", "Aplicar fertilizantes de origem orgânica, modificando a química da terra."], "af": [null, null, null, null, null]}, {"m": "Geografia", "t": "Antropoceno e ação humana", "y": 2019, "i": 46, "d": "ciencias-humanas", "c": "A pegada ecológica gigante que estamos a deixar no planeta está a transformá-to de tal forma que os especialistas consideram que já entramos numa nova época geológica, o Antropoceno. E muitos defendem que, se não travarmos a crise ambiental, mais rapidamente transformaremos a Terra em Vênus do que iremos a Marte. A expressão “Antropoceno” é atribuída ao químico e prêmio Nobel Paul Crutzen, que a propôs durante uma conferência em 2000, ao mesmo tempo que anunciou o fim do Holoceno – a época geológica em que os seres humanos se encontram há cerca de 12 mil anos, segundo a União Internacional das Ciências Geológicas (UICG), a entidade que define as unidades de tempo geológicas.\n\nSILVA, R. D. **Antropoceno: e se formos os últimos seres vivos a alterar a Terra?** Disponível em: www.publico.pt. Acesso em: 5 dez. 2017 (adaptado).", "intro": "A concepção apresentada considera a existência de uma nova época geológica concebida a partir da capacidade de influência humana nos processos", "a": ["Eruptivos.", "Exógenos.", "Tectônicos.", "Magmáticos.", "Metamórficos."], "af": [null, null, null, null, null]}, {"m": "Química", "t": "Química orgânica (hibridação)", "y": 2018, "i": 130, "d": "ciencias-natureza", "c": "O grafeno é uma forma alotrópica do carbono constituído por uma folha planar (arranjo bidimensional) de átomos de carbono compactados e com a espessura de apenas um átomo. Sua estrutura é hexagonal, conforme a figura.\n\n![](img/2018-130-0.png)", "intro": "Nesse arranjo, os átomos de carbono possuem hibridação", "a": ["", "", "", "", ""], "af": ["img/2018-130-1.png", "img/2018-130-2.png", "img/2018-130-3.png", "img/2018-130-4.png", "img/2018-130-5.png"]}, {"m": "Química", "t": "Gases (pressão e temperatura)", "y": 2023, "i": 119, "d": "ciencias-natureza", "c": "De acordo com a Constituição Federal, é competencia dos municípios o gerenciamento dos serviços de limpeza e coleta dos resíduos urbanos (lixo). No entanto, há relatos de que parte desse lixo acaba sendo incinerado, liberando substâncias tóxicas para o ambiente e causando acidentes por explosões, principalmente quando ocorre a incineração de frascos de aerossóis (por exemplo: desodorantes, inseticidas e repelentes). A temperatura elevada provoca a vaporização de todo o conteúdo dentro desse tipo de frasco, aumentando a pressão em seu interior até culminar na explosão da embalagem.\n\nZVEIBIL, V. Z. et al. **Cartilha de limpeza urbana**. Disponível em: www.lbam.org.br. Acesso em: 6 jul. 2015 (adaptado).\n\nSuponha um frasco metálico de um aerossol de capacidade igual a 100 mL, contendo 0,1 mol de produtos gasosos à temperatura de 650 °C, no momento da explosão.\n\n![](img/2023-119-0.png)", "intro": "A pressão, em atm, dentro do frasco, no momento da explosão, é mais próxima de", "a": ["756.", "533.", "76.", "53.", "13."], "af": [null, null, null, null, null]}, {"m": "Física", "t": "Energia e elasticidade", "y": 2015, "i": 70, "d": "ciencias-natureza", "c": "Um garoto foi à loja comprar um estilingue e encontrou dois modelos: um com borracha mais “dura” e outro com borracha mais “mole”. O garoto concluiu que o mais adequado seria o que proporcionasse maior alcance horizontal, _D_, para as mesmas condições de arremesso, quando submetidos à mesma força aplicada. Sabe-se que a constante elástica _kd_ (do estilingue mais “duro”) é o dobro da constante elástica _Km_ (do estilingue mais “mole”).", "intro": "A razão entre os alcances Dd  / Dm, referentes aos estilingues com borrachas “dura” e “mole”, respectivamente, é igual a", "a": ["1 / 4.", "1 / 2.", "1.", "2.", "4."], "af": [null, null, null, null, null]}, {"m": "Biologia", "t": "Fisiologia humana (sangue)", "y": 2022, "i": 104, "d": "ciencias-natureza", "c": "Diversas substâncias são empregadas com a intenção de incrementar o desempenho esportivo de atletas de alto nível. O chamado _doping_ sanguíneo, por exemplo, pela utilização da eritropoietina, é proibido pelas principais federações de esportes no mundo. A eritropoietina é um hormônio produzido pelos rins e fígado e sua principal ação é regular o processo de eritropoiese. Seu uso administrado intravenosamente em quantidades superiores àquelas presentes naturalmente no organismo permite que o indivíduo aumente a sua capacidade de realização de exercícios físicos.", "intro": "Esse tipo de doping está diretamente relacionado ao aumento da", "a": ["Frequência cardíaca.", "Capacidade pulmonar.", "Massa muscular do indivíduo.", "Atividade anaeróbica da musculatura.", "Taxa de transporte de oxigênio pelo sangue."], "af": [null, null, null, null, null]}, {"m": "Biologia", "t": "Evolução e doenças", "y": 2021, "i": 121, "d": "ciencias-natureza", "c": "Entre 2014 e 2016, as regiões central e oeste da África sofreram um grave epidemia de febre hemorrágica causada pelo vírus ebola, que se manifesta em até 21 dias após a infecção e cuja taxa de letalidade (enfermos que vão a óbito) pode chegar a 90%. Em regiões de clima tropical e subtropical, um outro vírus também pode causar febre hemorrágica: o vírus da dengue, que, embora tenha período de incubação menor (até 10 dias), apresenta taxa de letalidade abaixo de 1%.\n\nDisponível em: www.who.int. Acesso em: 1 fev. 2017 (adaptado).", "intro": "Segundo as informações do texto e aplicando princípios de evolução biológica às relações do tipo patógeno-hospedeiro, qual dos dois vírus infecta seres humanos há mais tempo?", "a": ["Ebola, pois o maior período de incubação reflete duração mais longa do processo de coevolução patógeno-hospedeiro.", "Dengue, pois o menor período de incubação reflete duração mais longa do processo de coevolução patógeno-hospedeiro.", "Ebola, cuja alta letalidade indica maior eficiência do vírus em parasitar seus hospedeiros, estabelecida ao longo de sua evolução.", "Ebola, cujos surtos epidêmicos concentram-se no continente africano, reconhecido como berço da origem evolutiva dos seres humanos.", "Dengue, cuja baixa letalidade indica maior eficiência do vírus em parasitar seus hospedeiros, estabelecida ao longo da coevolução patógeno-hospedeiro."], "af": [null, null, null, null, null]}, {"m": "Biologia", "t": "Fisiologia humana (sangue)", "y": 2017, "i": 100, "d": "ciencias-natureza", "c": "Pesquisadores criaram um tipo de plaqueta artificial, feita com um polímero gelatinoso coberto de anticorpos, que promete agilizar o processo de coagulação quando injetada no corpo. Se houver sangramento, esses anticorpos fazem com que a plaqueta mude sua forma e se transforme em uma espécie de rede que gruda nas lesões dos vasos sanguíneos e da pele.\n\nMOUTINHO, S. **Coagulação acelerada.** Disponível em: http://cienciahoje.uol.com.br.  \nAcesso em: 19 fev. 2013 (adaptado).", "intro": "Qual a doença cujos pacientes teriam melhora de seu estado de saúde com o uso desse material?", "a": ["Filariose.", "Hemofilia.", "Aterosclerose.", "Doença de Chagas.", "Síndrome da imunodeficiência adquirida."], "af": [null, null, null, null, null]}, {"m": "Química", "t": "Leitura de gráficos em Química", "y": 2016, "i": 89, "d": "ciencias-natureza", "c": "O aquecimento de um material por irradiação com micro-ondas ocorre por causa da interação da onda eletromagnética com o dipolo elétrico da molécula. Um importante atributo do aquecimento por micro-ondas é a absorção direta da energia pelo material a ser aquecido. Assim, esse aquecimento é seletivo e dependerá, principalmente, da constante dielétrica e da frequência de relaxação do material. O gráfico mostra a taxa de aquecimento de cinco solventes sob irradiação de micro-ondas.\n\nBARBOZA, A. C. R. N. et al. Aquecimento em forno de micro-ondas. Desenvolvimento de alguns conceitos fundamentais. **Química Nova**, n. 6, 2001 (adaptado).\n\n![](img/2016-89-0.png)", "intro": "No gráfico, qual solvente apresenta taxa média de aquecimento mais próxima de zero, no intervalo de 0 s a 40 s?", "a": ["H2O", "CH3OH", "CH3CH2OH", "CH3CH2CH2OH", "CH3CH2CH2CH2CH2CH3"], "af": [null, null, null, null, null]}, {"m": "Física", "t": "Óptica (refração)", "y": 2014, "i": 68, "d": "ciencias-natureza", "c": "Uma proposta de dispositivo capaz de indicar a qualidade da gasolina vendida em postos e, consequentemente, evitar fraudes, poderia utilizar o conceito de refração luminosa. Nesse sentido, a gasolina não adulterada, na temperatura ambiente, apresenta razão entre os senos dos raios incidente e refratado igual a 1,4. Desse modo, fazendo incidir o feixe de luz proveniente do ar com um angulo fixo e maior que zero, qualquer modificação no angulo do feixe refratado indicará adulteração no combustível.", "intro": "Em uma fiscalização rotineira, o teste apresentou o valor de 1,9. Qual foi o comportamento do raio refratado?", "a": ["Mudou de sentido.", "Sofreu reflexão total.", "Atingiu o valor do ângulo limite.", "Direcionou-se para a superfície de separação.", "Aproximou-se da normal à superfície de separação."], "af": [null, null, null, null, null]}, {"m": "Biologia", "t": "Vírus e doenças", "y": 2019, "i": 114, "d": "ciencias-natureza", "c": "Na família Retroviridae encontram-se diversos vírus que infectam aves e mamíferos, sendo caracterizada pela produção de DNA a partir de uma molécula de RNA. Alguns retrovírus infectam exclusivamente humanos, não necessitando de outros hospedeiros, reservatórios ou vetores biológicos. As infecções ocasionadas por esses vírus vêm causando mortes e grandes prejuízos ao desenvolvimento social e econômico. Nesse contexto, pesquisadores têm produzido medicamentos que contribuem para o tratamento dessas doenças.", "intro": "Que avanços tecnológicos têm contribuído para o tratamento dessas infecções virais?", "a": ["Melhoria dos métodos de controle dos vetores desses vírus.", "Fabricação de soros mutagênicos para combate desses vírus.", "Investimento da indústria em equipamentos de proteção individual.", "Produção de vacinas que evitam a infecção das células hospedeiras.", "Desenvolvimento de antirretrovirais que dificultam a reprodução desses vírus."], "af": [null, null, null, null, null]}, {"m": "Biologia", "t": "Evolução (especiação)", "y": 2020, "i": 101, "d": "ciencias-natureza", "c": "Uma população (momento A) sofre isolamento em duas subpopulações (momento B) por um fator de isolamento (I). Passado um tempo, essas subpopulações apresentam características fenotípicas e genotípicas que as distinguem (momento C), representadas na figura pelas tonalidades de cor. O posterior desaparecimento do fator de isolamento I pode levar, no momento D, às situações Dl e D2.\n\n![](img/2020-101-0.png)", "intro": "A representação indica que, no momento D, na situação", "a": ["Dl ocorre um novo fator de isolamento geográfico.", "Dl existe uma única população distribuída em gradiente.", "Dl ocorrem duas populações separadas por isolamento reprodutivo.", "D2 coexistem duas populações com características fenotípicas distintas.", "D2 foram preservadas as mesmas características fenotípicas da população original A."], "af": [null, null, null, null, null]}, {"m": "Matemática", "t": "Porcentagem e média", "y": 2015, "i": 159, "d": "matematica", "c": "Segundo dados apurados no Censo 2010, para uma população de 101,8 milhões de brasileiros com 10 anos ou mais de idade e que teve algum tipo de rendimento em 2010, a renda média mensal apurada foi de R$ 1 202,00. A soma dos rendimentos mensais dos 10% mais pobres correspondeu a apenas 1,1% do total de rendimentos dessa população considerada, enquanto que a soma dos rendimentos mensais dos 10% mais ricos correspondeu a 44,5% desse total.\n\nDisponível em: www.estadao.com.br. Acesso em: 16 nov. 2011(adaptado).", "intro": "Qual foi a diferença, em reais, entre a renda média mensal de um brasileiro que estava na faixa dos 10% mais ricos e de um brasileiro que estava na faixa dos 10% mais pobres?", "a": ["240,40", "548,11", "1 723,67", "4 026,70", "5 216,68"], "af": [null, null, null, null, null]}, {"m": "Matemática", "t": "Porcentagem", "y": 2021, "i": 150, "d": "matematica", "c": "A depressão caracteriza-se por um desequilíbrio na química cerebral. Os neurônios de um deprimido não respondem bem as estímulos dos neurotransmissores.  \nOs remédios que combatem a depressão têm o objetivo de restabelecer a química cerebral. Com o aumento gradativo de casos de depressão, a venda desses medicamentos está em crescente evolução, conforme ilustra o gráfico.\n\n![](img/2021-150-0.png)", "intro": "No período de 2005 a 2009, o aumento percentual no volume de vendas foi de", "a": ["45,4.", "54,5.", "120.", "220.", "283,2."], "af": [null, null, null, null, null]}, {"m": "Matemática", "t": "Geometria plana (ângulos)", "y": 2023, "i": 145, "d": "matematica", "c": "Num certo momento de um jogo digital, a tela apresenta a imagem representada na figura. O ponto Q1 representa a posição de um jogador que está com a bola, os pontos Q2, Q3, Q4 , Q5 e Q6  \ntambém indicam posições de jogadores da mesma equipe, e os pontos A e B indicam os dois pés da trave mais próxima deles. No momento da partida retratado, o jogador Q1 tem a posse da bola, que será passada para um dos outros jogadores das posições Qn, n ∈ {2, 3, 4, 5, 6}, cujo ângulo AQnB tenha a mesma medida do ângulo AQ1 B.\n\n![](img/2023-145-0.png)", "intro": "Qual é o jogador que receberá a bola?", "a": ["", "", "", "", ""], "af": ["img/2023-145-1.png", "img/2023-145-2.png", "img/2023-145-3.png", "img/2023-145-4.png", "img/2023-145-5.png"]}, {"m": "Matemática", "t": "Geometria espacial (cone)", "y": 2022, "i": 153, "d": "matematica", "c": "![](img/2022-153-0.png)\n\nUma empresa produz e vende um tipo de chocolate, maciço, em formato de cone circular reto com as medidas do diâmetro da base e da altura iguais a 8 cm e 10 cm, respectivamente, como apresenta a figura.\n\nDevido a um aumento de preço dos ingredientes utilizados na produção desse chocolate, a empresa  \ndecide produzir esse mesmo tipo de chocolate com um volume 19% menor, no mesmo formato de cone circular reto com altura de 10 cm.", "intro": "Para isso, a empresa produzirá esses novos chocolates com medida do raio da base, em centímetro, igual a", "a": ["1,52.", "3,24.", "3,60.", "6,48.", "7,20."], "af": [null, null, null, null, null]}, {"m": "Matemática", "t": "Geometria (trigonometria/círculo)", "y": 2020, "i": 172, "d": "matematica", "c": "No período de fim de ano, o síndico de um condomínio resolveu colocar, em um poste, uma iluminação natalina em formato de cone, lembrando uma árvore de Natal, conforme as figuras 1 e 2.\n\n![](img/2020-172-0.png)\n\nA árvore deverá ser feita colocando-se mangueiras de iluminação, consideradas segmentos de reta de mesmo comprimento, a partir de um ponto situado a 3 m de altura no poste até um ponto de uma circunferência de fixação, no chão, de tal forma que esta fique dividida em 20 arcos iguais. O poste está fixado no ponto C (centro da circunferência) perpendicularmente ao plano do chão.\n\nPara economizar, ele utilizará mangueiras de iluminação aproveitadas de anos anteriores, que juntas totalizaram pouco mais de 100 m de comprimento, dos quais ele decide usar exatamente 100 m e deixar o restante como reserva.", "intro": "Para que ele atinja seu objetivo, o raio, em metro, da circunferência deverá ser de", "a": ["4,00.", "4,87.", "5,00.", "5,83.", "6,26."], "af": [null, null, null, null, null]}, {"m": "Matemática", "t": "Geometria plana (áreas)", "y": 2017, "i": 140, "d": "matematica", "c": "Um garçom precisa escolher uma bandeja de base retangular para servir quatro taças de espumante que precisam ser dispostas em uma única fileira, paralela ao lado maior da bandeja, e com suas bases totalmente apoiadas na bandeja. A base e a borda superior das taças são círculos de raio 4 cm e 5 cm, respectivamente.\n\n![](img/2017-140-0.png)", "intro": "A bandeja a ser escolhida deverá ter uma área mínima, em centímetro quadrado, igual a", "a": ["192.", "300.", "304.", "320.", "400."], "af": [null, null, null, null, null]}, {"m": "Matemática", "t": "Probabilidade", "y": 2019, "i": 173, "d": "matematica", "c": "Em um determinado ano, os computadores da receita federal de um país identificaram como inconsistentes 20% das declarações de imposto de renda que lhe foram encaminhadas.  \nUma declaração é classificada como inconsistente quando apresenta algum tipo de erro ou conflito nas informações prestadas. Essas declarações consideradas inconsistentes foram analisadas pelos auditores, que constataram que 25% delas eram fraudulentas.\n\nConstatou-se, ainda, que, dentre as declarações que não apresentaram inconsistências, 6,25% eram fraudulentas.", "intro": "Qual é a probabilidade de, nesse ano, a declaração de um contribuinte ser considerada inconsistente, dado que ela era fraudulenta?", "a": ["0,0500", "0,1000", "0,1125", "0,3125", "0,5000"], "af": [null, null, null, null, null]}, {"m": "Matemática", "t": "Raciocínio lógico e tabelas", "y": 2018, "i": 172, "d": "matematica", "c": "Na teoria das eleições, o Método de Borda sugere que, em vez de escolher um candidato, cada juiz deve criar um _ranking_ de sua preferência para os concorrentes (isto é, criar uma lista com a ordem de classificação dos concorrentes). A este ranking é associada uma pontuação: um ponto para o último colocado no _ranking_, dois pontos para o penúltimo, três para o antepenúltimo, e assim sucessivamente. Ao final, soma-se a pontuação atribuída a cada concorrente por cada um dos juízes.\n\nEm uma escola houve um concurso de poesia no qual cinco alunos concorreram a um prêmio, sendo julgados por 25 juízes. Para a escolha da poesia vencedora foi utilizado o Método de Borda. Nos quadros, estão apresentados os _rankings_ dos juízes e a frequência de cada _ranking_.\n\n![](img/2018-172-0.png)", "intro": "A poesia vencedora foi a de", "a": ["Edu.", "Dani.", "Caio.", "Bia.", "Ana."], "af": [null, null, null, null, null]}, {"m": "Matemática", "t": "Funções e gráficos", "y": 2014, "i": 143, "d": "matematica", "c": "![](img/2014-143-0.png)\n\nNo topo da escultura foi ligada uma torneira que verte água, para dentro dela, com vazão constante.", "intro": "O gráfico que expressa a altura (h) da água na escultura em função do tempo (t) decorrido é:", "a": ["", "", "", "", ""], "af": ["img/2014-143-1.png", "img/2014-143-2.png", "img/2014-143-3.png", "img/2014-143-4.png", "img/2014-143-5.png"]}, {"m": "Matemática", "t": "Porcentagem", "y": 2016, "i": 145, "d": "matematica", "c": "_Art. 93. A empresa com 100 (cem) ou mais empregados está obrigada a preencher de 2% (dois por cento) a 5% (cinco por cento) dos seus cargos com beneficiários reabilitados ou pessoas com deficiência, habilitadas, na seguinte proporção:_  \n_I. até 200 empregados……………….. 2%;_  \n_II. de 201 a 500 empregados…………… 3%;_  \n_III. de 501 a 1 000 empregados………… 4%;_  \n_IV. de 1 001 em diante………………. 5%._\n\nDisponível em: www.planalto.gov.br. Acesso em: 3 fev. 2015.\n\nConstatou-se que a empresa possui 1 200 funcionários, dos quais 10 são reabilitados ou com deficiência, habilitados.\n\nPara adequar-se à referida lei, a empresa contratará apenas empregados que atendem ao perfil indicado no artigo 93.", "intro": "O número mínimo de empregados reabilitados ou com deficiência, habilitados, que deverá ser contratado pela empresa é", "a": ["74", "70", "64", "60", "53"], "af": [null, null, null, null, null]}];

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(t){
  t=esc(t.replace(/\r/g,"")).replace(/\\([.\-*_()\[\]])/g,"$1");
  t=t.replace(/!\[[^\]]*\]\(([^)\s]+)\)/g,(m,u)=>`\n\n@@IMG${u}@@\n\n`);
  t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,"$1");
  t=t.replace(/\*\*\s*([^*]+?)\s*\*\*/g,"<b>$1</b>").replace(/(^|[^\w])_([^_\n]+)_(?=[^\w]|$)/g,"$1<i>$2</i>").replace(/(\d)_([a-z])_/g,"$1<i>$2</i>");
  return t.split(/\n\s*\n/).map(p=>{p=p.trim();if(!p)return"";
    const im=p.match(/^@@IMG(.+)@@$/);if(im)return `<div class="fig"><img src="${im[1]}" alt="Figura da questão" loading="lazy" onclick="zoom(this.src)"><span>🔍 toque para ampliar</span></div>`;
    p=p.replace(/^\*\s+/gm,"• ").replace(/ {2,}\n/g,"<br>").replace(/\n/g,"<br>");
    const f=/(Disponível em|Acesso em|\(adaptado\)|\(fragmento\)|^[A-ZÁÉÍÓÚ]+,\s[A-Z])/.test(p)&&p.length<260;
    return `<p${f?' class="fonte"':''}>${p}</p>`}).join("");
}

let AC=null;
function audioOn(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain();g.gain.value=0.0001;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+0.05)}catch(e){}}
function bip(vezes,freq,dur){try{if(!AC)return;let t0=AC.currentTime+0.05;for(let n=0;n<vezes;n++){const o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.value=freq;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.35,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+0.02);t0+=dur+0.18}}catch(e){}}
function vibra(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function aviso(txt,cor){let b=$("aviso");b.textContent=txt;b.style.background=cor;b.classList.add("on");setTimeout(()=>b.classList.remove("on"),6000)}
function tick(){
  const el=$("timer");
  if(!S.ini){el.textContent="⏳ 2:00:00";return}
  if(S.fim){el.textContent="⏱ "+fmt(tempo());el.className="timer";return}
  const r=LIMITE-tempo();
  el.textContent="⏳ "+relogio(r);
  el.className="timer"+(r<=300?" crit":r<=1800?" warn":"");
  S.av=S.av||{};
  if(r<=3600&&!S.av.h1){S.av.h1=1;save();bip(1,880,0.25);vibra(200);aviso("⏰ Falta 1 hora de prova","#2563eb")}
  if(r<=1800&&!S.av.m30){S.av.m30=1;save();bip(2,880,0.25);vibra([200,100,200]);aviso("⏰ Faltam 30 minutos!","#d97706")}
  if(r<=300&&!S.av.m5){S.av.m5=1;save();bip(3,988,0.3);vibra([300,100,300,100,300]);aviso("🚨 Faltam 5 minutos! Revise e marque o que faltar.","#dc2626")}
  if(r<=0){tempoEsgotado()}
}
function relogio(s){s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}
function tempoEsgotado(){
  if(S.fim)return;S.fim=S.ini+LIMITE*1000;S.esgotado=1;save();fechar();
  bip(8,1046,0.35);vibra([500,200,500,200,500,200,800]);
  $("mbox").innerHTML=`<div style="text-align:center"><div style="font-size:52px">⏰</div><h2 style="margin:6px 0">Tempo esgotado!</h2><p>As 2 horas de prova acabaram. Igual no ENEM, a prova foi recolhida. Questões em branco contam como erro.</p><button class="btn g" onclick="fechar();resultado();whats()">📲 Enviar resultado para a Gleyce</button><button class="btn y" style="margin-top:8px" onclick="fechar();resultado()">Ver minha nota</button></div>`;
  $("modal").classList.add("on");
}
setInterval(tick,1000);
const respondidas=()=>S.resp.filter(Boolean).length;
function prog(){$("prog").style.width=(respondidas()/Q.length*100)+"%";$("sub").textContent=S.fim?"Simulado finalizado":`${respondidas()} de ${Q.length} respondidas`}

function inicio(){
  $("nav").classList.add("hidden");
  $("app").innerHTML=`<div class="card hero"><div class="emoji">🎮</div>
  <h2>Olá, ${ALUNO_CURTO}!</h2><p>Simulado especial com questões reais das provas do ENEM de 2014 a 2023.</p>
  <div class="info"><div><b>40</b>questões</div><div><b>4</b>áreas</div><div><b>10</b>provas misturadas</div><div><b>2h</b>de prova</div></div>
  <p style="text-align:left;font-size:14px">✅ São 10 questões de cada área: Linguagens (com Inglês), Ciências Humanas, Ciências da Natureza e Matemática.<br>⏳ Você tem <b>2 horas</b>. O relógio começa quando tocar em começar e não para, mesmo fechando o app. Ele avisa com som quando faltar 1 hora, 30 minutos e 5 minutos. Quando zerar, a prova é recolhida automaticamente. 🔊 Deixe o som do celular ligado.<br>✅ Toque na letra para marcar. Dá para voltar e trocar antes de finalizar.<br>✅ Se fechar o app, as respostas ficam salvas neste celular.<br>✅ No final aparece sua nota e um botão para mandar o resultado pelo WhatsApp.</p>
  <button class="btn y" onclick="comecar()">${S.ini?"Continuar simulado":"Começar simulado"} ›</button></div>
  <div class="autora">Elaborado por <b>Dra. Gleyce Santana</b> · OAB/GO 43.167<br>Advogada especialista em Licitações Públicas<br><a href="https://instagram.com/dragleyce.licitacoes" target="_blank" style="color:var(--azul);text-decoration:none;font-weight:700">📷 @dragleyce.licitacoes</a></div>`;
  prog();
}
function comecar(){audioOn();if(!S.ini){S.ini=Date.now();save();bip(2,660,0.15);vibra(150)}questao()}

function questao(){
  const i=S.cur,q=Q[i],fim=!!S.fim;
  $("nav").classList.remove("hidden");
  let h=`<div class="card"><span class="tag t-${q.d}">${AREAS[q.d]}</span><span class="origem">Questão ${i+1} de ${Q.length} · ENEM ${q.y} (questão ${q.i})</span>`;
  if(q.c.trim())h+=`<div class="texto">${md(q.c)}</div>`;
  if(q.intro.trim())h+=`<div class="enun">${md(q.intro)}</div>`;
  h+=`<div class="alts">`+q.a.map((a,k)=>{const L="ABCDE"[k];let c="";
    if(fim){if(L===gab(i))c="certa";else if(S.resp[i]===L)c="errada"}else if(S.resp[i]===L)c="sel";
    return `<button class="alt ${c}" onclick="marcar('${L}')"><span class="l">${L}</span><span>${q.af&&q.af[k]?`<img class="altimg" src="${q.af[k]}" alt="Alternativa ${L}">`:""}${md(a).replace(/<\/?p[^>]*>/g,"")}</span></button>`}).join("")+`</div>`;
  if(fim)h+=`<p style="margin-top:12px;font-size:14px">${S.resp[i]===gab(i)?"✅ Você acertou!":`❌ Sua resposta: <b>${S.resp[i]||"em branco"}</b> · Gabarito: <b>${gab(i)}</b>`}</p>`;
  h+=`</div><div class="autora">Elaborado por <b>Dra. Gleyce Santana</b> · OAB/GO 43.167<br>Advogada especialista em Licitações Públicas<br><a href="https://instagram.com/dragleyce.licitacoes" target="_blank" style="color:var(--azul);text-decoration:none;font-weight:700">📷 @dragleyce.licitacoes</a></div>`;
  $("app").innerHTML=h;
  $("bPrev").disabled=i===0;
  $("bNext").textContent=fim?(i===Q.length-1?"Ver resultado":"Próxima ›"):(i===Q.length-1?"Finalizar ✓":"Próxima ›");
  window.scrollTo(0,0);prog();
}
function zoom(src){const z=$("zm"),i=$("zmi");i.src=src;i.style.width=(innerWidth<700?"200%":"100%");z.classList.add("on");z.scrollTo(0,0)}
function marcar(L){if(S.fim)return;S.resp[S.cur]=L;save();questao()}
$("bPrev").onclick=()=>{if(S.cur>0){S.cur--;save();questao()}};
$("bNext").onclick=()=>{if(S.cur<Q.length-1){S.cur++;save();questao()}else if(S.fim)resultado();else confirmar()};
$("bGrid").onclick=()=>{
  $("mbox").innerHTML=`<h3 style="margin-top:0">Ir para a questão</h3><div class="grid">`+Q.map((q,i)=>{
    let c=S.fim?(S.resp[i]===gab(i)?"c":"e"):(S.resp[i]?"ok":"");if(i===S.cur)c+=" cur";
    return `<button class="${c}" onclick="ir(${i})">${i+1}</button>`}).join("")+`</div>
    <p style="font-size:13px;color:#94a3b8">${S.fim?"Verde = acertou · Vermelho = errou":"Azul = respondida · Cinza = em branco"}</p>
    ${S.fim?`<button class="btn y" onclick="fechar();resultado()">Ver resultado</button>`:`<button class="btn y" onclick="fechar();confirmar()">Finalizar simulado</button>`}
    <button class="btn s" style="width:100%;margin-top:8px" onclick="fechar()">Fechar</button>`;
  $("modal").classList.add("on")};
function ir(i){S.cur=i;save();fechar();questao()}
function fechar(){$("modal").classList.remove("on")}
$("modal").onclick=e=>{if(e.target.id==="modal")fechar()};
function confirmar(){
  const b=Q.length-respondidas();
  $("mbox").innerHTML=`<h3 style="margin-top:0">Finalizar o simulado?</h3>
  <p>${b?`⚠️ Você ainda tem <b>${b} questão(ões) em branco</b>. Questão em branco conta como erro.`:"Todas as questões foram respondidas. 👏"}</p>
  <p style="font-size:14px;color:#94a3b8">Depois de finalizar não dá para trocar as respostas.</p>
  <button class="btn y" onclick="finalizar()">Sim, finalizar e ver minha nota</button>
  <button class="btn s" style="width:100%;margin-top:8px" onclick="fechar()">Voltar e revisar</button>`;
  $("modal").classList.add("on")}
function finalizar(){S.fim=Date.now();save();fechar();resultado();setTimeout(pedirEnvio,400)}
function pedirEnvio(){if(S.enviado)return;$("mbox").innerHTML=`<div style="text-align:center"><div style="font-size:48px">📲</div><h2 style="margin:6px 0">Envie seu resultado</h2><p>Toque no botão abaixo. O WhatsApp vai abrir na conversa da <b>Gleyce</b> com sua nota pronta. Depois é só tocar em <b>enviar ➤</b>.</p><button class="btn g" onclick="fechar();whats()">Enviar resultado para a Gleyce</button><button class="btn s" style="width:100%;margin-top:8px" onclick="fechar()">Ver minha nota primeiro</button></div>`;$("modal").classList.add("on")}
function calc(){const r={tot:0,a:{}};Object.keys(AREAS).forEach(k=>r.a[k]=[0,0]);
  Q.forEach((q,i)=>{r.a[q.d][1]++;if(S.resp[i]===gab(i)){r.tot++;r.a[q.d][0]++}});return r}
function nota10(n){return (n/Q.length*10).toFixed(1).replace(".",",")}
function resultado(){
  const r=calc();$("nav").classList.add("hidden");
  const pct=Math.round(r.tot/Q.length*100);
  const msg=pct>=80?"Excelente! 🏆":pct>=60?"Muito bom! 💪":pct>=40?"Bom caminho! 📚":"Bora revisar e mandar ver! 🚀";
  let h=`<div class="card hero"><div class="emoji">🎓</div><h2>${msg}</h2><p>${ALUNO}</p>
  <div class="nota">${nota10(r.tot)}</div><p><b>${r.tot} acertos de ${Q.length}</b> (${pct}%)</p><p>⏱ ${S.esgotado?"Tempo esgotado (usou as 2h inteiras)":"Terminou em "+fmt(tempo())+" de 2h"}</p></div>
  <div class="card areas"><h3 style="margin:0 0 6px">Desempenho por área</h3>`+Object.keys(AREAS).map(k=>{const[a,t]=r.a[k];
    return `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${AREAS[k]}</span><b>${a}/${t}</b></div><div class="mini"><div style="width:${a/t*100}%"></div></div></div>`}).join("")+`</div>
  ${estudar()}
  <div class="card"><button class="btn g" onclick="whats()"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.4z"/></svg>Enviar resultado para a Gleyce</button>
  <p style="font-size:12.5px;color:#94a3b8;text-align:center;margin:10px 0 0">Abre o WhatsApp direto na conversa da Gleyce · (62) 99900-5058. É só tocar em enviar ➤</p></div>
  <div class="card rev"><h3 style="margin:0 0 6px">Correção questão por questão</h3><p style="font-size:13px;color:#94a3b8;margin:0 0 6px">Toque numa questão para ver a correção.</p>`+
  Q.map((q,i)=>{const ok=S.resp[i]===gab(i);return `<div class="item" onclick="ir(${i})"><span>${ok?"✅":"❌"} ${i+1}. ${AREAS[q.d]} <span class="origem">· ENEM ${q.y}</span></span><span>Sua: <b>${S.resp[i]||"–"}</b> · Gab: <b>${gab(i)}</b></span></div>`}).join("")+`</div>
  <div class="card" style="text-align:center"><button class="btn s" style="width:100%" onclick="pedirSenha()">🔒 Refazer o simulado do zero</button><p style="font-size:12.5px;color:#94a3b8;margin:8px 0 0">Precisa da senha do responsável.</p></div>
  <div class="autora">Elaborado por <b>Dra. Gleyce Santana</b> · OAB/GO 43.167<br>Advogada especialista em Licitações Públicas<br><a href="https://instagram.com/dragleyce.licitacoes" target="_blank" style="color:var(--azul);text-decoration:none;font-weight:700">📷 @dragleyce.licitacoes</a></div>`;
  $("app").innerHTML=h;window.scrollTo(0,0);prog();
}
const SH=2683428419;
function hs(x){let h=5381;for(const c of "gs-enem|"+x)h=((h*33)^c.charCodeAt(0))>>>0;return h}
function pedirSenha(){
  $("mbox").innerHTML=`<h3 style="margin-top:0">🔒 Liberar nova tentativa</h3><p style="font-size:14px">Peça para o responsável digitar a senha. As respostas serão apagadas e o relógio volta para 2 horas.</p>
  <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="Senha" style="width:100%;padding:14px;border-radius:12px;border:2px solid var(--linha);background:#0b0f1a;color:#fff;font-size:20px;text-align:center;letter-spacing:6px;margin:6px 0 4px">
  <p id="pwmsg" style="color:#f87171;font-size:13px;min-height:18px;margin:4px 0"></p>
  <button class="btn y" onclick="liberar()">Liberar</button><button class="btn s" style="width:100%;margin-top:8px" onclick="fechar()">Cancelar</button>`;
  $("modal").classList.add("on");setTimeout(()=>$("pw").focus(),100);
  $("pw").onkeydown=e=>{if(e.key==="Enter")liberar()};
}
function liberar(){
  if(hs($("pw").value.trim())!==SH){$("pwmsg").textContent="Senha incorreta.";vibra(200);return}
  const tent=(S.tent||1)+1;S={enviado:0,resp:Array(Q.length).fill(null),cur:0,ini:null,fim:null,tent:tent};save();fechar();inicio();
}
function analise(){
  const m={};Q.forEach((q,i)=>{const k=q.m;m[k]=m[k]||{a:0,t:0,err:{}};m[k].t++;if(S.resp[i]===gab(i))m[k].a++;else m[k].err[q.t]=(m[k].err[q.t]||0)+1});
  return Object.entries(m).map(([k,v])=>({mat:k,a:v.a,t:v.t,p:v.a/v.t,err:Object.keys(v.err)})).sort((x,y)=>(y.t-y.a)-(x.t-x.a)||x.p-y.p);
}
function estudar(){
  const L=analise();const foco=L.filter(x=>x.p<0.5),aten=L.filter(x=>x.p>=0.5&&x.p<1),ok=L.filter(x=>x.p===1);
  const row=(x,cor,ic)=>`<div style="padding:10px 0;border-bottom:1px solid var(--linha)"><div style="display:flex;justify-content:space-between"><span>${ic} <b>${x.mat}</b></span><b style="color:${cor}">${x.a}/${x.t}</b></div>${x.err.length?`<div style="font-size:13px;color:var(--cinza);margin-top:3px">Revisar: ${x.err.join(" · ")}</div>`:""}</div>`;
  let h=`<div class="card"><h3 style="margin:0 0 4px">📚 O que estudar mais</h3><p style="font-size:13px;color:var(--cinza);margin:0 0 6px">Matérias em ordem de prioridade, com os assuntos das questões erradas.</p>`;
  const pior=L.filter(x=>x.p<1).slice(0,2);
  if(pior.length)h+=`<div style="background:linear-gradient(135deg,rgba(239,68,68,.18),rgba(124,58,237,.18));border:1px solid #ef4444;border-radius:14px;padding:14px;margin:8px 0 6px"><div style="font-size:13px;font-weight:800;color:#f87171;letter-spacing:.5px">🎯 FOCO PARA HOJE (VÉSPERA DA PROVA)</div><div style="font-size:18px;font-weight:900;margin:4px 0">${pior.map(x=>x.mat).join(" e ")}</div><div style="font-size:13.5px;color:var(--cinza)">Revise primeiro: ${pior.map(x=>x.err.join(", ")).join(" · ")}. Volte nas questões erradas logo abaixo e leia a correção com calma.</div></div>`;
  if(foco.length)h+=`<div style="margin-top:8px;font-weight:800;color:#f87171">🔴 Prioridade máxima</div>`+foco.map(x=>row(x,"#f87171","📕")).join("");
  if(aten.length)h+=`<div style="margin-top:12px;font-weight:800;color:#fbbf24">🟡 Precisa reforçar</div>`+aten.map(x=>row(x,"#fbbf24","📙")).join("");
  if(ok.length)h+=`<div style="margin-top:12px;font-weight:800;color:#4ade80">🟢 Mandou bem</div><div style="font-size:14px;padding:8px 0">${ok.map(x=>`📗 ${x.mat} (${x.a}/${x.t})`).join(" · ")}</div>`;
  return h+`</div>`;
}
function whats(){
  const r=calc();
  let t=`📝 *SIMULADO ENEM – RESULTADO*\n👤 ${ALUNO}${(S.tent||1)>1?" · tentativa "+S.tent:""}\n\n🎯 *Nota: ${nota10(r.tot)}* (de 0 a 10)\n✅ ${r.tot} acertos de ${Q.length} (${Math.round(r.tot/Q.length*100)}%)\n⏱ Tempo: ${S.esgotado?"ESGOTADO (2h)":fmt(tempo())+" de 2h"}\n\n*Por área:*\n`;
  Object.keys(AREAS).forEach(k=>t+=`• ${AREAS[k]}: ${r.a[k][0]}/${r.a[k][1]}\n`);
  const L=analise(),f=L.filter(x=>x.p<1);
  if(f.length)t+=`\n🎯 *FOCO PARA HOJE:* ${f.slice(0,2).map(x=>x.mat).join(" e ")}\n`;
  if(f.length)t+=`\n📚 *Precisa estudar mais:*\n`+f.slice(0,6).map(x=>`• ${x.mat} (${x.a}/${x.t}): ${x.err.join(", ")}`).join("\n")+"\n";
  t+=`\n*Respostas marcadas:*\n`+Q.map((q,i)=>`${i+1}-${S.resp[i]||"_"}${S.resp[i]===gab(i)?"✓":"✗"}`).join("  ");
  t+=`\n\n_Simulado elaborado por Dra. Gleyce Santana · OAB/GO 43.167_\n_Advogada especialista em Licitações Públicas · @dragleyce.licitacoes_`;
  S.enviado=1;save();
  const url="https://wa.me/5562999005058?text="+encodeURIComponent(t);
  const w=window.open(url,"_blank");if(!w)location.href=url;
}
if(!S.fim&&S.ini&&tempo()>=LIMITE){S.fim=S.ini+LIMITE*1000;S.esgotado=1;save()}
S.fim?resultado():inicio();tick();
</script>
</body>
</html>
