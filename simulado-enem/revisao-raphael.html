{id:"estrat",t:"1. Estratégia para o dia da prova",tempo:"15 min",h:`
<p>No simulado você acertou <b>50%</b> estando no 1º ano: muito bom! Você terminou em <b>1h10 de 2h</b>, então ainda tinha tempo para reler. Na prova de verdade, o objetivo é <b>treinar o ritmo</b> e garantir as questões que você já sabe.</p>
<h3>Como é a prova</h3>
<div class="tbl"><table><tr><th>Dia</th><th>Provas</th><th>Tempo</th></tr>
<tr><td><b>1º dia</b></td><td>Linguagens (45) + Ciências Humanas (45) + Redação</td><td>5h30</td></tr>
<tr><td><b>2º dia</b></td><td>Ciências da Natureza (45) + Matemática (45)</td><td>5h</td></tr></table></div>
<p>São cerca de <b>3 minutos por questão</b>. No 1º dia, reserve 1h a 1h30 para a redação.</p>
<h3>A TRI em linguagem simples</h3>
<ul><li>O ENEM olha <b>quais</b> questões você acertou, não só quantas.</li>
<li>Acertar as <b>fáceis</b> é o que mais vale. Elas são o seu foco: você ainda não viu o conteúdo de 2º e 3º anos, e tudo bem.</li>

{id:"hum",t:"3. Ciências Humanas do 1º ano",tempo:"40 min",h:`
<h3>História: da Antiguidade às Navegações</h3>
<div class="tbl"><table><tr><th>Período</th><th>O essencial para o ENEM</th></tr>

<h3>Geografia do 1º ano</h3>

<h3>Biologia</h3>
<ul><li><b>Citologia, fotossíntese, respiração e ecologia:</b> revise no seu app de Biologia.</li>
<li><b>Bioquímica:</b> <b>carboidratos</b> = energia rápida (glicose, amido) · <b>lipídios</b> = reserva de energia · <b>proteínas</b> = estrutura e enzimas · <b>água</b> = solvente da vida.</li></ul>
<div class="tbl"><table><tr><th>Vitamina</th><th>Falta causa</th><th>Onde achar</th></tr>

<div class="tbl"><table><tr><th>Modelo atômico</th><th>Ideia</th></tr>

<ul><li><b>Tabela periódica:</b> colunas = famílias (propriedades parecidas); linhas = períodos. Gases nobres (última coluna) são estáveis.</li>

<li><b>Energia:</b> cinética, potencial e conservação (veja o app de Física).</li></ul>`},
{id:"mat",t:"5. Matemática do 1º ano",tempo:"40 min",h:`
<h3>Os campeões do ENEM</h3>
<p><b>Porcentagem, proporção, escala, estatística e geometria plana</b>: revise no seu app de Matemática. Aqui entram os conteúdos novos do 1º ano.</p>
<h3>Conjuntos (diagrama de Venn)</h3>
<p>30 alunos gostam de futebol, 20 de vôlei e 10 dos dois. Total = 30 + 20 − 10 = <b>40</b>. Quem gosta dos dois foi contado duas vezes, então subtraia uma vez.</p>
<h3>Função do 1º grau</h3>
<div class="eq">y = a × x + b</div>
<p>b = valor fixo; a = valor por unidade. Táxi com bandeirada de R$ 5 e R$ 2 por km: em 10 km, y = 2 × 10 + 5 = <b>R$ 25</b>. Gráfico: <b>reta</b>.</p>
<h3>Função do 2º grau</h3>
<div class="eq">y = a × x² + b × x + c</div>
<ul><li>Gráfico: <b>parábola</b>. Se <b>a</b> é negativo, ela tem um <b>ponto máximo</b> (lucro máximo, altura máxima de uma bola).</li>
<li>O x do vértice é <b>x = −b ÷ (2 × a)</b>.</li>
<li>Ex.: lucro L = −x² + 10x. Vértice: x = −10 ÷ (−2) = 5 → L = −25 + 50 = <b>25</b> (lucro máximo).</li></ul>
<h3>Progressões</h3>
<ul><li><b>PA</b> (soma sempre o mesmo valor): 2, 5, 8, 11… → aₙ = a₁ + (n − 1) × r. O 10º termo é 2 + 9 × 3 = <b>29</b>.</li>
<li><b>PG</b> (multiplica sempre pelo mesmo valor): 3, 6, 12, 24… → aₙ = a₁ × qⁿ⁻¹. O 6º termo é 3 × 2⁵ = <b>96</b>.</li></ul>
<h3>Trigonometria básica</h3>
<p>No triângulo retângulo: <b>sen</b> = oposto ÷ hipotenusa · <b>cos</b> = adjacente ÷ hipotenusa · <b>tg</b> = oposto ÷ adjacente. sen 30° = 1/2.</p>`}

const QS=[
{p:"Você chegou a uma questão de um conteúdo que nunca estudou. Pela lógica da TRI, o melhor a fazer é:",a:["deixar em branco","gastar 20 minutos tentando","usar o texto, eliminar alternativas absurdas e marcar","marcar duas alternativas","sair da prova"],r:2,e:"Não há desconto por erro. Use o que o texto oferece, elimine o que der e marque, sem perder muito tempo."},
{p:"Em \"Meu quarto é um forno no verão\", a figura de linguagem é:",a:["comparação","metáfora","eufemismo","metonímia","antítese"],r:1,e:"É uma comparação sem \"como\": o quarto é chamado de forno. Isso é metáfora."},
{p:"\"É ferida que dói e não se sente\" junta ideias opostas na mesma coisa, ao mesmo tempo. Essa figura é o:",a:["paradoxo","eufemismo","pleonasmo","hipérbole","comparação"],r:0,e:"Paradoxo: duas ideias contraditórias sobre a mesma coisa ao mesmo tempo. É muito usado no Barroco."},
{p:"Um texto do século XVI descreve a nova terra, seus habitantes e suas riquezas para o rei de Portugal. Ele pertence ao:",a:["Barroco","Arcadismo","Quinhentismo","Modernismo","Romantismo"],r:2,e:"Os textos de informação sobre o Brasil no século XVI, como a Carta de Pero Vaz de Caminha, fazem parte do Quinhentismo."},
{p:"Um poema que valoriza a vida simples no campo, com pastores e tranquilidade, é característico do:",a:["Barroco","Arcadismo","Quinhentismo","Realismo","Modernismo"],r:1,e:"O bucolismo, a vida simples no campo, é marca do Arcadismo (século XVIII)."},
{p:"Na democracia de Atenas, na Grécia Antiga, podiam participar das decisões políticas:",a:["todos os moradores da cidade","apenas homens livres nascidos em Atenas","mulheres e escravizados","somente o rei","os estrangeiros ricos"],r:1,e:"A democracia ateniense era limitada: mulheres, escravizados e estrangeiros (metecos) não eram cidadãos."},
{p:"O sistema da Idade Média baseado na terra, com servos, senhores e relações entre suseranos e vassalos, é o:",a:["capitalismo","feudalismo","socialismo","mercantilismo","absolutismo"],r:1,e:"O feudalismo tinha economia agrária, servos presos à terra e relações de fidelidade entre suseranos e vassalos."},
{p:"O Renascimento valorizava o antropocentrismo, que significa:",a:["Deus no centro de tudo","o ser humano e a razão no centro","a Terra no centro do universo","o fim da arte","a volta do feudalismo"],r:1,e:"Antropocentrismo: o ser humano no centro das preocupações, valorizando a razão, a ciência e as artes."},
{p:"Em Brasília são 10h. Numa cidade 2 fusos a leste, são:",a:["8h","10h","12h","14h","9h"],r:2,e:"Para o leste as horas aumentam. Dois fusos = 2 horas a mais: 10h + 2h = 12h."},
{p:"O Brasil quase não tem terremotos fortes porque:",a:["não possui rochas","está no centro da Placa Sul-Americana, longe das bordas","fica no Hemisfério Sul","tem muitos rios","fica perto do Equador"],r:1,e:"Terremotos fortes ocorrem nas bordas das placas tectônicas. O Brasil fica no interior da Placa Sul-Americana."},
{p:"Julgar os costumes de outro povo como \"atrasados\" por serem diferentes dos seus é um exemplo de:",a:["relativismo cultural","etnocentrismo","democracia","antropocentrismo","Renascimento"],r:1,e:"Etnocentrismo é considerar a própria cultura superior e usá-la para julgar as outras."},
{p:"Um atleta come massas antes da prova para ter energia rápida. Ele está consumindo principalmente:",a:["lipídios","proteínas","carboidratos","vitaminas","sais minerais"],r:2,e:"Massas são ricas em amido, um carboidrato: a principal fonte de energia rápida do corpo."},
{p:"Marinheiros antigos, sem frutas frescas por meses, tinham sangramento nas gengivas. Faltava a vitamina:",a:["A","C","D","K","B12"],r:1,e:"A falta de vitamina C causa escorbuto. Frutas cítricas como laranja e limão previnem a doença."},
{p:"O modelo atômico que propôs um núcleo pequeno e denso, com elétrons girando ao redor, foi o de:",a:["Dalton","Thomson","Rutherford","Demócrito","Lavoisier"],r:2,e:"Rutherford descobriu o núcleo no experimento com a folha de ouro: o modelo planetário."},
{p:"As cores dos fogos de artifício são explicadas pelo modelo de Bohr porque:",a:["o átomo é uma bola maciça","elétrons que mudam de camada emitem luz de cores específicas","os prótons explodem","a pólvora é colorida","o núcleo se divide"],r:1,e:"No modelo de Bohr, o elétron ganha energia, sobe de camada e, ao voltar, libera essa energia como luz de cor característica."},
{p:"O sal de cozinha (NaCl) é formado por um metal (sódio) e um ametal (cloro). Sua ligação é:",a:["covalente","iônica","metálica","de hidrogênio","nuclear"],r:1,e:"Metal + ametal = ligação iônica: o sódio transfere um elétron para o cloro."},
{p:"Uma pedra cai do alto de um prédio, a partir do repouso. Após 3 segundos, sua velocidade é (g = 10 m/s²):",a:["3 m/s","10 m/s","13 m/s","30 m/s","90 m/s"],r:3,e:"v = v₀ + g × t = 0 + 10 × 3 = 30 m/s. A velocidade aumenta 10 m/s a cada segundo."},
{p:"Numa turma, 30 alunos gostam de futebol, 20 de vôlei e 10 gostam dos dois. Quantos gostam de pelo menos um dos esportes?",a:["30","40","50","60","20"],r:1,e:"30 + 20 − 10 = 40. Os 10 que gostam dos dois foram contados duas vezes, então subtrai uma vez."},
{p:"O lucro de uma loja é dado por L = −x² + 10x, em que x é a quantidade vendida. O lucro máximo acontece quando x vale:",a:["2","5","10","20","25"],r:1,e:"O x do vértice é −b ÷ (2a) = −10 ÷ (2 × −1) = 5. Nesse ponto o lucro é −25 + 50 = 25."},
{p:"Na sequência 2, 5, 8, 11, …, o 10º termo é:",a:["26","29","30","32","35"],r:1,e:"É uma PA de razão 3: a₁₀ = a₁ + 9 × r = 2 + 9 × 3 = 29."}
];

const BOLSO=["<b>Nunca deixe em branco</b>. Foque nas fáceis. Use o tempo todo e releia o comando.","Figuras: <b>metáfora</b> · <b>comparação</b> · <b>hipérbole</b> · <b>antítese</b> · <b>paradoxo</b> · <b>eufemismo</b>.","<b>Quinhentismo</b> (Carta de Caminha) · <b>Barroco</b> (fé x prazer, Gregório de Matos) · <b>Arcadismo</b> (vida no campo).","<b>Atenas</b>: democracia só para homens livres atenienses · <b>Roma</b>: direito romano.","<b>Feudalismo</b>: servos, terra, Igreja · <b>Renascimento</b>: antropocentrismo.","<b>Fusos</b>: 15° = 1 h; leste adianta.","<b>Placas tectônicas</b>: terremotos nas bordas; Brasil no meio da placa.","<b>Etnocentrismo</b> = julgar a cultura do outro pela sua.","<b>Carboidrato</b> energia rápida · <b>lipídio</b> reserva · <b>proteína</b> estrutura e enzimas.","Vitamina <b>C</b> escorbuto · <b>D</b> raquitismo · <b>A</b> cegueira noturna.","Átomo: Dalton bola · Thomson pudim · <b>Rutherford núcleo</b> · <b>Bohr camadas</b>.","<b>Iônica</b> metal + ametal · <b>covalente</b> ametais · <b>metálica</b> metais.","km/h ÷ 3,6 = m/s · queda livre: +10 m/s por segundo.","Conjuntos: A + B − (A e B) · <b>vértice x = −b ÷ 2a</b>.","<b>PA</b>: aₙ = a₁ + (n − 1)r · <b>PG</b>: aₙ = a₁ × qⁿ⁻¹."];

const CHK=["Sei a estratégia: fáceis primeiro, nada em branco","Reconheço as principais figuras de linguagem","Diferencio Quinhentismo, Barroco e Arcadismo","Sei como era a democracia ateniense e o feudalismo","Sei o que foi o Renascimento","Calculo fusos horários","Explico onde ocorrem terremotos","Sei a função dos carboidratos, lipídios, proteínas e vitaminas","Diferencio os modelos atômicos","Identifico ligação iônica e covalente","Calculo velocidade em queda livre","Resolvo problemas com conjuntos, função e PA/PG"];

function prog(){
  const tot=PARTES.length+QS.length+CHK.length;
  const feito=Object.keys(S.lidas).length+Object.keys(S.q).length+Object.values(S.chk).filter(Boolean).length;
  $("prog").style.width=Math.round(feito/tot*100)+"%";
  $("sub").textContent=`Progresso: ${Math.round(feito/tot*100)}% · ${Object.values(S.q).filter(x=>x.ok).length}/${QS.length} exercícios certos`;
}
let aba="estudar",qi=0,flipOn=false;
function estudar(){
  return `<div class="card"><span class="tag">Plano de estudo</span><h2>Olá, Raphael! 👋</h2><p>Você acertou <b>50%</b> do simulado estando no 1º ano: muito bom! Esta revisão reúne os conteúdos do <b>1º ano do ensino médio</b> que mais caem no ENEM, mais a estratégia para o dia da prova. Comece pela parte 1. Toque para abrir.</p>
  <span class="pill">⏱ ~2h45 no total</span><span class="pill">📖 5 partes</span><span class="pill">✍️ 20 exercícios</span></div>`+
  PARTES.map((p,i)=>`<div class="acc" id="acc-${p.id}"><button onclick="abrir('${p.id}')"><span>${p.t}${S.lidas[p.id]?'<span class="ok">✓ lido</span>':''}</span><span class="seta">›</span></button><div class="body">
   <p style="color:var(--cinza);font-size:13px">⏱ ${p.tempo}</p>${p.h}
   <button class="btn y" style="margin-top:8px" onclick="lido('${p.id}')">${S.lidas[p.id]?"✓ Parte concluída":"Terminei esta parte ✓"}</button></div></div>`).join("")+
  `<div class="card"><p style="margin:0">Depois de ler, vá em <b>🃏 Cartões</b> para memorizar e em <b>✍️ Exercícios</b> para treinar.</p></div>`;
}
function abrir(id){const el=$("acc-"+id);el.classList.toggle("on")}
function lido(id){S.lidas[id]=1;save();render();setTimeout(()=>{const n=PARTES.findIndex(p=>p.id===id)+1;if(PARTES[n])$("acc-"+PARTES[n].id).classList.add("on")},50)}
function cartoes(){
  const i=S.card%CARDS.length,c=CARDS[i];
  return `<div class="card"><span class="tag">Cartões de memória</span><p style="margin:0">Leia a frente, tente lembrar a resposta e toque no cartão para virar.</p></div>
  <div class="flip ${flipOn?'on':''}" onclick="virar()"><div class="in"><div class="f">${c[0]}<small>Toque para ver a resposta · ${i+1} de ${CARDS.length}</small></div><div class="v">${c[1]}<small>Toque para voltar</small></div></div></div>
  <div class="row"><button class="btn s" onclick="mudar(-1)">‹ Anterior</button><button class="btn p" onclick="mudar(1)">Próximo ›</button></div>
  <button class="btn s" style="width:100%;margin-top:10px" onclick="embaralhar()">🔀 Embaralhar</button>`;
}
function virar(){flipOn=!flipOn;document.querySelector(".flip").classList.toggle("on",flipOn)}
function mudar(d){flipOn=false;S.card=(S.card+d+CARDS.length)%CARDS.length;save();render()}
function embaralhar(){for(let i=CARDS.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[CARDS[i],CARDS[j]]=[CARDS[j],CARDS[i]]}S.card=0;flipOn=false;save();render()}
function exercicios(){
  const feitos=Object.keys(S.q).length,cert=Object.values(S.q).filter(x=>x.ok).length;
  if(qi>=QS.length){
    const pct=Math.round(cert/QS.length*100);
    return `<div class="card" style="text-align:center"><span class="tag">Resultado</span><div class="big">${cert}/${QS.length}</div><p><b>${pct>=80?"Excelente, Raphael! Pronto para a prova 🚀":pct>=60?"Bom! Revise os que errou 💪":"Releia os resumos e tente de novo 📚"}</b></p>
    <button class="btn y" onclick="refazer()">Refazer exercícios</button><button class="btn s" style="width:100%;margin-top:8px" onclick="qi=0;render()">Ver as questões de novo</button></div>`;
  }
  const q=QS[qi],r=S.q[qi];
  let h=`<div class="card"><span class="tag">Exercício ${qi+1} de ${QS.length}</span><div class="q">${q.p}</div>`+
  ordem(qi).map((k,pos)=>{let c="";if(r){if(k===q.r)c="c";else if(k===r.esc)c="e"}return `<button class="alt ${c}" onclick="resp(${k})"><span class="l">${"ABCDE"[pos]}</span><span>${q.a[k]}</span></button>`}).join("");
  if(r)h+=`<div class="exp ${r.ok?'c':'e'}"><b>${r.ok?"✅ Acertou!":"❌ Não foi dessa vez. Resposta: "+"ABCDE"[ordem(qi).indexOf(q.r)]}</b><br>${q.e}</div>`;
  h+=`</div><div class="row"><button class="btn s" onclick="qi=Math.max(0,qi-1);render()" ${qi===0?"disabled":""}>‹ Voltar</button><button class="btn p" onclick="qi++;render()">${qi===QS.length-1?"Ver resultado":"Próximo ›"}</button></div>
  <p style="text-align:center;color:var(--cinza);font-size:13px;margin-top:10px">${cert} certos de ${feitos} respondidos</p>`;
  return h;
}
function ordem(i){let t=(i+1)*2654435761+55>>>0;const rnd=()=>{t+=0x6D2B79F5;let x=t;x=Math.imul(x^x>>>15,x|1);x^=x+Math.imul(x^x>>>7,x|61);return((x^x>>>14)>>>0)/4294967296};const a=[0,1,2,3,4];for(let k=4;k>0;k--){const j=Math.floor(rnd()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function resp(k){if(S.q[qi])return;S.q[qi]={esc:k,ok:k===QS[qi].r};try{navigator.vibrate&&navigator.vibrate(k===QS[qi].r?60:[80,60,80])}catch(e){};save();render()}
function refazer(){S.q={};qi=0;save();render()}
function revisao(){
  return `<div class="card"><span class="tag">Resumo de bolso</span><h2>⚡ Revise em 5 minutos</h2><p style="color:var(--cinza)">Leia antes de dormir e de manhã, antes da prova.</p><ul>${BOLSO.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <div class="card chk"><span class="tag">Checklist</span><h2>Eu já sei…</h2>${CHK.map((t,i)=>`<label><input type="checkbox" ${S.chk[i]?"checked":""} onchange="S.chk[${i}]=this.checked;save()">${t}</label>`).join("")}</div>`;
}
function render(){
  const V={estudar,cartoes,exercicios,revisao};
  $("app").innerHTML=V[aba]()+FOOT;prog();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{aba=b.dataset.t;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x===b));flipOn=false;render();window.scrollTo(0,0)});
render();
</script>
</body>
</html>
