<script>
const ALUNO="Raphael Brander", ALUNO_CURTO="Raphael", KEY="simulado-enem-raphael-v2-v1";
const Q=[{"y": 2018, "i": 41, "d": "linguagens", "c": "![](img/2018-41-0.png)\n\nDisponível em: www.sul21.com.br. Acesso em: 1 dez. 2017 (adaptado).", "intro": "Nesse texto, busca-se convencer o leitor a mudar seu comportamento por meio da associação de verbos no modo imperativo à", "a": ["Indicação de diversos canais de atendimento.", "Divulgação do Centro de Defesa da Mulher.", "Informação sobre a duração da campanha.", "Apresentação dos diversos apoiadores.", "Utilização da imagem das três mulheres."], "af": [null, null, null, null, null]}, {"y": 2015, "i": 125, "d": "linguagens", "c": "**Posso mandar por e-mail?**  \nAtualmente, é comum “disparar” currículos na interent com a expectativa de alcançar o maior número possível de selecionadores. Essa, no entanto, é uma ideia equivocada: é preciso saber quem vai receber seu currículo e se a vaga é realmente indicada para seu perfil, sob risco de estar “queimando o filme” com um futuro empregador. Ao enviar o currículo por e-mail, tente saber quem vai recebê-lo e faça um texto sucinto de apresentação, com a sugestão a seguir:\n\n**Assunto:** Currículo para a vaga de gerente de marketing  \n**Mensagem:** Boa tarde. Meu nome é José da Silva e gostaria de me candidatar à vaga de gerente de marketing. Meu currículo segue anexo.\n\nGuia da língua 2010: modelos e técnicas. **Língua Portuguesa**, 2010 (adaptado).", "intro": "O texto integra um guia de modelos e técnicas de elaboração de textos e cumpre a função social de:", "a": ["Divulgar padrão oficial de redação e envio de currículos.", "Indicar um modelo de currículo para pleitear uma vaga de emprego.", "Instruir o leitor sobre como ser eficiente no envio de currículo por e-mail.", "Responder a uma pergunta de um assinante da revista sobre o envio de currículo por e-mail.", "Orientar o leitor sobre como alcançar o maior número possível de selecionadores de currículos."], "af": [null, null, null, null, null]}, {"y": 2019, "i": 31, "d": "linguagens", "c": "![](img/2019-31-0.png)", "intro": "Na obra Cabeça de touro, o material descartado torna-se objeto de arte por meio da", "a": ["Reciclagem da matéria-prima original.", "Complexidade da combinação de formas abstratas.", "Perenidade dos elementos que constituem a escultura.", "Mudança da funcionalidade pela integração dos objetos.", "Fragmentação da imagem no uso de elementos diversificados."], "af": [null, null, null, null, null]}, {"y": 2023, "i": 24, "d": "linguagens", "c": "![](img/2023-24-0.png)", "intro": "Esse anúncio publicitário, veiculado durante o contexto da pandemia de covid-19, tem por finalidade", "a": ["Divulgar o canal telefônico de atendimento a casos de violência contra a mulher.", "Informar sobre a atuação de uma entidade defensora da mulher vítima de violência.", "Evidenciar o trabalho da Defensoria Pública em relação ao problema do abuso contra a mulher.", "Alertar a sociedade sobre o aumento da violência contra a mulher em decorrência do coronavírus.", "Incentivar o público feminino a denunciar crimes de violência contra a mulher durante o período de isolamento"], "af": [null, null, null, null, null]}, {"y": 2021, "i": 1, "d": "linguagens", "c": "We are now a nation obsessed with the cult of celebrity. Celebrities have replaced the classic notion of the hero. But instead of being respected for talent, courage or intelligence, it is money, style and image the deciding factors in what commands respect. Image is evrything. Their image is painstakingly constructed by a multitude of different image consultants to carve out the most profitable celebrity they can. Then society is right behind them, believing in evrything that celebrity believes in.  \nCompanies know that people will buy a product if a celebrity has too. It is as if the person buying the product feels that they now have some kind of connection with the celebrity and that some of their perceived happiness will now be passed onto the consumer. So to look at it one way, the cult of celebrity is really nothing more than a sophisticated marketing scheme. Celeebrities though cannot be blamed for all negative aspects of society. In reality society is to blame. We are the people who seemed to have lost the ability to think for ourselves. I suppose it’s easier to be told what to think, rather than challenging what we are told. The reason we are swamped by celebrity is because there is a demand for it.\n\nDisponível em: www.pitlanemagazine.com  \nAcesso em: 7 dez.2017 (adaptado)", "intro": "O texto, que aborda questões referentes ao tema do culto à celebridade, tem o objetivo de", "a": ["Destacar os méritos das celebridades.", "Criticar o consumismo das celebridades.", "Ressaltar a necessidade de reflexão dos fãs.", "Culpar as celebridades pela obsessão dos fãs.", "Valorizar o marketing pessoal das celebridades."], "af": [null, null, null, null, null]}, {"y": 2017, "i": 17, "d": "linguagens", "c": "**Textos e hipertextos: procurando o equilíbrio**\n\nHá um medo por parte dos pais e de alguns professores de as crianças desaprenderem quando navegam, medo de elas viciarem, de obterem informação não confiável, de elas se isolarem do mundo real, como se o computador fosse um agente do mal, um vilão. Esse medo é reforçado pela mídia, que costuma apresentar o computador como um agente negativo na aprendizagem e na socialização dos usuários. Nós sabemos que ninguém corre o risco de desaprender quando navega, seja em ambientes digitais ou em materiais impressos, mas é preciso ver o que se está aprendendo e algumas vezes interferir nesse processo a fim de otimizar ou orientar a aprendizagem, mostrando aos usuários outros temas, outros caminhos, outras possibilidades diferentes daquelas que eles encontraram sozinhos ou daquelas que eles costumam usar. É preciso, algumas vezes, negociar o uso para que ele não seja exclusivo, uma vez que há outros meios de comunicação, outros meios de informação e outras alternativas de lazer. É uma questão de equilibrar e não de culpar.\n\nCOSCARELLI, C. V. **Linguagem em (Dis)curso**, n. 3, set.-dez. 2009.", "intro": "A autora incentiva o uso da internet pelos estudantes, ponderando sobre a necessidade de orientação a esse uso, pois essa tecnologia", "a": ["Está repleta de informações confiáveis que constituem fonte única para a aprendizagem dos alunos.", "Exige dos pais e professores que proíbam seu uso abusivo para evitar que se torne um vício.", "Tende a se tomar um agente negativo na aprendizagem e na socialização de crianças e jovens.", "Possibilita maior ampliação do conhecimento de mundo quando a aprendizagem é direcionada.", "Leva ao isolamento do mundo real e ao uso exclusivo do computador se a navegação for desmedida."], "af": [null, null, null, null, null]}, {"y": 2020, "i": 36, "d": "linguagens", "c": "LUTA: prática corporal imprevisível, caracterizada por determinado estado de contato proposital, que possibilita a duas ou mais pessoas se enfrentarem numa constante troca de ações ofensivas e/ou defensivas, regidas por regras, com o objetivo mútuo sobre um alvo móvel personificado no oponente.\n\nGOMES, M. S. P. _et al_. Ensino das lutas: dos princípios condicionais aos grupos situacionais.\n\n**Movimento**, n. 2, abr.-jun. 2010 (adaptado).", "intro": "De acordo com o texto, podemos identificar uma abordagem das lutas nas aulas de educação física quando o professor realiza uma proposta envolvendo", "a": ["Contato corporal intenso entre o aluno e seu oponente.", "Contenda entre os alunos que se agridem fisicamente.", "Confronto corporal em que os vencedores são previamente identificados.", "Combate corporal intencional com ações regulamentadas entre os oponentes.", "Conflito resolvido pelos alunos por meio de regras previamente estabelecidas."], "af": [null, null, null, null, null]}, {"y": 2014, "i": 93, "d": "linguagens", "c": "**The Road Not Taken (by Robert Frost)**\n\nTwo roads diverged in a wood, and I —  \nI took the one less traveled by,  \nAnd that has made all the difference.\n\nDisponível em: www.poetryfoundation.org. Acesso em: 29 nov. 2011 (fragmento).", "intro": "Estes são os versos finais do famoso poema The Road Not Taken, do poeta americano Robert Frost. Levando-se em consideração que a vida é comumente metaforizada como uma viagem, esses versos indicam que o autor", "a": ["Festeja o fato de ter sido ousado na escolha que fez em sua vida.", "Lamenta por ter sido um viajante que encontrou muitas bifurcações.", "Viaja muito pouco e que essa escolha fez toda a diferença em sua vida.", "Reconhece que as dificuldades em sua vida foram todas superadas.", "Percorre várias estradas durante as diferentes fases de sua vida."], "af": [null, null, null, null, null]}, {"y": 2016, "i": 128, "d": "linguagens", "c": "O filme _Menina de ouro_ conta a história de Maggie Fitzgerald, uma garçonete de 31 anos que vive sozinha em condições humildes e sonha em se tornar uma boxeadora profissional treinada por Frankie Dunn.  \nEm uma cena, assim que o treinador atravessa a porta do corredor onde ela se encontra, Maggie o aborda e, a caminho da saída, pergunta a ele se está interessado em treiná-la. Frankie responde: “Eu não treino garotas”. Após essa fala, ele vira as costas e vai embora. Aqui, percebemos, em Frankie, um comportamento ancorado na representação de que boxe é esporte de homem e, em Maggie, a superação da concepção de que os ringues são tradicionalmente masculinos.  \nHistoricamente construída, a feminilidade dominante atribui a submissão, a fragilidade e a passividade a uma “natureza feminina”. Numa concepção hegemônica dos gêneros, feminilidades e masculinidades encontram-se em extremidades opostas.  \nNo entanto, algumas mulheres, indiferentes às convenções sociais, sentem-se seduzidas e desafiadas a aderirem à prática das modalidades consideradas masculinas. É o que observamos em Maggie, que se mostra determinada e insiste em seu objetivo de ser treinada por Frankie.\n\nFERNANDES, V.; MOURÃO, L. **Menina de ouro e a representação de feminilidades plurais**.  \nMovimento, n. 4, out.-dez. 2014 (adaptado).", "intro": "A inserção da personagem Maggie na prática corporal do boxe indica a possibilidade da construção de uma feminilidade marcada pela", "a": ["Adequação da mulher a uma modalidade esportiva alinhada a seu gênero.", "Valorização de comportamentos e atitudes normalmente associados à mulher.", "Transposição de limites impostos à mulher num espaço de predomínio masculino.", "Aceitação de padrões sociais acerca da participação da mulher nas lutas corporais.", "Naturalização de barreiras socioculturais responsáveis pela exclusão da mulher no boxe."], "af": [null, null, null, null, null]}, {"y": 2022, "i": 21, "d": "linguagens", "c": "**A escrava**\n\n– Admira-me —, disse uma senhora de sentimentos sinceramente abolicionistas —; faz-me até pasmar como se possa sentir, e expressar sentimentos escravocratas, no presente século, no século dezenove! A moral religiosa e a moral cívica aí se erguem, e falam bem alto esmagando a hidra que envenena a família no mais sagrado santuário seu, e desmoraliza, e avilta a nação inteira! Levantai os olhos ao Gólgota, ou percorrei-os em torno da sociedade, e dizei-me:\n\n— Para que se deu em sacrifício, o Homem Deus, que ali exalou seu derradeiro alento? Ah! Então não era verdade que seu sangue era o resgate do homem! É então uma mentira abominável ter esse sangue comprado a liberdade!? E depois, olhai a sociedade… Não vedes o abutre que a corrói constantemente!… Não sentis a desmoralização que a enerva, o cancro que a destrói?\n\nPor qualquer modo que encaremos a escravidão, ela é, e sempre será um grande mal. Dela a decadência do comércio; porque o comércio e a lavoura caminham de mãos dadas, e o escravo não pode fazer florescer a lavoura; porque o seu trabalho é forçado.\n\nREIS, M. F. **Úrsula outras obras**. Brasília: Câmara dos Deputados, 2018", "intro": "Inscrito na estética romântica da literatura brasileira, o conto descortina aspectos da realidade nacional no século XIX ao", "a": ["Revelar a imposição de crenças religiosas a pessoas escravizadas.", "Apontar a hipocrisia do discurso conservador na defesa da escravidão.", "Sugerir práticas de violência física e moral em nome do progresso material.", "Relacionar o declínio da produção agrícola e comercial a questões raciais.", "Ironizar o comportamento dos proprietários de terra na exploração do trabalho."], "af": [null, null, null, null, null]}, {"y": 2022, "i": 46, "d": "ciencias-humanas", "c": "Espera, resignado, o dia 13 daquele mês porque, em tal data, usança avoenga lhe faculta sondar o futuro, interrogando a providência. É a experiência tradicional de Santa Luzia. No dia 12 ao anoitecer expõe ao relento, em linha, seis pedrinhas de sal, que representam, em ordem sucessiva da esquerda para a direita, os seis meses vindouros, de janeiro a junho. Ao alvorecer de 13 observa-as: se estão intactas, pressagiam a seca; se a primeira apenas se deliu,  transmudada em aljôfar límpido, é certa a chuva em janeiro; se a segunda, em fevereiro; se a maioria ou todas, é inevitável O inverno benfazejo. Esta experiência é belíssima.\n\nCUNHA, E. **Os sertões**. São Paulo: Editora Três, 1984.", "intro": "No experimento descrito, a relação com a paisagem e com a religiosidade permite que o sertanejo seja", "a": ["Afeito à devoção ao aceitar destinos sacralizados.", "Acostumado à pobreza ao admitir acasos naturais.", "Habituado ao solo ao conhecer terrenos cultiváveis.", "Íntimo à Caatinga ao interpretar condições ambientais.", "Próximo à vegetação ao identificar espécies arbustivas."], "af": [null, null, null, null, null]}, {"y": 2016, "i": 7, "d": "ciencias-humanas", "c": "**TEXTO I**\n\n![](img/2016-7-0.jpg)\n\nTradução: “As mulheres do futuro farão da Lua um  \nlugar mais limpo para se viver”.\n\nDisponível em: www.propagandashistoricas.com.br. Acesso em: 16 out. 2015.\n\n**TEXTO II**\n\n**Metade da nova equipe da Nasa** **é composta por mulheres**\n\nAté hoje, cerca de 350 astronautas americanos já estiveram no espaço, enquanto as mulheres não chegam a ser um terço desse número. Após o anúncio da turma composta 50% por mulheres, alguns internautas escreveram comentários machistas e desrespeitosos sobre a escolha nas redes sociais.\n\nDisponível em: https//catracalivre com br. Acesso em 10 mar 2016", "intro": "A comparação entre o anúncio publicitário de 1968 e a repercussão da notícia mostra a", "a": ["Elitização da carreira científica.", "Qualificação da atividade doméstica.", "Ambição de indústrias patrocinadoras.", "Manutenção de estereótipos de gênero.", "Equiparação de papeis nas relações familiares."], "af": [null, null, null, null, null]}, {"y": 2014, "i": 27, "d": "ciencias-humanas", "c": "A urbanização brasileira, no início da segunda metade do século XX, promoveu uma radical alteração nas cidades. Ruas foram alargadas, túneis e viadutos foram construídos. O bonde foi a primeira vítima fatal. O destino do sistema ferroviário não foi muito diferente. O transporte coletivo saiu definitivamente dos trilhos.\n\nJANOT, L. F. **A caminho de Guaratiba.** Disponível em: www.iab.org.br. Acesso em: 9 jan. 2014 (adaptado).", "intro": "A relação entre transportes e urbanização é explicada, no texto, pela", "a": ["Retirada dos investimentos estatais aplicados em transporte de massa.", "Demanda por transporte individual ocasionada pela expansão da mancha urbana.", "Presença hegemônica do transporte alternativo localizado nas periferias das cidades.", "Aglomeração do espaço urbano metropolitano impedindo a construção do transporte metroviário.", "Predominância do transporte rodoviário associado à penetração das multinacionais automobilísticas."], "af": [null, null, null, null, null]}, {"y": 2020, "i": 81, "d": "ciencias-humanas", "c": "Porque todos confessamos não se poder viver sem alguns escravos, que busquem a lenha e a água, e façam cada dia o pão que se come, e outros serviços que não são possíveis poderem-se fazer pelos Irmãos Jesuítas, máxime sendo tão poucos, que seria necessário deixar as confissões e tudo mais. Parece-me que a Companhia de Jesus deve ter e adquirir escravos, justamente, por meios que as Constituições permitem, quando puder para nossos colégios e casas de meninos.\n\nLEITE, S. História da Companhia de Jesus no Brasil. Rio de Janeiro: Civilização Brasileira. 1938 (adaptado).", "intro": "O texto explicita premissas da expansão ultramarina portuguesa ao buscar justificar a", "a": ["Propagação do ideário cristão.", "Valorização do trabalho braçal.", "Adoção do cativeiro na Colônia.", "Adesão ao ascetismo contemplativo.", "Alfabetização dos indígenas nas Missões."], "af": [null, null, null, null, null]}, {"y": 2021, "i": 50, "d": "ciencias-humanas", "c": "**TEXTO I**\n\nEm 2016, foram gerados 44,7 milhões de toneladas de resíduos eletrônicos, um aumento de 8% na comparação com 2014. Especialistas previram um crescimento de mais 17%, para 52,2 milhões de toneladas, até 2021.\n\nDisponível em: https://nacoesunidas.org. Acesso em: 12 out.2019 (adaptado).\n\n**TEXTO II**\n\nHá ainda quem exporte deliberadamente lixo eletrônico para o Gana. É mais caro reciclar devidamente os resíduos no mundo industrializado, onde até existem os recursos e a tecnologia. Um negócio muito mais lucrativo é vender o lixo eletrônico a negociantes locais, que o importam alegando tratar-se de material usado. Os negociantes depois vendem o lixo aos jovens no mercado, ou noutro lado, que o desmantelam e extraem os fios de cobre. Estes são derretidos em lareiras ao ar livre, poluindo o ar e, muitas vezes, intoxicando diretamente os próprios jovens.\n\nKALEDZI, I.; SOUZA, G. Disponivel em: www.dw.com. Acesso em: 12 out. 2019 (adaptado).", "intro": "No contexto das discussões ambientais, as práticas descritas nos textos refletem um padrão de relações derivado do(a):", "a": ["Exercício pleno da cidadania.", "Divisão internacional do trabalho.", "Gestão empresarial do toyotismo.", "Concepção sustentável da economia.", "Protecionismo alfandegário dos Estados."], "af": [null, null, null, null, null]}, {"y": 2019, "i": 63, "d": "ciencias-humanas", "c": "**TEXTO I**\n\nA centralização econômica, o protecionismo e a expansão ultramarina engrandeceram o Estado, embora beneficias sem a burguesia incipiente.\n\n**ANDERSON, P. In: DEYON, P. O mercantilismo. Lisboa: Gradiva, 1989 (adaptado).**\n\n**TEXTO II**\n\nAs interferências da legislação e das práticas exclusivistas restringem a operação benéfica da lei natural na esfera das relações econômicas.\n\n**SMITH, A. A riqueza das Nações. São Paulo: Abril Cultural, 1983 (adaptado).**", "intro": "Entre os séculos XVI e XIX, diferentes concepções sobre as relações entre Estado e economia foram formuladas. Tais concepções, associadas a cada um dos textos, confrontam-se, respectivamente, na oposição entre as práticas de:", "a": ["Valorização do pacto colonial — combate à livre-iniciativa.", "Defesa dos monopólios régios — apoio à livre concorrência.", "Formação do sistema metropolitano — crítica à livre navegação.", "Abandono da acumulação metalista — estímulo ao livre-comércio.", "Eliminação das tarifas alfandegárias — incentivo ao livre-cambismo."], "af": [null, null, null, null, null]}, {"y": 2023, "i": 62, "d": "ciencias-humanas", "c": "Enormes alto-falantes sul-coreanos instalados na fronteira com o Norte costumavam transmitir desde canções em estilo K-pop (como é chamado o pop sul-coreano) até boletins climáticos e noticiário crítico ao vizinho comunista. O Norte costuma praticar atividade semelhante, transmitindo por seus alto-falantes discursos críticos a Seul e aliados. Durante os anos 1980, o governo sul-coreano construiu um mastro de 97 metros de altura para hastear sua bandeira no povoado de Daesong-dong, na fronteira com o Norte. O Norte respondeu com a construção de um mastro ainda mais alto (160 m) na cidade fronteiriça de Gijung-dong. “Essas demonstrações são uma válvula de escape competitiva e importante entre os dois lados, fora de um possível conflito militar”, diz o analista Ankit Panda.\n\nTAN, Y. **Disputa de mastros e alto-falantes com K-pop:** as pequenas picuinhas do conflito entre as Coreias. Disponível em: www.bbc.com. Acesso em: 7 nov. 2021 (adaptado).", "intro": "Os atos de competição citados têm suas origens históricas vinculadas a um contexto de", "a": ["Domínio cultural-identitário de atores sociais.", "Disputas étnico-raciais de povos tradicionais.", "Divergências político-ideológicas de agentes estatais.", "Imposição econômico-financeira de empresas privadas", "Protestos ecológico-sustentáveis de entidades ambientais"], "af": [null, null, null, null, null]}, {"y": 2017, "i": 46, "d": "ciencias-humanas", "c": "No império africano do Mali, no século XIV, Tombuctu foi centro de um comércio internacional onde tudo era negociado — sal, escravos, marfim etc. Havia também um grande comércio de livros de história, medicina, astronomia e matemática, além de grande concentração de estudantes. A importância cultural de Tombuctu pode ser percebida por meio de um velho provérbio: “O sal vem do norte, o ouro vem do sul, mas as palavras de Deus e os tesouros da sabedoria vêm de Tombuctu”.\n\nASSUMPÇÃO, J. E. **África: uma história a ser reescrita**. In: MACEDO, J. R. (Org.). Desvendando a história da África. Porto Alegre: UFRGS, 2008 (adaptado).", "intro": "Uma explicação para o dinamismo dessa cidade e sua importância histórica no período mencionado era o(a)", "a": ["Isolamento geográfico do Saara ocidental.", "Exploração intensiva de recursos naturais.", "Posição relativa nas redes de circulação.", "Tráfico transatlântico de mão de obra servil.", "Competição econômica dos reinos da região."], "af": [null, null, null, null, null]}, {"y": 2015, "i": 24, "d": "ciencias-humanas", "c": "A participação da África na Segunda Guerra Mundial deve ser apreciada sob a ótica da escolha entre vários demônios. O seu engajamento não foi um processo de colaboração com o imperialismo, mas uma luta contra uma forma de hegemonia ainda mais perigosa.\n\nMAZRUI, A. “Procurai primeiramente o reino do político …” In: MAZRUI, A., WONDJI, C. (Org.). **História geral da África**: África desde 1925. Brasília: Unesco, 2010.", "intro": "Para o autor, a “forma de hegemonia” e uma de suas características que explicam o engajamento dos africanos no processo analisado foram:", "a": ["Comunismo / rejeição da democracia liberal.", "Capitalismo / devastação do ambiente natural.", "Fascismo / adoção do determinismo biológico.", "Socialismo / planificação da economia nacional.", "Colonialismo / imposição da missão civilizatória."], "af": [null, null, null, null, null]}, {"y": 2018, "i": 53, "d": "ciencias-humanas", "c": "Foi-se o tempo em que era possível mostrar um mundo econômico organizado em camadas bem definidas, onde grandes centros urbanos se ligavam, por si próprios, a economias adjacentes “lentas”, com o ritmo muito mais rápido do comércio e das finanças de longo alcance. Hoje tudo ocorre como se essas camadas sobrepostas estivessem mescladas e interpermeadas.  \nInterdependências de curto e longo alcance não podem mais ser separadas umas das outras.\n\nBRENNER, N. **A globalização como reterritorialização**. Cadernos Metrópole, n. 24, jul.-dez. 2010 (adaptado).", "intro": "A maior complexidade dos espaços urbanos contemporâneos ressaltada no texto explica-se pela", "a": ["Expansão de áreas metropolitanas.", "Emancipação de novos municípios.", "Consolidação de domínios jurídicos.", "Articulação de redes multiescalares.", "Redefinição de regiões administrativas."], "af": [null, null, null, null, null]}, {"y": 2016, "i": 56, "d": "ciencias-natureza", "c": "As proteínas de uma célula eucariótica possuem peptídeos sinais, que são sequências de aminoácidos responsáveis pelo seu endereçamento para as diferentes organelas, de acordo com suas funções. Um pesquisador desenvolveu uma nanopartícula capaz de carregar proteínas para dentro de tipos celulares específicos. Agora ele quer saber se uma nanopartícula carregada com uma proteína bloqueadora do ciclo de Krebs _in vitro_ é capaz de exercer sua atividade em uma célula cancerosa, podendo cortar o aporte energético e destruir essas células.", "intro": "Ao escolher essa proteína bloqueadora para carregar as nanopartículas, o pesquisador deve levar em conta um peptídeo sinal de endereçamento para qual organela?", "a": ["Núcleo.", "Mitocôndria.", "Peroxissomo.", "Complexo golgiense.", "Retículo endoplasmático."], "af": [null, null, null, null, null]}, {"y": 2023, "i": 133, "d": "ciencias-natureza", "c": "O descarte de detergentes comuns nos esgotos domésticos ocasiona a formação de uma camada de espuma que impede a entrada de oxigênio na água. Os microrganismos que vivem nessas águas não são capazes de quebrar moléculas ramificadas, ocorrendo assim um desequilíbrio ambiental nos rios. A fórmula a seguir representa a estrutura química de um tensoativo presente na composição de um detergente não biodegradável.\n\n![](img/2023-133-0.png)\n\n**Tensoativo não biodegradável**", "intro": "Qual modificação química na estrutura desse tensoativo o tornaria um detergente biodegradável?", "a": ["Retirar a parte polar da molécula.", "Eliminar as insaturações do anel aromático.", "Trocar o grupo aniônico por um grupo neutro.", "Alterar o grupo aniônico por um grupo catiônico.", "Modificar a cadeia carbônica para cadeia normal."], "af": [null, null, null, null, null]}, {"y": 2017, "i": 105, "d": "ciencias-natureza", "c": "A figura mostra o funcionamento de uma estação híbrida de geração de eletricidade movida a energia eólica e biogás. Essa estação possibilita que a energia gerada no parque eólico seja armazenada na forma de gás hidrogênio, usado no fornecimento de energia para a rede elétrica comum e para abastecer células a combustível.\n\n![](img/2017-105-0.jpg)", "intro": "Mesmo com ausência de ventos por curtos períodos, essa estação continua abastecendo a cidade onde está\ninstalada, pois o(a)", "a": ["Planta mista de geração de energia realiza eletrólise para enviar energia à rede de distribuição elétrica.", "Hidrogênio produzido e armazenado é utilizado na combustão com o biogás para gerar calor e eletricidade.", "Conjunto de turbinas continua girando com a mesma velocidade, por inércia, mantendo a eficiência anterior.", "Combustão da mistura biogás-hidrogênio gera diretamente energia elétrica adicional para a manutenção da estação.", "Planta mista de geração de energia é capaz de utilizar todo o calor fornecido na combustão para a geração de eletricidade."], "af": [null, null, null, null, null]}, {"y": 2018, "i": 117, "d": "ciencias-natureza", "c": "O nível metabólico de uma célula pode ser determinado pela taxa de síntese de RNAs e proteínas, processos dependentes de energia. Essa diferença na taxa de síntese de biomoléculas é refletida na abundância e características morfológicas dos componentes celulares. Em uma empresa de produção de hormônios proteicos a partir do cultivo de células animais, um pesquisador deseja selecionar uma linhagem com o metabolismo de síntese mais elevado, dentre as cinco esquematizadas na figura.\n\n![](img/2018-117-0.png)", "intro": "Qual linhagem deve ser escolhida pelo pesquisador?", "a": ["I", "II", "III", "IV", "V"], "af": [null, null, null, null, null]}, {"y": 2021, "i": 111, "d": "ciencias-natureza", "c": "Uma escola iniciou o processo educativo para implantação da coleta seletiva e destino de materiais recicláveis. Para atingir seus objetivos, a instituição planejou:\n\n1) Sensibilizar a comunidade escolar, desenvolvendo atividades em sala e extraclasse de maneira contínua;\n\n2) capacitar o pessoal responsável pela limpeza da escola quanto aos novos procedimentos adotados com a coleta seletiva; e\n\n3) distribuir coletores de materiais recicláveis específicos nas salas, pátio e outros ambientes para acondicionamento dos resíduos.", "intro": "Para completar a ação proposta no ambiente escolar, o que falta ser inserido no planejamento?", "a": ["Realizar campanhas educativas de sensibilização em bairros vizinhos para fortalecer a coleta seletiva.", "Filmar parceria com a prefeitura ou cooperativa de catadores para recolhimento dos materiais recicláveis e destinação apropriada.", "Organizar visitas ao lixão ou aterro local para identificar aspectos importantes sobre a disposição final do lixo.", "Divulgar na rádio local, no local impresso e nas redes sociais que a escola está realizando a coleta seletiva.", "Colocar recipientes coletores de lixo reciclável fora da escola para entrega voluntária pela população."], "af": [null, null, null, null, null]}, {"y": 2015, "i": 57, "d": "ciencias-natureza", "c": "O ar atmosférico pode ser utilizado para armazenar o excedente de energia gerada no sistema elétrico, diminuindo seu desperdício, por meio do seguinte processo: água e gás carbônico são inicialmente removidos do ar atmosférico e a massa de ar restante é resfriada ate -198°C. Presente na proporção de 78% dessa massa de ar, o nitrogênio gasoso é liquefeito, ocupando um volume 700 vezes menor. A energia excedente do sistema elétrico é utilizada nesse processo, sendo parcialmente recuperada quando o nitrogênio líquido, exposto à temperatura ambiente, entra em ebulição e se expande, fazendo girar turbinas que convertem energia mecânica em energia elétrica.\n\nMACHADO, R. Disponível em: www.correiobraziliense.com.br. Acesso em: 9 set. 2013 (adaptado).", "intro": "No processo descrito, o excedente de energia elétrica é armazenado pela", "a": ["Expansão do nitrogênio durante a ebulição.", "Absorção de calor pelo nitrogênio durante a ebulição.", "Realização de trabalho sobre o nitrogênio durante a liquefação.", "Retirada de água e gás carbônico da atmosfera antes do resfriamento.", "Liberação de calor do nitrogênio para a vizinhança durante a liquefação"], "af": [null, null, null, null, null]}, {"y": 2022, "i": 127, "d": "ciencias-natureza", "c": "Os ursos, por não apresentarem uma hibernação verdadeira, acordam por causa da presença de termogenina, uma proteína mitocondrial que impede a chegada dos prótons até a ATP sintetase, gerando calor. Esse calor é importante para aquecer o organismo, permitindo seu despertar.\n\nSADAVA, D. et al. Vida: a ciência da biologia. Porto Alegre: Artmed, 2009 (adaptado).", "intro": "Em qual etapa do metabolismo energético celular a termogenina interfere?", "a": ["Glicólise.", "Fermentação lática.", "Ciclo do ácido cítrico.", "Oxidação do piruvato.", "Fosforilação oxidativa."], "af": [null, null, null, null, null]}, {"y": 2014, "i": 81, "d": "ciencias-natureza", "c": "Os parasitoides (misto de parasitas e predadores) são insetos diminutos que têm hábitos muito peculiares: suas larvas podem se desenvolver dentro do corpo de outros organismos, como mostra a figura. A forma adulta se alimenta de pólen e açúcares. Em geral, cada parasitoide ataca hospedeiros de determinada espécie e, por isso, esses organismos vêm sendo amplamente usados para o controle biológico de pragas agrícolas.\n\n![](img/2014-81-0.jpg)", "intro": "A forma larval do parasitoide assume qual papel nessa cadeia alimentar?", "a": ["Consumidor primário, pois ataca diretamente uma espécie herbívora.", "Consumidor secundário, pois se alimenta diretamente dos tecidos da lagarta.", "Organismo heterótrofo de primeira ordem, pois se alimenta de pólen na fase adulta.", "Organismo heterótrofo de segunda ordem, pois apresenta o maior nível energético na cadeia.", "Decompositor, pois se alimenta de tecidos do interior do corpo da lagarta e a leva à morte."], "af": [null, null, null, null, null]}, {"y": 2019, "i": 133, "d": "ciencias-natureza", "c": "O “The Kidney Project” é um projeto realizado por cientistas que pretendem desenvolver um rim biônico que executará a maioria das funções biológicas do órgão. O rim biônico possuirá duas partes que incorporam recentes avanços de nanotecnologia, filtração de membrana e biologia celular. Esse projeto significará uma grande melhoria na qualidade de v const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(t){
  t=esc(t.replace(/\r/g,"")).replace(/\\([.\-*_()\[\]])/g,"$1");
  t=t.replace(/!\[[^\]]*\]\(([^)\s]+)\)/g,(m,u)=>`\n\n@@IMG${u}@@\n\n`);
  t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,"$1");
  t=t.replace(/\*\*\s*([^*]+?)\s*\*\*/g,"<b>$1</b>").replace(/(^|[^\w])_([^_\n]+)_(?=[^\w]|$)/g,"$1<i>$2</i>").replace(/(\d)_([a-z])_/g,"$1<i>$2</i>");
  return t.split(/\n\s*\n/).map(p=>{p=p.trim();if(!p)return"";
    const im=p.match(/^@@IMG(.+)@@$/);if(im)return `<div class="fig"><img src="${im[1]}" alt="Figura da questão" loading="lazy" onclick="zoom(this.src)"><span>🔍 toque para ampliar</span></div>`;
    p=p.replace(/^\*\s+/gm,"• ").replace(/ {2,}\n/g,"<br>").replace(/\n/g,"<br>");
    const f=/(Disponível em|Acesso em|\(adaptado\)|\(fragmento\)|^[A-ZÁÉÍÓÚ]+,\s[A-Z])/.test(p)&&p.length<260;
    return `<p${f?' class="fonte"':''}>${p}</p>`}).join("");
}
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+"h":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

  <p style="font-size:12.5px;color:#94a3b8;text-align:center;margin:10px 0 0">Vai abrir o WhatsApp com o resultado e todas as respostas prontas para enviar.</p></div>
  <div class="card rev"><h3 style="margin:0 0 6px">Correção questão por questão</h3><p style="font-size:13px;color:#94a3b8;margin:0 0 6px">Toque numa questão para ver a correção.</p>`+
  Q.map((q,i)=>{const ok=S.resp[i]===gab(i);return `<div class="item" onclick="ir(${i})"><span>${ok?"✅":"❌"} ${i+1}. ${AREAS[q.d]} <span class="origem">· ENEM ${q.y}</span></span><span>Sua: <b>${S.resp[i]||"–"}</b> · Gab: <b>${gab(i)}</b></span></div>`}).join("")+`</div>
  <div class="autora">Elaborado por <b>Dra. Gleyce Santana</b></div>`;
  $("app").innerHTML=h;window.scrollTo(0,0);prog();
}
function whats(){
  const r=calc();
  let t=`📝 *SIMULADO ENEM – RESULTADO*\n👤 ${ALUNO}\n\n🎯 *Nota: ${nota10(r.tot)}* (de 0 a 10)\n✅ ${r.tot} acertos de ${Q.length} (${Math.round(r.tot/Q.length*100)}%)\n⏱ Tempo: ${fmt(tempo())}\n\n*Por área:*\n`;
  Object.keys(AREAS).forEach(k=>t+=`• ${AREAS[k]}: ${r.a[k][0]}/${r.a[k][1]}\n`);
  t+=`\n*Respostas marcadas:*\n`+Q.map((q,i)=>`${i+1}-${S.resp[i]||"_"}${S.resp[i]===gab(i)?"✓":"✗"}`).join("  ");
  t+=`\n\n_Simulado elaborado por Dra. Gleyce Santana_`;
  window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
}
S.fim?resultado():inicio();
</script>
