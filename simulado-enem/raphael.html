<script>
const ALUNO="Raphael Brander", ALUNO_CURTO="Raphael", KEY="simulado-enem-raphael-v1";
const Q=[{"y": 2017, "i": 15, "d": "linguagens", "c": "**Sítio Gerimum**\n\nEste é o meu lugar (…)\n\nMeu Gerimum é com g\n\nVocê pode ter estranhado\n\nGerimum em abundância\n\nAqui era plantado\n\nE com a letra g\n\nMeu lugar foi registrado.\n\nOLIVEIRA, H. D. **Língua Portuguesa,** n. 88, fev. 2013 (fragmento)", "intro": "Nos versos de um menino de 12 anos, o emprego da palavra “Gerimum”grafada com a letra “g” tem por objetivo", "a": ["Valorizar usos informais caracterizadores da norma nacional.", "Confirmar o uso da norma-padrão em contexto da linguagem poética.", "Enfatizar um processo recorrente na transformação da língua portuguesa.", "Registrar a diversidade étnica e linguística presente no território brasileiro.", "Reafirmar discursivamente a forte relação do falante com seu lugar de origem."]}, {"y": 2018, "i": 1, "d": "linguagens", "c": "**Lava Mae: Creating Showers on Wheels for the Homeless**\n\nSan Francisco, according to recent city numbers, has 4,300 people living on the streets. Among the many problems the homeless face is little or no access to showers.  San Francisco only has about 16 to 20 shower stalls to accommodate them. But Doniece Sandoval has made it her mission to change that. The 51 -year-old former marketing executive started Lava Mae, a sort of showers on wheels, a new  \nproject that aims to turn decommissioned city buses into shower stations for the homeless. Each bus will have two shower stations and Sandoval expects that they’ll be able to provide 2,000 showers a week.\n\nANDREANO, C. Disponível em: http://abcnews.go. Acesso em: 26 jun, 2018 (adaptado)", "intro": "A relação dos vocábulos shower, bus e homeless, no texto, refere-se a", "a": ["Empregar moradores de rua em lava a jatos para ônibus.", "Criar acesso a banhos gratuitos para moradores de rua.", "Comissionar sem-teto para dirigir os ônibus da cidade.", "Exigir das autoridades que os ônibus municipais tenham banheiros.", "Abrigar dois mil moradores de rua em ônibus que foram adaptados."]}, {"y": 2014, "i": 116, "d": "linguagens", "c": "**Linotipos**\n\nO Museu da Imprensa exibe duas linotipos. Trata-se de um tipo de máquina de composição de tipos de chumbo, inventada em 1884 em Baltimore, nos Estados Unidos, pelo alemão Ottmar Mergenthaler. O invento foi de grande importância por ter significado um novo e fundamental avanço na história das artes gráficas. A linotipia provocou, na verdade, uma revolução porque venceu a lentidão da composição dos textos executada na tipografia tradicional, em que o texto era composto à mão, juntando tipos móveis um por um. Constituía-se, assim, no principal meio de composição tipográfica até 1950. A linotipo, a partir do século XIX, passou a produzir impressos a baixo custo, o que levou informação às massas, democratizou a informação. Promoveu uma revolução na educação. Antes da linotipo, os jornais e revistas eram escassos, com poucas páginas e caros. Os livros didáticos eram também caros, pouco acessíveis.\n\nDisponível em: http://portal.in.gov.br. Acesso em: 23 fev. 2013 (adaptado).\n\nO texto apresenta um histórico da linotipo, uma máquina tipográfica inventada no século XIX e responsável pela dinamização da imprensa.", "intro": "Em termos sociais, a contribuição da linotipo teve impacto direto na", "a": ["Produção vagarosa de materiais didáticos.", "Composição aprimorada de tipos de chumbo.", "Montagem acelerada de textos para impressão.", "Produção acessível de materiais informacionais.", "Impressão dinamizada de imagens em revistas."]}, {"y": 2023, "i": 25, "d": "linguagens", "c": "Passado muito tempo, resolvi tentar falar, porque estava sozinha me embrenhando na mesma vereda que Donana costumava entrar. Ainda recordo da palavra que escolhi: arado. Me deleitava vendo meu pai conduzindo o arado velho da fazenda carregado pelo boi, rasgando a terra para depois lançar grãos de arroz em torrões marrons e vermelhos revolvidos. Gostava do som redondo fácil e ruidoso que tinha ao ser enunciado. “Vou trabalhar no arado.” “Vou arar a terra.” “Seria bom ter um arado novo, esse arado tá troncho e velho.” O som que deixou minha boca era uma aberração, uma desordem, como se no lugar do pedaço perdido da língua tivesse um ovo quente. Era um arado torto, deformado, que penetrava a terra de tal forma a deixá-la infértil, destruída, dilacerada.\n\nVIEIRA JR.. I. **Torto arado**. São Paulo: Todavia, 2019.", "intro": "Com a perda de parte da língua na infância, a narradora tenta voltar a falar. Essa tentativa revela uma experiência que", "a": ["Reflete o olhar do pai sobre as etapas do plantio.", "Metaforiza a linguagem como ferramenta de lavoura.", "Explicita, na busca pela palavra, o medo da solidão.", "Confirma a frustração da narradora com relação à terra.", "Sugere, na ausência da linguagem, a estagnação do tempo."]}, {"y": 2015, "i": 107, "d": "linguagens", "c": "**A pátria**\n\nAma, com fé e orgulho, a terra em que nasceste!  \nCriança! não verás nenhum pais como este!  \nOlha que céu! que mar! que rios! que floresta!  \nA Natureza, aqui, perpetuamente em festa,  \nÉ um seio de mãe a transbordar carinhos.  \nVê que vida há no chão! vê que vida há nos ninhos,  \nQue se balançam no ar, entre os ramos inquietos!  \nVê que luz, que calor, que multidão de insetos!  \nVê que grande extensão de matas, onde impera,  \nFecunda e luminosa, a eterna primavera!  \nBoa terra! jamais negou a quem trabalha  \nO pão que mata a fome, o teto que agasalha…\n\nQuem com o seu suor a fecunda e umedece,  \nVê pago o seu esforço, e é feliz, e enriquece!\n\nCriança! não verás pais nenhum como este:  \nImita na grandeza a terra em que nasceste!\n\nBILAC, O. **Poesias infantis**. Rio de Janeiro: Francisco Alves, 1929.", "intro": "Publicado em 1904, o poema A pátria harmoniza-se com um projeto ideológico em construção na Primeira República. O discurso poético de Olavo Bilac ecoa esse projeto, na medida em que", "a": ["A paisagem natural ganha contornos surreais, como o projeto brasileiro de grandeza.", "A prosperidade individual, como a exuberância da terra, independe de políticas de governo.", "Os valores afetivos atribuídos à família devem ser aplicados também aos ícones nacionais.", "A capacidade produtiva da terra garante ao país a riqueza que se verifica naquele momento.", "A valorização do trabalhador passa a integrar o conceito de bem-estar social experimentado."]}, {"y": 2022, "i": 6, "d": "linguagens", "c": "**Urgência emocional**\n\nSe tudo é para ontem, se a vida engata uma primeira e sai em disparada, se não há mais tempo para paradas estratégicas, caímos fatalmente no vício de querer que os amores sejam igualmente resolvidos num átimo de segundo. Temos pressa para ouvir “eu te amo”. Não vemos a hora de que fiquem estabelecidas as regras de convívio: somos namorados, ficantes, casados, amantes? Urgência emocional. Uma cilada. Associamos diversas palavras ao AMOR: paixão, romance, sexo, adrenalina, palpitação. Esquecemos, no entanto, da palavra que viabiliza esse sentimento: “paciência”. Amor sem paciência não vinga. Amor não pode ser mastigado e engolido com emergência, com fome desesperada. É uma refeição que pode durar uma vida.\n\nMEDEIROS, M. Disponível em: http:/porumavidasimples.blogspot.com.br. Acesso em: 20 ago. 2017 (adaptado).", "intro": "Nesse texto de opinião, as marcas linguísticas revelam uma situação distensa e de pouca formalidade, o que se evidencia pelo(a)", "a": ["Impessoalização ao longo do texto, como em: “se não há mais tempo”.", "Construção de uma atmosfera de urgência, em palavras como: “pressa”.", "Repetição de uma determinada estrutura sintática, como em: “Se tudo é para ontem”.", "Ênfase no emprego da hipérbole, como em: “uma refeição que pode durar uma vida”.", "Emprego de metáforas, como em: “a vida engata uma primeira e sai em disparada”."]}, {"y": 2019, "i": 1, "d": "linguagens", "c": "**5 Ways Pets Can Improve Your Health**\n\nA pet is certainly a great friend. After a difficult day, pet owners quite literally feel the love. In fact, for nearly 25 years, research has shown that living with pets provides certain health benefits. Pets help lower blood pressure and lessen anxiety. They boost our immunity. They can even help you get dates.\n\n**Allergy Fighters:** A growing number of studies have suggested that kids growing up in a home with “furred animals” will have less risk of allergies and asthma.\n\n**Date Magnets:** Dogs are great for making love connections. Forget Internet matchmaking — a dog is a natural conversation starter.\n\n**Dogs for the Aged:** Walking a dog or just caring for a pet — for elderly people who are able — can provide exercise and companionship.\n\n**Good for Mind and Soul:** Like any enjoyable activity, playing with a dog can elevate levels of serotonin and dopamine — nerve transmitters that are known to have pleasurable and calming properties.\n\n**Good for the Heart:** Heart attack patients who have pets survive longer than those without, according to several studies.\n\n**DAVIS, J. L.** Disponível em: www.webmd.com. Acesso em: 21 abr. 2013 (adaptado).", "intro": "Ao discutir sobre a influência de animais de estimação no bem-estar do ser humano, a autora, a fim de fortalecer\nseus argumentos, utiliza palavras e expressões como research, a growing number of research e several studies com o objetivo de", "a": ["Mostrar que animais de estimação ajudam na cura de doenças como alergias e asma.", "Convencer sobre os benefícios da adoção de animais de estimação para a saúde.", "Fornecer dados sobre os impactos de animais de estimação nas relações amorosas.", "Explicar como o contato com animais de estimação pode prevenir ataques cardíacos.", "Esclarecer sobre o modo como idosos devem se relacionar com animais de estimação."]}, {"y": 2020, "i": 9, "d": "linguagens", "c": "É possível afirmar que muitas expressões idiomáticas transmitidas pela cultura regional possuem autores anônimos, no entanto, algumas delas surgiram em consequência de contextos históricos bem curiosos. “Aquele é um cabra da peste” é um bom exemplo dessas construções.\n\nPara compreender essa expressão tão repetida no Nordeste brasileiro, faz-se necessário voltar o olhar para o século 16. “Cabra” remete à forma com que os navegadores portugueses chamavam os índios. Já “peste” estaria ligada à questão da superação e resistência, ou mesmo uma associação com o diabo. Assim, com o passar dos anos, passou-se a utilizar tal expressão para denominar qualquer indivíduo que se mostre corajoso, ou mesmo insolente, já que a expressão pode ter caráter positivo ou negativo. Aliás, quem já não ficou de “nhenhe-nhém” por aí? O termo, que normalmente tem significado de conversa interminável, monótona ou resmungo, tem origem no tupi-guarani e “nhém” significa “falar”.\n\nDisponível em: http:///leiturasdahistoria.uol.com.br. Acesso em: 13 dez. 2017", "intro": "A leitura do texto permite ao leitor entrar em contato com", "a": ["Registros do inventário do português brasileiro.", "Justificativas da variedade linguística do país.", "Influências da fala do nordestino no uso da língua.", "Explorações do falar de um grupo social específico.", "Representações da mudança linguística do português."]}, {"y": 2021, "i": 26, "d": "linguagens", "c": "Os velhos papéis, quando não são consumidos pelo fogo, às vezes acordam de seu sono para contar notícias do passado.  \nÉ assim que se descobre algo novo de um nome antigo, sobre o qual já se julgava saber tudo, como Machado de Assis.  \nPor exemplo, você provavelmente não sabe que o autor carioca, morto em 1908, escreveu uma letra do hino nacional em 1867 — e não poderia saber mesmo, porque os versos seguiam inéditos. Até hoje.  \nEssa letra acaba de ser descoberta, em um jornal antigo de Florianópolis, pelo pesquisador independente Felipe Rissato.  \n“Das florestas em que habito/ Solto um canto varonil:/ Em honra e glória de Pedro/ O gigante do Brasil”, diz o começo do hino, composto de sete estrofes em redondilhas maiores, ou seja, versos de sete sílabas poéticas. O trecho também é o refrão da música.  \nO Pedro mencionado é o imperador Dom Pedro II. O bruxo do Cosme Velho compôs a letra para o aniversário de 42 anos do monarca, em 2 de dezembro daquele ano — o hino seria apresentado naquele dia no teatro da cidade de Desterro, antigo nome de Florianópolis.\n\n**Disponível em: www.revistaprosaversoarte.com. Acesso em 4 dez. 2018 (adaptado).**", "intro": "Considerando-se as operações de retomada de informações do texto, há interdependência entre as expressões", "a": ["\"Os velho papéis\" e \"É assim\".", "\"algo novo\" e \"sobre o qual.\"", "\"um nome antiga\" e \"Por exemplo.\"", "\"O gigante do Brasil\" e \"O Pedro mencionado.\"", "\"o imperador Dom Pedro II\" e \"O bruxo do Cosme Velho\"."]}, {"y": 2016, "i": 99, "d": "linguagens", "c": "PINHÃO _Sai ao mesmo tempo que_ BENONA _entra._\n\nBENONA: Eurico, Eudoro Vicente está lá fora e quer falar com você.\n\nEURICÃO: Benona, minha irmã, eu sei que ele está lá fora, mas não quero falar com ele.\n\nBENONA: Mas Eurico, nós lhe devemos certas atenções.\n\nEURICÃO: Você, que foi noiva dele. Eu, não!\n\nBENONA: Isso são coisas passadas.\n\nEURICÃO: Passadas para você, mas o prejuízo foi meu. Esperava que Eudoro, com todo aquele dinheiro, se tornasse meu cunhado. Era uma boca a menos e um patrimônio a mais. E o peste me traiu. Agora, parece que ouviu dizer que eu tenho um tesouro. E vem louco atrás dele, sedento, atacado de verdadeira hidrofobia. Vive farejando ouro, como um cachorro da molest’a, como um urubu, atrás do sangue dos outros. Mas ele está enganado. Santo Antônio há de proteger minha pobreza e minha devoção.\n\nSUASSUNA, A. **O santo e a porca**, Rio de Janeiro: José Olympio, 2013 (fragmento)", "intro": "Nesse texto teatral, o emprego das expressões “o peste” e “cachorro da molest’a” contribui para", "a": ["Marcar a classe social das personagens.", "Caracterizar usos linguísticos de uma região.", "Enfatizar a relação familiar entre as personagens.", "Sinalizar a influência do gênero nas escolhas vocabulares.", "Demonstrar o tom autoritário da fala de uma das personagens."]}, {"y": 2022, "i": 50, "d": "ciencias-humanas", "c": "Na construção da ferrovia Madeira-Marmoré, o que dizer dos doentes, eternos moribundos a vagar entre delírios fabris, doses de quinino e corredores da morte? O Hospital da Candelária era santuário e túmulo, monumento ao progresso científico e preâmbulo da escuridão. Foi ali, com suas instalações moderníssimas, que médicos e sanitaristas dirigiram seu combate aos males tropicais. As maiores vitimas, contudo, permaneceriam na sombra a margem do palco, cobaias sem consolo, credores sem nome de uma sociedade que  não lhes concedera tempo algum para ser decifrada.\n\nFOOT HARDWAN, F. Trem fantasma: modernidade na selva\n\nSão Paulo: Cia das letras,1968 adaptado", "intro": "No texto, há uma crítica ao modo de ocupação do espaço amazônico pautada na", "a": ["Discrepância entre engenharia ambiental e equilíbrio da fauna", "Incoerência entre maquinaria estrangeira e controle da floresta", "Incompatibilidade entre investimento estatal e proteção aos nativos", "Competição entre farmacologia internacional e produtos de fitoterapia", "Contradição entre desenvolvimento nacional e respeito aos trabalhadores"]}, {"y": 2021, "i": 48, "d": "ciencias-humanas", "c": "Atualmente, o Programa de Melhoramento “Uvas do Brasil” utiliza métodos clássicos de melhoramento, como seleção massal, seleção clonal e hibridações. Ações de ajuste de manejo de seleções avançadas vêm sendo desenvolvidas paralelamente a Programa de Melhoramento, no sentido de viabilização desses materiais. Ao longo dos seus 40 anos, uma grande equipe técnica trabalhou para executar projetos de pesquisa para atender às necessidades e às demandas de diferentes atores da vitivinicultura nacional, incluindo produtores de uvas de mesa para exportação do semiárido nordestino, viticultores interessados em produzir sucos em regiões tropicais ou pequenos produtores familiares da região da Serra Gaúcha, interessados em melhorar a qualidade do vinho artesanal que produzem.\n\nPrograma de Melhoramento Genético “Uvas do Brasil”. Disponível em: www.embrapa.br.  \nAcesso em: 24 nov. 2018 (adaptado).", "intro": "Para melhorar a produção agrícola nas regiões mencionadas, as técnicas referidas no texto buscaram\nadaptar o cultivo aos(às)", "a": ["Espécies nativas ameaçadas.", "Cadeias econômicas autônomas.", "Estruturas fundiárias tradicionais.", "Elementos ambientais singulares.", "Mercados consumidores internos."]}, {"y": 2017, "i": 69, "d": "ciencias-humanas", "c": "A instalação de uma refinaria obedece a diversos fatores técnicos. Um dos mais importantes é a localização, que deve ser próxima tanto dos centros de consumo como das áreas de produção. A Petrobras possui refinarias estrategicamente distribuídas pelo país. Elas são responsáveis pelo processamento de milhões de barris de petróleo por dia, suprindo o mercado com derivados que podem ser obtidos a partir de petróleo nacional ou importado.\n\nMurta, Energia: o vício da civilização, crise energética e alternativas sustentáveis. Rio de Janeiro Caramond 2011", "intro": "A territorialização de uma unidade produtiva depende de diversos fatores locacionais. A partir da leitura do texto, o fator determinante para a instalação das refinarias de petróleo é a proximidade a", "a": ["Sedes de empresas petroquímicas.", "Zonas de importação de derivados", "Polos de desenvolvimento tecnológico.", "Áreas de aglomerações de mão de obra", "Espaços com infraestrutura de circulação"]}, {"y": 2020, "i": 86, "d": "ciencias-humanas", "c": "Declaração de Direitos do Homem e do Cidadão — 1789\n\nOs representantes do povo francês, tendo em vista que a ignorância, o esquecimento ou o desprezo dos direitos do homem são as únicas causas dos males públicos e da corrupção dos governos, resolveram declarar solenemente os direitos naturais, inalienáveis e sagrados do homem, a fim de que esta declaração, sempre presente em todos os membros do corpo social, lhes lembre permanentemente seus direitos e seus deveres; a fim de que as reivindicações dos cidadãos, fundados em princípios simples e incontestáveis, se dirijam sempre à conservação da Constituição e à felicidade geral.\n\nDisponível em: www.direitoshumanosusp.br. Acesso em: 7 jun. 2018 (adaptado).", "intro": "Esse documento, elaborado no contexto da Revolução Francesa, reflete uma profunda mudança social ao estabelecer a", "a": ["Manutenção das terras comunais.", "Supressão do poder constituinte.", "Falência da sociedade burguesa.", "Paridade do tratamento jurídico.", "Abolição dos partidos políticos."]}, {"y": 2019, "i": 84, "d": "ciencias-humanas", "c": "A Declaração Universal dos Direitos Humanos, adotada e proclamada pela Assembleia Geral da ONU na Resolução 217-A, de 10 de dezembro de 1948, foi um acontecimento histórico de grande relevância. Ao afirmar, pela primeira vez em escala planetária, o papel dos direitos humanos na convivência coletiva, pode ser considerada um evento inaugural de uma nova concepção de vida internacional.\n\n**LAFER, C. Declaração Universal dos Direitos Humanos (1948). In: MAGNOLI, D. (Org.) História da paz. São Paulo: Contexto, 2008.**", "intro": "A declaração citada no texto introduziu uma nova concepção nas relações internacionais ao possibilitar a", "a": ["Superação da soberania estatal.", "Defesa dos grupos vulneráveis.", "Redução da truculência belicista.", "Impunidade dos atos criminosos.", "Inibição dos choques civilizacionais."]}, {"y": 2016, "i": 18, "d": "ciencias-humanas", "c": "Segundo a Conferência de Quioto, os países centrais industrializados, responsáveis históricos pela poluição, deveriam alcançar a meta de redução de 5,2% do total de emissões segundo níveis de 1990. O nó da questão é o enorme custo desse processo, demandando mudanças radicais nas indústrias para que se adaptem rapidamente aos limites de emissão estabelecidos e adotem tecnologias energéticas limpas. A comercialização internacional de créditos de sequestro ou de redução de gases causadores do efeito estufa foi a solução encontrada para reduzir o custo global do processo. Países ou empresas que conseguirem reduzir as emissões abaixo de suas metas poderão vender este crédito para outro país ou empresa que não consiga.\n\nBECKER, B. **AMAZÔNIA: geopolítica na virada do II milênio**. Rio de Janeiro: Garamond, 2009.", "intro": "As posições contrárias à estratégia de compensação presente no texto relacionam-se à ideia de que ela promove", "a": ["Retração nos atuais níveis de consumo.", "Surgimento de conflitos de caráter diplomático.", "Diminuição dos lucros na produção de energia.", "Desigualdade na distribuição do impacto ecológico.", "Decréscimo dos Índices de desenvolvimento econômico."]}, {"y": 2018, "i": 47, "d": "ciencias-humanas", "c": "A existência em Jerusalém de um hospital voltado para o alojamento e o cuidado dos peregrinos, assim como daqueles entre eles que estavam cansados ou doentes, fortaleceu o elo entre a obra de assistência e de caridade e a Terra Santa. Ao fazer, em 1113, do Hospital de Jerusalém um estabelecimento central da  \nordem, Pascoal II estimulava a filiação dos hospitalários do Ocidente a ele, sobretudo daqueles que estavam ligados à peregrinação na Terra Santa ou em outro lugar. A militarização do Hospital de Jerusalém não diminuiu a vocação caritativa primitiva, mas a fortaleceu.\n\nDEMURGER, A. **Os Cavaleiros de Cristo**. Rio de Janeiro: Jorge Zahar, 2002 (adaptado).", "intro": "O acontecimento descrito vincula-se ao fenômeno ocidental do(a)", "a": ["Surgimento do monasticismo guerreiro, ocasionado pelas cruzadas.", "Descentralização do poder eclesiástico, produzida pelo feudalismo.", "Alastramento da peste bubônica, provocado pela expansão comercial.", "Afirmação da fraternidade mendicante, estimulada pela reforma espiritual.", "Criação das faculdades de medicina, promovida pelo renascimento urbano."]}, {"y": 2023, "i": 78, "d": "ciencias-humanas", "c": "Os movimentos da agricultura urbana no Rio de Janeiro vêm crescendo nos últimos vinte anos, tanto por meio de reproduções de modelos de vida antigos, vinculados ao resgate dos próprios costumes, como — e cada vez mais — são revelados hábitos inventivos nos quais moradores urbanos de diferentes classes sociais, sem nenhuma referência anterior com o campo, passam a se dedicar a essas atividades. Ao possibilitar o acesso ao plantio e, consequentemente, à alimentação, permite-se uma nova relação com o que se come, reduzindo o percurso da cadeia produtiva e aproximando produtores de consumidores, pois ambos se confundem nas experiências de agricultura urbana.\n\nPORTILHO, M.; RODRIGUES, C. G. O.; FERNANDEZ, A. C. F. Cultivando relações no arranjo local da Penha: a mobilização de mulheres a partir das práticas de agricultura urbana na favela. Cidades, Comunidades e Territórios, n. 42, jun. 2021.", "intro": "A prática agrícola destacada no texto apresenta como vantagem no espaço urbano a", "a": ["Ocupação de lugares ociosos.", "Densificação da área central.", "Valorização do mercado externo.", "Priorização de insumos químicos.", "Mecanização de técnicas de cultivo."]}, {"y": 2015, "i": 14, "d": "ciencias-humanas", "c": "Em sociedade de origens tão nitidamente personalistas como a nossa, é compreensível que os simples vínculos de pessoa a pessoa, independentes e até exclusivos de qualquer tendência para a cooperação autêntica entre os indivíduos, tenham sido quase sempre os mais decisivos. As agregações e relações pessoais, embora por vezes precárias, e, de outro lado, as lutas entre facções, entre famílias, entre regionalismos, faziam dela um todo incoerente e amorfo. O peculiar da vida brasileira parece ter sido por essa época, uma acentuação singularmente enérgica do afetivo, do irracional, do passional e uma estagnação ou antes uma atrofia correspondente das qualidades ordenadoras, disciplinadoras, racionalizadoras.\n\nHOLANDA, S. B. **Raízes do Brasil**. São Paulo: Cia das Letras, 1995.", "intro": "Um traço formador da vida pública brasileira expressa-se, segundo a análise do historiador, na", "a": ["Rigidez das normas jurídicas.", "Prevalência dos interesses privados.", "Solidez da organização institucional.", "Legitimidade das ações burocráticas.", "Estabilidade das estruturas políticas."]}, {"y": 2014, "i": 44, "d": "ciencias-humanas", "c": "Respeitar a diversidade de circunstâncias entre as pequenas sociedades locais que constituem uma mesma nacionalidade, tal deve ser a regra suprema das leis internas de cada Estado. As leis municipais seriam as cartas de cada povoação doadas pela assembleia provincial, alargadas conforme o seu desenvolvimento, alteradas segundo os conselhos da experiência. Então, administrar-se-ia de perto, governar-se-ia de longe, alvo a que jamais se atingirá de outra sorte.\n\nBASTOS, T. **A província** (1870). São Paulo: Cia, Editora Nacional, 1937 (adaptado).", "intro": "O discurso do autor, no período do Segundo Reinado no Brasil, tinha como meta a implantação do", "a": ["Regime monárquico representativo.", "Sistema educacional democrático.", "Modelo territorial federalista.", "Padrão político autoritário.", "Poder oligárquico regional."]}, {"y": 2023, "i": 106, "d": "ciencias-natureza", "c": "A tecnologia de vacinas de RNA mensageiro (RNAm) é investigada há anos. Avanços científicos em genética molecular permitiram desenvolver uma vacina para controle da pandemia da covid-19 causada pelo vírus de RNA SARS-CoV-2. A vacina de RNAm tem sequências de genes do vírus. Entretanto, por ser muito instável, o RNAm deve ser recoberto por uma capa de lipídios que evita sua degradação e favorece sua ação. Dessa forma, o RNAm desempenhará sua função especifica atuando no mesmo compartimento celular de sempre.\n\nDisponível em: https://sbim.org.br. Acesso em: 29 nov. 2021 (adaptado).", "intro": "A imunização produzida por esse tipo de vacina é alcançada por meio da", "a": ["Estimulação de leucócitos induzida pela capa lipídica contendo RNAm.", "Atuação do RNAm como sequestrador do vírus para o meio extracelular.", "Tradução do RNAm em proteína viral, desencadeando a resposta antigênica.", "Competição entre o RNAm vacinal e o RNA viral pelos sítios dos ribossomos.", "Incorporação do RNAm viral ao genoma do hospedeiro. gerando novo fenótipo."]}, {"y": 2017, "i": 97, "d": "ciencias-natureza", "c": "Um fato corriqueiro ao se cozinhar arroz é o derramamento de parte da água de cozimento sobre a chama azul do fogo, mudando-a para uma chama amarela. Essa mudança de cor pode suscitar interpretações diversas, relacionadas às substâncias presentes na água de cozimento. Além do sal de cozinha (NaCl), nela se encontram carboidratos, proteínas e sais minerais.", "intro": "Cientificamente, sabe-se que essa mudança de cor da chama ocorre pela", "a": ["Reação do gás de cozinha com o sal, volatilizando gás cloro.", "Emissão de fótons pelo sódio, excitado por causa da chama.", "Produção de derivado amarelo, pela reação com o carboidrato.", "Reação do gás de cozinha com a água, formando gás hidrogênio.", "Excitação das moléculas de proteínas, com formação de luz amarela."]}, {"y": 2016, "i": 71, "d": "ciencias-natureza", "c": "A vegetação apresenta adaptações ao ambiente, como plantas arbóreas e arbustivas com raízes que se expandem horizontalmente, permitindo forte ancoragem no substrato lamacento; raízes que se expandem verticalmente, por causa da baixa oxigenação do substrato; folhas que têm glândulas para eliminar o excesso de sais; folhas que podem apresentar cutícula espessa para reduzir a perda de água por evaporação.", "intro": "As características descritas referem-se a plantas adaptadas ao bioma:", "a": ["Cerrado.", "Pampas.", "Pantanal.", "Manguezal.", "Mata de Cocais."]}, {"y": 2014, "i": 78, "d": "ciencias-natureza", "c": "Com o objetivo de substituir as sacolas de polietileno, alguns supermercados têm utilizado um novo tipo de plástico ecológico, que apresenta em sua composição amido de milho e uma resina polimérica termoplástica, obtida a partir de uma fonte petroquímica.\n\nERENO, D. Plásticos de vegetais. **Pesquisa Fapesp**, n. 179, jan. 2011 (adaptado).", "intro": "Nesses plásticos, a fragmentação da resina polimérica é facilitada porque os carboidratos presentes", "a": ["Dissolvem-se na água.", "Absorvem água com facilidade.", "Caramelizam por aquecimento e quebram.", "São digeridos por organismos decompositores.", "Decompõem-se espontaneamente em contato com água e gás carbônico."]}, {"y": 2022, "i": 110, "d": "ciencias-natureza", "c": "Desde a proposição da teoria de seleção natural  \npor Darwin, os seres vivos nunca mais foram olhados  \nda mesma forma. No que diz respeito à reprodução de  \nanfíbios anuros, os cientistas já descreveram diferentes  \npadrões reprodutivos, como os exemplificados a seguir:  \nEspécie 1 – As fêmeas produzem cerca de  \n5 000 gametas, que são fecundados na água, em  \nlagoas temporárias de estação chuvosa. Todo o  \ndesenvolvimento embrionário, do ovo à metamorfose,  \nocorre, nesse ambiente, independente dos pais.  \nEspécie 2 – As fêmeas produzem aproximadamente  \n200 gametas, que são depositados em poças próximas a  \ncorpos-d’água. Os embriões são vigiados pelos machos  \ndurante boa parte do seu desenvolvimento.  \nEspécie 3 – As fêmeas produzem por volta de  \n20 gametas, que são fecundados sobre a superfície das  \nfolhas de plantas cujos galhos estão dispostos acima da  \nsuperfície de corpos-d’água e aí se desenvolvem até  \na eclosão.  \nEspécie 4 – As fêmeas produzem poucos gametas  \nque, quando fecundados, são “abocanhados” pelos  \nmachos. Os embriões se desenvolvem no interior do  \nsaco vocal do macho até a metamorfose, quando saem  \natravés da boca do pai.", "intro": "Os padrões descritos evidenciam que", "a": ["As fêmeas influenciam o comportamento dos machos.", "O cuidado parental é necessário para o desenvolvimento", "O grau de evolução determina o comportamento reprodutivo.", "O sucesso reprodutivo pode ser garantido por estratégias diferentes.", "O ambiente induz modificação na produção do número de gametas femininos."]}, {"y": 2018, "i": 101, "d": "ciencias-natureza", "c": "O deserto é um bioma que se localiza em regiões de pouca umidade. A fauna é, predominantemente, composta por animais roedores, aves, répteis e artrópodes.", "intro": "Uma adaptação, associada a esse bioma, presente nos seres vivos dos grupos citados é o(a)", "a": ["Existência de numerosas glândulas sudoríparas na epiderme.", "Eliminação de excretas nitrogenadas de forma concentrada.", "Desenvolvimento do embrião no interior de ovo com casca.", "Capacidade de controlar a temperatura corporal.", "Respiração realizada por pulmões foliáceos."]}, {"y": 2015, "i": 51, "d": "ciencias-natureza", "c": "Um grupo de pesquisadores desenvolveu um método simples, barato e eficaz de remoção de petróleo contaminante na água, que utiliza um plástico produzido a partir do líquido da castanha-de-caju (LCC). A composição química do LCC é muito parecida com a do petróleo e suas moléculas, por suas características, interagem formando agregados com o petróleo. Para retirar os agregados da água, os pesquisadores misturam ao LCC nanopartículas magnéticas.\n\nKIFFER, D. **Novo método para remoção de petróleo usa óleo de mamona e castanha-de-caju**. Disponível em: www.faperj.br. Acesso em: 31 jul. 2012 (adaptado).", "intro": "Essa técnica considera dois processos de separação de misturas, sendo eles, respectivamente,", "a": ["Flotação e decantação.", "Decomposição e centrifugação.", "Floculação e separação magnética.", "Destilação fracionada e peneiração.", "Dissolução fracionada e magnetização."]}, {"y": 2019, "i": 101, "d": "ciencias-natureza", "c": "A eritropoetina (EPO) é um hormônio endógeno secretado pelos rins que influencia a maturação dos eritrócitos. Suas formas recombinantes, sintetizadas em laboratório, têm sido usadas por alguns atletas em esportes de resistência na busca por melhores resultados. No entanto, a administração da EPO recombinante no esporte foi proibida pelo Comitê Olímpico Internacional e seu uso considerado _doping_.\n\nMARTELLI, A. Eritropoetina: síntese e liberação fisiológica e o uso de sua forma recombinante no esporte. **Perspectivas Online**: biológicas & saúde, v. 10, n. 3, 2013 (adaptado).", "intro": "Uma influência que esse doping poderá exercer na melhoria da capacidade física desses atletas está relacionada ao transporte de", "a": ["Lipídios, para aumento do gasto calórico.", "ATP, para aumento da síntese hormonal.", "Oxigênio, para aumento da produção de ATP.", "Proteínas, para aumento da massa muscular.", "Vitamina C, para aumento da integridade dos vasos sanguíneos."]}, {"y": 2021, "i": 98, "d": "ciencias-natureza", "c": "Durante o desenvolvimento embrionário humano ocorre uma comunicação entre os átrios direito e esquerdo através do forame oval (ou forame de Botal). Essa comunicação não causa prejuízos à circulação do bebê em formação, exceto se ela perdurar após o nascimento.", "intro": "Os prejuízos no período embrionário são evitados porque a circulação fetal se assemelha à dos (as)", "a": ["Aves, porque a pequena circulação e a grande circulação estão presentes.", "Répteis, porque a mistura de sangue é minimizada por um metabolismo lento.", "Crocodilianos, porque a separação dos ventrículos impede a mistura sanguínea.", "Peixes, porque a circulação é simples, ocorrendo uma passagem única pelo coração.", "Anfíbios, porque pressões diferenciais isolam temporalmente o sangue venoso do arterial."]}, {"y": 2020, "i": 92, "d": "ciencias-natureza", "c": "A enorme quantidade de resíduos gerados pelo consumo crescente da sociedade traz para a humanidade uma preocupação socioambiental, em especial pela quantidade de lixo produzido. Além da reciclagem e do reúso, pode-se melhorar ainda mais a qualidade de vida, substituindo polímeros convencionais por polímeros biodegradáveis.", "intro": "Esses polímeros têm grandes vantagens socioambientais em relação aos convencionais porque", "a": ["Não são tóxicos.", "Não precisam ser reciclados.", "Não causam poluição ambiental quando descartados.", "São degradados em um tempo bastante menor que os convencionais.", "Apresentam propriedades mecânicas semelhantes aos convencionais."]}, {"y": 2023, "i": 128, "d": "matematica", "c": "É comum em viagens de avião sermos solicitados a desligar aparelhos cujo funcionamento envolva a emissão ou a recepção de ondas eletromagnéticas, como celulares. A justificativa dada para esse procedimento é, entre outras coisas, a necessidade de eliminar fontes de sinais eletromagnéticos que possam interferir nas comunicações, via rádio, dos pilotos com a torre de controle.", "intro": "Essa interferência poderá ocorrer somente se as ondas emitidas pelo celular e as recebidas pelo rádio do avião", "a": ["Forem ambas audíveis.", "Tiverem a mesma potência.", "Tiverem a mesma frequência.", "Tiverem a mesma intensidade.", "Propagarem-se com velocidades diferentes."]}, {"y": 2015, "i": 159, "d": "matematica", "c": "Segundo dados apurados no Censo 2010, para uma população de 101,8 milhões de brasileiros com 10 anos ou mais de idade e que teve algum tipo de rendimento em 2010, a renda média mensal apurada foi de R$ 1 202,00. A soma dos rendimentos mensais dos 10% mais pobres correspondeu a apenas 1,1% do total de rendimentos dessa população considerada, enquanto que a soma dos rendimentos mensais dos 10% mais ricos correspondeu a 44,5% desse total.\n\nDisponível em: www.estadao.com.br. Acesso em: 16 nov. 2011(adaptado).", "intro": "Qual foi a diferença, em reais, entre a renda média mensal de um brasileiro que estava na faixa dos 10% mais ricos e de um brasileiro que estava na faixa dos 10% mais pobres?", "a": ["240,40", "548,11", "1 723,67", "4 026,70", "5 216,68"]}, {"y": 2016, "i": 177, "d": "matematica", "c": "O LIRAa, Levantamento Rápido do Índice de Infestação por Aedes aegypti, consiste num mapeamento da infestação do mosquito Aedes aegypti. O LIRAa é dado pelo percentual do número de imóveis com focos do mosquito, entre os escolhidos de uma região em avaliação.\n\nO serviço de vigilância sanitária de um município, no mês de outubro do ano corrente, analisou o LIRAa de cinco bairros que apresentaram o maior índice de infestação no ano anterior. Os dados obtidos para cada bairro foram:\n\nI. 14 imóveis com focos de mosquito em 400 imóveis no bairro;  \nII. 6 imóveis com focos de mosquito em 500 imóveis no bairro;  \nIII. 13 imóveis com focos de mosquito em 520 imóveis no bairro;  \nIV. 9 imóveis com focos de mosquito em 360 imóveis no bairro;  \nV. 15 imóveis com focos de mosquito em 500 imóveis no bairro.\n\nDisponível em: http://bvsms.saude.gov.br. Acesso em: 28 out. 2015", "intro": "As ações de controle iniciarão pelo bairro", "a": ["I", "II", "III", "IV", "V"]}, {"y": 2014, "i": 168, "d": "matematica", "c": "O Brasil é um país com uma vantagem econômica clara no terreno dos recursos naturais, dispondo de uma das maiores áreas com vocação agrícola do mundo. Especialistas calculam que, dos 853 milhões de hectares do país, as cidades, as reservas indígenas e as áreas de preservação, incluindo florestas e mananciais, cubram por volta de 470 milhões de hectares. Aproximadamente 280 milhões se destinam à agropecuária, 200 milhões para pastagens e 80 milhões para a agricultura, somadas as lavouras anuais e as perenes, como o café e a fruticultura.\n\nFORTES, G. Recuperação de pastagens é alternativa para ampliar cultivos. **Folha de S. Paulo**, 30 out. 2011.", "intro": "De acordo com os dados apresentados, o percentual correspondente à área utilizada para agricultura em relação à área do território brasileiro é mais próximo de", "a": ["32,8%", "28,6%", "10,7%", "9,4%", "8,0%"]}, {"y": 2022, "i": 174, "d": "matematica", "c": "Peças metálicas de aeronaves abandonadas em aeroportos serão recicladas. Uma dessas peças é maciça e tem o formato cilíndrico, com a medida do raio da base igual a 4 cm e a da altura igual a 50 cm. Ela será derretida, e o volume de metal resultante será utilizado para a fabricação de esferas maciças com diâmetro de 1 cm, a serem usadas para confeccionar rolamentos. Para estimar a quantidade de esferas que poderão ser produzidas a partir de cada uma das peças cilíndricas, admite-se que não ocorre perda de material durante o processo de derretimento.", "intro": "Quantas dessas esferas poderão ser obtidas a partir de cada peça cilíndrica?", "a": ["800", "1200", "2400", "4800", "6400"]}, {"y": 2018, "i": 161, "d": "matematica", "c": "Para apagar os focos A e B de um incêndio, que estavam a uma distância de 30m um do outro, os bombeiros de um quartel decidiram se posicionar de modo que a distância de um bombeiro ao foco A, de temperatura mais elevada, fosse sempre o dobro da distância desse bombeiro ao foco B, de temperatura menos elevada.", "intro": "Nestas condições, a maior distância, em metro, que dois bombeiros poderiam ter entre eles é", "a": ["30.", "40.", "45.", "60.", "68."]}, {"y": 2021, "i": 180, "d": "matematica", "c": "Os diretores de uma escola precisam construir um laboratório para uso dos alunos. Há duas possibilidades:\n\n(i) um laboratório do tipo A, com capacidade para 100 usuário, a um custo de 180 mil reais e gastos de 60 mil reais por ano para manutenção;\n\n(ii) um laboratório do tipo B, com capacidade para 80 usuários, a um custo de 120 mil reais e gastos com manutenção de 16 mil reais por ano.\n\nConsidera-se que, em qualquer caso, o laboratório implantado será utilizado na totalidade de sua capacidade.", "intro": "A economia da escola, na utilização de um laboratório tipo B, em vez de um laboratório tipo A, num período de 4 anos, por usuário, será de", "a": ["1,31 mil reais", "1,90 mil reais", "2,30 mil reais", "2,36 mil reais", "2,95 mil reais"]}, {"y": 2019, "i": 173, "d": "matematica", "c": "Em um determinado ano, os computadores da receita federal de um país identificaram como inconsistentes 20% das declarações de imposto de renda que lhe foram encaminhadas.  \nUma declaração é classificada como inconsistente quando apresenta algum tipo de erro ou conflito nas informações prestadas. Essas declarações consideradas inconsistentes foram analisadas pelos auditores, que constataram que 25% delas eram fraudulentas.\n\nConstatou-se, ainda, que, dentre as declarações que não apresentaram inconsistências, 6,25% eram fraudulentas.", "intro": "Qual é a probabilidade de, nesse ano, a declaração de um contribuinte ser considerada inconsistente, dado que ela era fraudulenta?", "a": ["0,0500", "0,1000", "0,1125", "0,3125", "0,5000"]}, {"y": 2020, "i": 169, "d": "matematica", "c": "Um grupo sanguíneo, ou tipo sanguíneo, baseia-se na presença ou ausência de dois antígenos, A e B, na superfície das células vermelhas do sangue. Como dois antígenos estão envolvidos, os quatro tipos sanguíneos distintos são:\n\n*   Tipo A: apenas o antígeno A está presente;\n*   Tipo B: apenas o antígeno B está presente;\n*   Tipo AB: ambos os antígenos estão presentes;\n*   Tipo O: nenhum dos antígenos está presente.\n\nDisponível em: http://saude.hsw.uol.com.br. Acesso em: 15 abr. 2012 (adaptado).\n\nForam coletadas amostras de sangue de 200 pessoas e, após análise laboratorial, foi identificado que em 100 amostras está presente o antígeno A, em 110 amostras há presença do antígeno B e em 20 amostras nenhum dos antígenos está presente.", "intro": "Dessas pessoas que foram submetidas à coleta de sangue, o número das que possuem o tipo sanguíneo A é igual a", "a": ["30.", "60.", "70.", "90.", "100."]}, {"y": 2017, "i": 144, "d": "matematica", "c": "Uma empresa especializada em conservação de piscinas utiliza um produto para tratamento da água cujas especificações técnicas sugerem que seja adicionado 1,5 mL desse produto para cada 1 000 L de água da piscina. Essa empresa foi contratada para cuidar de uma piscina de base retangular, de profundidade constante igual a 1,7 m, com largura e comprimento iguais a 3 m e 5 m, respectivamente. O nível da lâmina d’água dessa piscina é mantido a 50 cm da borda da piscina.", "intro": "A quantidade desse produto, em mililitro, que deve ser adicionada a essa piscina de modo a atender às suas especificações técnicas é", "a": ["11,25.", "27,00.", "28,80.", "32,25.", "49,50."]}];
const G=[4, 3, 2, 2, 4, 4, 3, 4, 4, 4, 4, 0, 3, 4, 4, 3, 2, 4, 2, 0, 2, 3, 2, 4, 1, 1, 4, 1, 4, 1, 2, 1, 4, 4, 1, 1, 3, 3, 3, 4];
const AREAS={"linguagens":"Linguagens","ciencias-humanas":"Ciências Humanas","ciencias-natureza":"Ciências da Natureza","matematica":"Matemática"};
const gab=i=>"ABCDE"[(G[i]-(i*7)%5+50)%5];
let S={resp:Array(Q.length).fill(null),cur:0,ini:null,fim:null};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.resp&&x.resp.length===Q.length)S=x}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(t){
  t=esc(t.replace(/\r/g,"")).replace(/\\([.\-*_()\[\]])/g,"$1");
  t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,"$1");
  t=t.replace(/\*\*\s*([^*]+?)\s*\*\*/g,"<b>$1</b>").replace(/(^|[^\w])_([^_\n]+)_(?=[^\w]|$)/g,"$1<i>$2</i>").replace(/(\d)_([a-z])_/g,"$1<i>$2</i>");
  return t.split(/\n\s*\n/).map(p=>{p=p.trim();if(!p)return"";
    p=p.replace(/^\*\s+/gm,"• ").replace(/ {2,}\n/g,"<br>").replace(/\n/g,"<br>");
    const f=/(Disponível em|Acesso em|\(adaptado\)|\(fragmento\)|^[A-ZÁÉÍÓÚ]+,\s[A-Z])/.test(p)&&p.length<260;
    return `<p${f?' class="fonte"':''}>${p}</p>`}).join("");
}
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+"h":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
const tempo=()=>S.ini?((S.fim||Date.now())-S.ini)/1000:0;
setInterval(()=>{$("timer").textContent="⏱ "+fmt(tempo())},1000);
const respondidas=()=>S.resp.filter(Boolean).length;
function prog(){$("prog").style.width=(respondidas()/Q.length*100)+"%";$("sub").textContent=S.fim?"Simulado finalizado":`${respondidas()} de ${Q.length} respondidas`}

function inicio(){
  $("nav").classList.add("hidden");
  $("app").innerHTML=`<div class="card hero"><div class="emoji">📝</div>
  <h2>Olá, ${ALUNO_CURTO}!</h2><p>Simulado especial com questões reais das provas do ENEM de 2014 a 2023.</p>
  <div class="info"><div><b>40</b>questões</div><div><b>4</b>áreas</div><div><b>10</b>provas misturadas</div><div><b>~2h</b>tempo sugerido</div></div>
  <p style="text-align:left;font-size:14px">✅ São 10 questões de cada área: Linguagens (com Inglês), Ciências Humanas, Ciências da Natureza e Matemática.<br>✅ Toque na letra para marcar. Dá para voltar e trocar antes de finalizar.<br>✅ Se fechar o app, as respostas ficam salvas neste celular.<br>✅ No final aparece sua nota e um botão para mandar o resultado pelo WhatsApp.</p>
  <button class="btn y" onclick="comecar()">${S.ini?"Continuar simulado":"Começar simulado"} ›</button></div>
  <div class="autora">Elaborado por <b>Dra. Gleyce Santana</b></div>`;
  prog();
}
function comecar(){if(!S.ini){S.ini=Date.now();save()}questao()}

function questao(){
  const i=S.cur,q=Q[i],fim=!!S.fim;
  $("nav").classList.remove("hidden");
  let h=`<div class="card"><span class="tag t-${q.d}">${AREAS[q.d]}</span><span class="origem">Questão ${i+1} de ${Q.length} · ENEM ${q.y} (questão ${q.i})</span>`;
  if(q.c.trim())h+=`<div class="texto">${md(q.c)}</div>`;
  if(q.intro.trim())h+=`<div class="enun">${md(q.intro)}</div>`;
  h+=`<div class="alts">`+q.a.map((a,k)=>{const L="ABCDE"[k];let c="";
    if(fim){if(L===gab(i))c="certa";else if(S.resp[i]===L)c="errada"}else if(S.resp[i]===L)c="sel";
    return `<button class="alt ${c}" onclick="marcar('${L}')"><span class="l">${L}</span><span>${md(a).replace(/<\/?p[^>]*>/g,"")}</span></button>`}).join("")+`</div>`;
  if(fim)h+=`<p style="margin-top:12px;font-size:14px">${S.resp[i]===gab(i)?"✅ Você acertou!":`❌ Sua resposta: <b>${S.resp[i]||"em branco"}</b> · Gabarito: <b>${gab(i)}</b>`}</p>`;
  h+=`</div><div class="autora">Elaborado por <b>Dra. Gleyce Santana</b></div>`;
  $("app").innerHTML=h;
  $("bPrev").disabled=i===0;
  $("bNext").textContent=fim?(i===Q.length-1?"Ver resultado":"Próxima ›"):(i===Q.length-1?"Finalizar ✓":"Próxima ›");
  window.scrollTo(0,0);prog();
}
function marcar(L){if(S.fim)return;S.resp[S.cur]=L;save();questao()}
$("bPrev").onclick=()=>{if(S.cur>0){S.cur--;save();questao()}};
$("bNext").onclick=()=>{if(S.cur<Q.length-1){S.cur++;save();questao()}else if(S.fim)resultado();else confirmar()};
$("bGrid").onclick=()=>{
  $("mbox").innerHTML=`<h3 style="margin-top:0">Ir para a questão</h3><div class="grid">`+Q.map((q,i)=>{
    let c=S.fim?(S.resp[i]===gab(i)?"c":"e"):(S.resp[i]?"ok":"");if(i===S.cur)c+=" cur";
    return `<button class="${c}" onclick="ir(${i})">${i+1}</button>`}).join("")+`</div>
    <p style="font-size:13px;color:#6b7385">${S.fim?"Verde = acertou · Vermelho = errou":"Azul = respondida · Cinza = em branco"}</p>
    ${S.fim?`<button class="btn y" onclick="fechar();resultado()">Ver resultado</button>`:`<button class="btn y" onclick="fechar();confirmar()">Finalizar simulado</button>`}
    <button class="btn s" style="width:100%;margin-top:8px" onclick="fechar()">Fechar</button>`;
  $("modal").classList.add("on")};
function ir(i){S.cur=i;save();fechar();questao()}
function fechar(){$("modal").classList.remove("on")}
$("modal").onclick=e=>{if(e.target.id==="modal")fechar()};
function confirmar(){
  const b=Q.length-respondidas();
  $("mbox").innerHTML=`<h3 style="margin-top:0">Finalizar o simulado?</h3>
  <p>${b?`⚠️ Você ainda tem <b>${b} questão(ões) em branco</b>. Questão em branco conta como erro.`:"Todas as questões foram respondidas. 👏"}</p>
  <p style="font-size:14px;color:#6b7385">Depois de finalizar não dá para trocar as respostas.</p>
  <button class="btn y" onclick="finalizar()">Sim, finalizar e ver minha nota</button>
  <button class="btn s" style="width:100%;margin-top:8px" onclick="fechar()">Voltar e revisar</button>`;
  $("modal").classList.add("on")}
function finalizar(){S.fim=Date.now();save();fechar();resultado()}
function calc(){const r={tot:0,a:{}};Object.keys(AREAS).forEach(k=>r.a[k]=[0,0]);
  Q.forEach((q,i)=>{r.a[q.d][1]++;if(S.resp[i]===gab(i)){r.tot++;r.a[q.d][0]++}});return r}
function nota10(n){return (n/Q.length*10).toFixed(1).replace(".",",")}
function resultado(){
  const r=calc();$("nav").classList.add("hidden");
  const pct=Math.round(r.tot/Q.length*100);
  const msg=pct>=80?"Excelente! 🏆":pct>=60?"Muito bom! 💪":pct>=40?"Bom caminho! 📚":"Bora revisar e mandar ver! 🚀";
  let h=`<div class="card hero"><div class="emoji">🎓</div><h2>${msg}</h2><p>${ALUNO}</p>
  <div class="nota">${nota10(r.tot)}</div><p><b>${r.tot} acertos de ${Q.length}</b> (${pct}%) · tempo ${fmt(tempo())}</p></div>
  <div class="card areas"><h3 style="margin:0 0 6px">Desempenho por área</h3>`+Object.keys(AREAS).map(k=>{const[a,t]=r.a[k];
    return `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${AREAS[k]}</span><b>${a}/${t}</b></div><div class="mini"><div style="width:${a/t*100}%"></div></div></div>`}).join("")+`</div>
  <div class="card"><button class="btn g" onclick="whats()"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.4z"/></svg>Enviar resultado pelo WhatsApp</button>
  <p style="font-size:12.5px;color:#6b7385;text-align:center;margin:10px 0 0">Vai abrir o WhatsApp com o resultado e todas as respostas prontas para enviar.</p></div>
  <div class="card rev"><h3 style="margin:0 0 6px">Correção questão por questão</h3><p style="font-size:13px;color:#6b7385;margin:0 0 6px">Toque numa questão para ver a correção.</p>`+
  Q.map((q,i)=>{const ok=S.resp[i]===gab(i);return `<div class="item" onclick="ir(${i})"><span>${ok?"✅":"❌"} ${i+1}. ${AREAS[q.d]} <span class="origem">· ENEM ${q.y}</span></span><span>Sua: <b>${S.resp[i]||"–"}</b> · Gab: <b>${gab(i)}</b></span></div>`}).join("")+`</div>
  <div class="autora">Elaborado por <b>Dra. Gleyce Santana</b></div>`;
  $("app").innerHTML=h;window.scrollTo(0,0);prog();
}
function whats(){
  const r=calc();
  let t=`📝 *SIMULADO ENEM – RESULTADO*\n👤 ${ALUNO}\n\n🎯 *Nota: ${nota10(r.tot)}* (de 0 a 10)\n✅ ${r.tot} acertos de ${Q.length} (${Math.round(r.tot/Q.length*100)}%)\n⏱ Tempo: ${fmt(tempo())}\n\n*Por área:*\n`;
  Object.keys(AREAS).forEach(k=>t+=`• ${AREAS[k]}: ${r.a[k][0]}/${r.a[k][1]}\n`);
  t+=`\n*Respostas marcadas:*\n`+Q.map((q,i)=>`${i+1}-${S.resp[i]||"_"}${S.resp[i]===gab(i)?"✓":"✗"}`).join("  ");
  t+=`\n\n_Simulado elaborado por Dra. Gleyce Santana_`;
  window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
}
S.fim?resultado():inicio();
</script>
