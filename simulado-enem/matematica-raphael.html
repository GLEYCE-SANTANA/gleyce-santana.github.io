const PARTES=[
{id:"porc",t:"1. Porcentagem, razão e proporção",tempo:"40 min",h:`
<p>É o assunto que <b>mais cai</b> na Matemática do ENEM: preço, desconto, juros, aumento de salário, escala de mapa. Entendendo bem isso, você já ganha muitos pontos.</p>
<h3>O que é porcentagem</h3>
<p><b>x% = x dividido por 100.</b> 25% = 25/100 = 0,25. Então 25% de 80 = 0,25 × 80 = <b>20</b>.</p>
<div class="dica">🧠 <b>De cabeça:</b> 10% = divide por 10 · 1% = divide por 100 · 5% = metade de 10% · 50% = metade · 25% = um quarto.<br>Ex.: 15% de 200 = 10% (20) + 5% (10) = <b>30</b>.</div>
<h3>Fator multiplicativo: o atalho do ENEM</h3>
<div class="tbl"><table><tr><th>Situação</th><th>Multiplique por</th><th>Exemplo</th></tr>
<tr><td><b>Aumento de 10%</b></td><td>1,10</td><td>R$ 50 → 50 × 1,1 = R$ 55</td></tr>
<tr><td><b>Aumento de 35%</b></td><td>1,35</td><td>R$ 200 → 200 × 1,35 = R$ 270</td></tr>
<tr><td><b>Desconto de 20%</b></td><td>0,80</td><td>R$ 50 → 50 × 0,8 = R$ 40</td></tr>
<tr><td><b>Desconto de 5%</b></td><td>0,95</td><td>R$ 300 → 300 × 0,95 = R$ 285</td></tr></table></div>
<h3>Aumentos e descontos seguidos</h3>
<p><b>Multiplique os fatores, não some as porcentagens!</b></p>
<ul><li>Aumento de 10% e depois mais 10%: 1,1 × 1,1 = 1,21 → aumento total de <b>21%</b> (e não 20%).</li>
<li>Aumento de 20% e depois desconto de 20%: 1,2 × 0,8 = 0,96 → o preço fica <b>4% menor</b> (não volta ao valor inicial).</li></ul>
<h3>Variação percentual</h3>
<div class="eq">variação = (novo − antigo) ÷ antigo</div>
<p>Ex.: a passagem foi de R$ 4,00 para R$ 5,00. Variação = 1 ÷ 4 = 0,25 = <b>25% de aumento</b>.</p>
<h3>Regra de três</h3>
<ul><li><b>Direta</b> (as duas crescem juntas): 3 kg custam R$ 15 → 7 kg custam? 15 ÷ 3 = 5 por kg → 7 × 5 = <b>R$ 35</b>.</li>
<li><b>Inversa</b> (uma cresce, a outra diminui): 4 pedreiros fazem um muro em 6 dias → 8 pedreiros fazem em <b>3 dias</b> (o dobro de pessoas, metade do tempo).</li></ul>
<h3>Escala</h3>
<p><b>Escala = tamanho no desenho ÷ tamanho real.</b> Na escala 1:100, 1 cm no desenho = 100 cm = 1 m na realidade.</p>
<p>Ex.: mapa na escala 1:50.000, distância de 4 cm → 4 × 50.000 = 200.000 cm = <b>2 km</b>.</p>`},
{id:"unid",t:"2. Notação científica e unidades de medida",tempo:"35 min",h:`
<p>O ENEM adora números muito grandes (distâncias no espaço, população) e muito pequenos (vírus, células) e conversão de unidades (litro, m³, km).</p>
<h3>Notação científica</h3>
<div class="eq">número = a × 10ⁿ, com a entre 1 e 10</div>
<ul><li><b>Número grande:</b> 45.000.000 = 4,5 × 10⁷ (a vírgula andou 7 casas para a esquerda → expoente positivo).</li>
<li><b>Número pequeno:</b> 0,00032 = 3,2 × 10⁻⁴ (a vírgula andou 4 casas para a direita → expoente negativo).</li>
<li><b>Multiplicar:</b> multiplica os números e <b>soma</b> os expoentes. (2 × 10³) × (3 × 10⁴) = 6 × 10⁷.</li>
<li><b>Dividir:</b> divide os números e <b>subtrai</b> os expoentes. (8 × 10⁶) ÷ (2 × 10²) = 4 × 10⁴.</li></ul>
<h3>Prefixos</h3>
<div class="tbl"><table><tr><th>Prefixo</th><th>Vale</th><th>Exemplo</th></tr>
<tr><td><b>giga (G)</b></td><td>10⁹ = 1 bilhão</td><td>1 GB</td></tr>
<tr><td><b>mega (M)</b></td><td>10⁶ = 1 milhão</td><td>1 MW</td></tr>
<tr><td><b>quilo (k)</b></td><td>10³ = mil</td><td>1 km = 1.000 m</td></tr>
<tr><td><b>mili (m)</b></td><td>10⁻³ = um milésimo</td><td>1 mm = 0,001 m</td></tr>
<tr><td><b>micro (µ)</b></td><td>10⁻⁶ = um milionésimo</td><td>1 µm</td></tr>
<tr><td><b>nano (n)</b></td><td>10⁻⁹ = um bilionésimo</td><td>1 nm</td></tr></table></div>
<h3>Comprimento</h3>
<div class="eq" style="font-size:14px">km → hm → dam → m → dm → cm → mm</div>
<p>Cada passo para a direita: <b>× 10</b>. Para a esquerda: <b>÷ 10</b>. Ex.: 3,2 km = 3.200 m · 150 cm = 1,5 m.</p>
<h3>Área e volume</h3>
<ul><li><b>Área (m²):</b> cada passo vale <b>× 100</b>. 1 m² = 10.000 cm².</li>
<li><b>Volume (m³):</b> cada passo vale <b>× 1.000</b>.</li></ul>
<div class="dica">💧 <b>Decore:</b> 1 m³ = 1.000 litros · 1 dm³ = 1 litro · 1 cm³ = 1 mL.</div>
<h3>Tempo e massa</h3>
<ul><li>1 hora = 60 min = 3.600 s.</li>
<li>⚠️ <b>Pegadinha:</b> 1,5 hora = 1 hora e <b>30 minutos</b> (não 50!). 2,5 h = 150 min.</li>
<li>1 tonelada = 1.000 kg · 1 kg = 1.000 g.</li></ul>`},
{id:"cont",t:"3. Contagem e probabilidade",tempo:"35 min",h:`
<p>Contar possibilidades sem precisar listar uma por uma. O segredo é o <b>princípio multiplicativo</b>.</p>
<h3>Princípio multiplicativo</h3>
<p>Se uma escolha tem <b>m</b> opções e outra tem <b>n</b>, juntas têm <b>m × n</b>.</p>
<ul><li>3 camisetas e 4 bermudas → 3 × 4 = <b>12</b> jeitos de se vestir.</li>
<li>Senha de 3 dígitos (0 a 9, pode repetir) → 10 × 10 × 10 = <b>1.000</b> senhas.</li>
<li>Senha de 3 dígitos <b>diferentes</b> → 10 × 9 × 8 = <b>720</b>.</li></ul>
<h3>Permutação: organizar todos</h3>
<p>De quantas formas 4 amigos podem sentar em 4 cadeiras em fila? 4 × 3 × 2 × 1 = <b>24</b>. Esse produto se escreve <b>4!</b> (fatorial).</p>
<h3>Quando a ordem não importa</h3>
<p>Escolher 2 pessoas entre 4 para uma comissão: 4 × 3 = 12, mas "Ana e Beto" é o mesmo que "Beto e Ana". Divide por 2 → <b>6 comissões</b>.</p>
<div class="dica">🤔 Pergunte sempre: <b>trocar a ordem muda o resultado?</b> Senha, fila e pódio: muda (não divide). Comissão, grupo e salada de frutas: não muda (divide).</div>
<h3>Probabilidade</h3>
<div class="eq">probabilidade = casos favoráveis ÷ casos possíveis</div>
<ul><li>Sair número par num dado: {2, 4, 6} → 3 ÷ 6 = 1/2 = <b>50%</b>.</li>
<li>Tirar uma bola vermelha de uma urna com 3 vermelhas e 7 azuis: 3 ÷ 10 = <b>30%</b>.</li>
<li><b>"E"</b> (um evento e depois outro): <b>multiplica</b>. Duas moedas darem cara: 1/2 × 1/2 = 1/4 = 25%.</li>
<li><b>"OU"</b> (eventos que não acontecem juntos): <b>soma</b>. Dado dar 1 ou 2: 1/6 + 1/6 = 1/3.</li></ul>`},
{id:"geo",t:"4. Geometria plana: áreas e circunferência",tempo:"40 min",h:`
<p>O ENEM pede área de terreno, quantidade de piso, comprimento de cerca, volta de uma roda. Decorando poucas fórmulas, você resolve quase tudo.</p>
<h3>Fórmulas de área</h3>
<div class="tbl"><table><tr><th>Figura</th><th>Área</th><th>Exemplo</th></tr>
<tr><td><b>Retângulo</b></td><td>base × altura</td><td>8 m × 5 m = 40 m²</td></tr>
<tr><td><b>Quadrado</b></td><td>lado × lado</td><td>6 × 6 = 36 m²</td></tr>
<tr><td><b>Triângulo</b></td><td>(base × altura) ÷ 2</td><td>(10 × 4) ÷ 2 = 20 m²</td></tr>
<tr><td><b>Trapézio</b></td><td>(base maior + base menor) × altura ÷ 2</td><td>(10 + 6) × 3 ÷ 2 = 24 m²</td></tr>
<tr><td><b>Círculo</b></td><td>π × raio²</td><td>raio 10 → 3 × 100 = 300 m²</td></tr></table></div>
<h3>Circunferência (o contorno do círculo)</h3>
<div class="eq">comprimento = 2 × π × raio</div>
<ul><li><b>Diâmetro = 2 × raio.</b> Atenção se a questão der o diâmetro!</li>
<li>π ≈ 3,14, mas o ENEM muitas vezes manda usar <b>π = 3</b>. Use o valor que a questão der.</li>
<li>Uma roda de raio 30 cm, numa volta completa, anda 2 × 3 × 30 = <b>180 cm = 1,8 m</b>.</li></ul>
<div class="dica">⚠️ <b>Não confunda:</b> <b>perímetro</b> é o contorno (cerca, rodapé, volta da roda), em metros. <b>Área</b> é a superfície (piso, grama, pintura), em m².</div>
<h3>Teorema de Pitágoras</h3>
<div class="eq">hipotenusa² = cateto² + cateto²</div>
<p>Vale só no <b>triângulo retângulo</b> (que tem ângulo de 90°). A hipotenusa é o lado maior, oposto ao ângulo reto.</p>
<p>Ex.: catetos 6 e 8 → 36 + 64 = 100 → hipotenusa = <b>10</b>.</p>
<div class="dica">🔢 Trios que aparecem muito: <b>3-4-5</b>, <b>6-8-10</b>, <b>5-12-13</b>.</div>
<h3>Ângulos</h3>
<ul><li>Soma dos ângulos de um triângulo: <b>180°</b>.</li><li>Volta completa: <b>360°</b>. Meia volta: 180°. Ângulo reto: 90°.</li></ul>`},
{id:"est",t:"5. Estatística: média, mediana, moda e gráficos",tempo:"25 min",h:`
<p>Todo ENEM tem questões de gráfico e tabela. Às vezes a resposta está toda no gráfico: basta ler com atenção.</p>
<div class="tbl"><table><tr><th>Medida</th><th>Como calcular</th><th>Notas 5, 7, 7, 8, 9</th></tr>
<tr><td><b>Média</b></td><td>Soma tudo e divide pela quantidade</td><td>36 ÷ 5 = <b>7,2</b></td></tr>
<tr><td><b>Mediana</b></td><td>Coloca em ordem e pega o do meio</td><td><b>7</b></td></tr>
<tr><td><b>Moda</b></td><td>O valor que mais aparece</td><td><b>7</b></td></tr></table></div>
<ul><li>Se a quantidade for <b>par</b>, a mediana é a média dos dois do meio. Ex.: 2, 4, 6, 10 → (4 + 6) ÷ 2 = <b>5</b>.</li>
<li><b>Sempre coloque em ordem</b> antes de achar a mediana.</li>
<li>A média é puxada por valores extremos; a mediana não. Por isso salários costumam ser comparados pela mediana.</li></ul>
<h3>Lendo gráficos</h3>
<ul><li>Leia o <b>título</b>, os <b>eixos</b> e a <b>unidade</b> (mil? milhões? %?).</li>
<li>Veja se o eixo começa no zero: barras podem parecer muito diferentes sem ser.</li>
<li>Gráfico de linha mostra evolução no tempo; de pizza, partes de um todo (soma 100%); de barras, comparação.</li></ul>`}
];

{p:"O preço da gasolina subiu 10% em um mês e mais 10% no mês seguinte. O aumento total foi de:",a:["11%","20%","21%","22%","100%"],r:2,e:"Multiplique os fatores: 1,1 × 1,1 = 1,21, ou seja, 21% de aumento. Somar (20%) é o erro mais comum."},
{p:"Uma loja aumentou um produto em 20% e, depois, deu 20% de desconto sobre o novo preço. Em relação ao preço original, o preço final ficou:",a:["igual","4% menor","4% maior","20% menor","40% menor"],r:1,e:"1,2 × 0,8 = 0,96. O preço final é 96% do original, ou seja, 4% menor."},
{p:"A passagem de ônibus passou de R$ 4,00 para R$ 5,00. O aumento percentual foi de:",a:["1%","10%","20%","25%","125%"],r:3,e:"Variação = (5 − 4) ÷ 4 = 1 ÷ 4 = 0,25 = 25%. Divide sempre pelo valor ANTIGO."},
{p:"Se 3 kg de arroz custam R$ 15,00, quanto custam 7 kg do mesmo arroz?",a:["R$ 21,00","R$ 30,00","R$ 35,00","R$ 45,00","R$ 105,00"],r:2,e:"Regra de três direta: cada kg custa 15 ÷ 3 = R$ 5,00. 7 × 5 = R$ 35,00."},
{p:"Quatro pedreiros constroem um muro em 6 dias. Trabalhando no mesmo ritmo, 8 pedreiros construiriam o mesmo muro em:",a:["2 dias","3 dias","6 dias","12 dias","48 dias"],r:1,e:"Regra de três inversa: o dobro de pedreiros faz o trabalho na metade do tempo. 6 ÷ 2 = 3 dias."},
{p:"Em um mapa na escala 1:50.000, duas cidades estão a 4 cm uma da outra. A distância real é:",a:["200 m","2 km","20 km","200 km","12,5 km"],r:1,e:"4 × 50.000 = 200.000 cm. Como 100.000 cm = 1 km, a distância é 2 km."},
{p:"O diâmetro de uma célula é 0,00025 metro. Em notação científica, esse valor é:",a:["2,5 × 10⁻³","2,5 × 10⁻⁴","25 × 10⁻⁵","2,5 × 10⁴","0,25 × 10⁻³"],r:1,e:"A vírgula anda 4 casas para a direita até 2,5. Número pequeno → expoente negativo: 2,5 × 10⁻⁴. O número antes do 10 precisa estar entre 1 e 10."},
{p:"Uma caixa d'água tem volume de 2 m³. Quantos litros ela comporta?",a:["20 L","200 L","2.000 L","20.000 L","2 L"],r:2,e:"1 m³ = 1.000 litros. Então 2 m³ = 2.000 litros."},
{p:"Um filme dura 2,5 horas. Quantos minutos ele tem?",a:["125 min","130 min","150 min","250 min","205 min"],r:2,e:"2,5 h = 2 horas e meia = 120 + 30 = 150 minutos. Cuidado: 0,5 hora é 30 minutos, não 50."},
{p:"Uma pessoa tem 3 camisetas e 4 bermudas. De quantas maneiras diferentes ela pode se vestir com uma camiseta e uma bermuda?",a:["7","9","12","16","24"],r:2,e:"Princípio multiplicativo: 3 × 4 = 12 combinações."},
{p:"De quantas maneiras 4 amigos podem se sentar em 4 cadeiras enfileiradas?",a:["4","8","16","24","256"],r:3,e:"4 opções para a 1ª cadeira, 3 para a 2ª, 2 para a 3ª e 1 para a última: 4 × 3 × 2 × 1 = 24."},
{p:"Uma urna tem 3 bolas vermelhas e 7 azuis. Tirando uma bola ao acaso, a probabilidade de ser vermelha é:",a:["3%","7%","30%","43%","70%"],r:2,e:"Favoráveis ÷ possíveis = 3 ÷ 10 = 0,3 = 30%."},
{p:"Um jardim circular tem 10 m de raio. Usando π = 3, a área do jardim é:",a:["30 m²","60 m²","100 m²","300 m²","600 m²"],r:3,e:"Área = π × r² = 3 × 10² = 3 × 100 = 300 m². (60 m seria o comprimento da borda: 2 × 3 × 10.)"},
{p:"A roda de uma bicicleta tem raio de 30 cm. Usando π = 3, quanto ela anda em uma volta completa?",a:["90 cm","1,8 m","2,7 m","90 m","180 m"],r:1,e:"Comprimento = 2 × π × r = 2 × 3 × 30 = 180 cm = 1,8 m."},
{p:"Uma escada apoiada num muro forma um triângulo retângulo. A base da escada está a 6 m do muro e ela alcança 8 m de altura. O comprimento da escada é:",a:["7 m","10 m","12 m","14 m","48 m"],r:1,e:"Pitágoras: 6² + 8² = 36 + 64 = 100. A raiz de 100 é 10. A escada mede 10 m (trio 6-8-10)."},
{p:"As notas de um aluno foram 5, 7, 7, 8 e 9. A média, a mediana e a moda são, respectivamente:",a:["7; 7; 7","7,2; 7; 7","7,2; 8; 7","7; 7,2; 8","36; 7; 7"],r:1,e:"Média = 36 ÷ 5 = 7,2. Mediana (o do meio, já em ordem) = 7. Moda (mais repetido) = 7."}
];

const BOLSO=["<b>x%</b> = x ÷ 100. 10% = divide por 10. 5% = metade de 10%.","<b>Aumento de p%</b>: × (1 + p/100). <b>Desconto de p%</b>: × (1 − p/100).","Aumentos/descontos seguidos: <b>multiplica os fatores</b>, nunca soma as porcentagens.","<b>Variação %</b> = (novo − antigo) ÷ antigo.","Regra de três: <b>direta</b> crescem juntas; <b>inversa</b> uma sobe e a outra desce.","<b>Escala 1:50.000</b> → 1 cm = 50.000 cm = 500 m.","Notação científica: <b>a × 10ⁿ</b> com a entre 1 e 10. Número pequeno = expoente negativo.","<b>1 m³ = 1.000 L</b> · 1 dm³ = 1 L · 1 cm³ = 1 mL.","<b>0,5 h = 30 min</b> (não 50!).","Contagem: <b>multiplica as opções</b>. Se a ordem não importa, divide pelas repetições.","<b>Probabilidade</b> = favoráveis ÷ possíveis. \"E\" multiplica, \"OU\" soma.","Áreas: retângulo b×h · triângulo b×h÷2 · círculo <b>π r²</b>. Contorno do círculo: <b>2 π r</b>.","<b>Pitágoras</b>: hip² = cat² + cat². Trios 3-4-5 e 6-8-10.","<b>Média</b> soma e divide · <b>mediana</b> o do meio (em ordem) · <b>moda</b> o que mais repete.","Use o valor de <b>π que a questão der</b> (muitas vezes π = 3)."];

const CHK=["Calculo porcentagem de cabeça (10%, 5%, 25%)","Uso o fator multiplicativo em aumentos e descontos","Sei que aumentos seguidos se multiplicam","Resolvo regra de três direta e inversa","Converto escala de mapa para km","Escrevo números em notação científica","Converto m³ em litros e horas em minutos","Uso o princípio multiplicativo e calculo probabilidade","Calculo área do círculo e comprimento da circunferência","Uso o Teorema de Pitágoras","Calculo média, mediana e moda"];

function prog(){
  const tot=PARTES.length+QS.length+CHK.length;
  const feito=Object.keys(S.lidas).length+Object.keys(S.q).length+Object.values(S.chk).filter(Boolean).length;
  $("prog").style.width=Math.round(feito/tot*100)+"%";
  $("sub").textContent=`Progresso: ${Math.round(feito/tot*100)}% · ${Object.values(S.q).filter(x=>x.ok).length}/${QS.length} exercícios certos`;
}
let aba="estudar",qi=0,flipOn=false;
function estudar(){
  return `<div class="card"><span class="tag">Plano de estudo</span><h2>Olá, Raphael! 👋</h2><p>No simulado você acertou <b>5 de 10</b> em Matemática. Os erros foram em porcentagem, notação científica, contagem e circunferência. Estude as 5 partes abaixo, nesta ordem. Toque para abrir.</p>
  <span class="pill">⏱ ~3h no total</span><span class="pill">📖 5 partes</span><span class="pill">✍️ 17 exercícios</span></div>`+
  PARTES.map((p,i)=>`<div class="acc" id="acc-${p.id}"><button onclick="abrir('${p.id}')"><span>${p.t}${S.lidas[p.id]?'<span class="ok">✓ lido</span>':''}</span><span class="seta">›</span></button><div class="body">
   <p style="color:var(--cinza);font-size:13px">⏱ ${p.tempo}</p>${p.h}
   <button class="btn y" style="margin-top:8px" onclick="lido('${p.id}')">${S.lidas[p.id]?"✓ Parte concluída":"Terminei esta parte ✓"}</button></div></div>`).join("")+
  `<div class="card"><p style="margin:0">Depois de ler, vá em <b>🃏 Cartões</b> para memorizar e em <b>✍️ Exercícios</b> para treinar.</p></div>`;
}
function abrir(id){const el=$("acc-"+id);el.classList.toggle("on")}
function lido(id){S.lidas[id]=1;save();render();setTimeout(()=>{const n=PARTES.findIndex(p=>p.id===id)+1;if(PARTES[n])$("acc-"+PARTES[n].id).classList.add("on")},50)}
function cartoes(){
  const i=S.card%CARDS.length,c=CARDS[i];
  return `<div class="card"><span class="tag">Cartões de memória</span><p style="margin:0">Leia a frente, tente lembrar a resposta e toque no cartão para virar.</p></div>
  <div class="flip ${flipOn?'on':''}" onclick="virar()"><div class="in"><div class="f">${c[0]}<small>Toque para ver a resposta · ${i+1} de ${CARDS.length}</small></div><div class="v">${c[1]}<small>Toque para voltar</small></div></div></div>
  <div class="row"><button class="btn s" onclick="mudar(-1)">‹ Anterior</button><button class="btn p" onclick="mudar(1)">Próximo ›</button></div>
  <button class="btn s" style="width:100%;margin-top:10px" onclick="embaralhar()">🔀 Embaralhar</button>`;
}
function virar(){flipOn=!flipOn;document.querySelector(".flip").classList.toggle("on",flipOn)}
function mudar(d){flipOn=false;S.card=(S.card+d+CARDS.length)%CARDS.length;save();render()}
function embaralhar(){for(let i=CARDS.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[CARDS[i],CARDS[j]]=[CARDS[j],CARDS[i]]}S.card=0;flipOn=false;save();render()}
function exercicios(){
  const feitos=Object.keys(S.q).length,cert=Object.values(S.q).filter(x=>x.ok).length;
  if(qi>=QS.length){
    const pct=Math.round(cert/QS.length*100);
    return `<div class="card" style="text-align:center"><span class="tag">Resultado</span><div class="big">${cert}/${QS.length}</div><p><b>${pct>=80?"Excelente! Matemática básica dominada 🚀":pct>=60?"Bom! Revise os que errou 💪":"Releia os resumos e tente de novo 📚"}</b></p>
    <button class="btn y" onclick="refazer()">Refazer exercícios</button><button class="btn s" style="width:100%;margin-top:8px" onclick="qi=0;render()">Ver as questões de novo</button></div>`;
  }
  const q=QS[qi],r=S.q[qi];
  let h=`<div class="card"><span class="tag">Exercício ${qi+1} de ${QS.length}</span><div class="q">${q.p}</div>`+
  ordem(qi).map((k,pos)=>{let c="";if(r){if(k===q.r)c="c";else if(k===r.esc)c="e"}return `<button class="alt ${c}" onclick="resp(${k})"><span class="l">${"ABCDE"[pos]}</span><span>${q.a[k]}</span></button>`}).join("");
  if(r)h+=`<div class="exp ${r.ok?'c':'e'}"><b>${r.ok?"✅ Acertou!":"❌ Não foi dessa vez. Resposta: "+"ABCDE"[ordem(qi).indexOf(q.r)]}</b><br>${q.e}</div>`;
  h+=`</div><div class="row"><button class="btn s" onclick="qi=Math.max(0,qi-1);render()" ${qi===0?"disabled":""}>‹ Voltar</button><button class="btn p" onclick="qi++;render()">${qi===QS.length-1?"Ver resultado":"Próximo ›"}</button></div>
  <p style="text-align:center;color:var(--cinza);font-size:13px;margin-top:10px">${cert} certos de ${feitos} respondidos</p>`;
  return h;
}
function ordem(i){let t=(i+1)*2654435761+55>>>0;const rnd=()=>{t+=0x6D2B79F5;let x=t;x=Math.imul(x^x>>>15,x|1);x^=x+Math.imul(x^x>>>7,x|61);return((x^x>>>14)>>>0)/4294967296};const a=[0,1,2,3,4];for(let k=4;k>0;k--){const j=Math.floor(rnd()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function resp(k){if(S.q[qi])return;S.q[qi]={esc:k,ok:k===QS[qi].r};try{navigator.vibrate&&navigator.vibrate(k===QS[qi].r?60:[80,60,80])}catch(e){};save();render()}
function refazer(){S.q={};qi=0;save();render()}
function revisao(){
  return `<div class="card"><span class="tag">Resumo de bolso</span><h2>⚡ Revise em 5 minutos</h2><p style="color:var(--cinza)">Leia antes de dormir e de manhã, antes da prova.</p><ul>${BOLSO.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <div class="card chk"><span class="tag">Checklist</span><h2>Eu já sei…</h2>${CHK.map((t,i)=>`<label><input type="checkbox" ${S.chk[i]?"checked":""} onchange="S.chk[${i}]=this.checked;save()">${t}</label>`).join("")}</div>`;
}
function render(){
  const V={estudar,cartoes,exercicios,revisao};
  $("app").innerHTML=V[aba]()+FOOT;prog();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{aba=b.dataset.t;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x===b));flipOn=false;render();window.scrollTo(0,0)});
render();
</script>
</body>
</html>
